architecture: Hexagonal / Clean Architecture
databases:
    - PostgreSQL
documentation_index:
    - docs/command-reference.md
    - docs/framework-architecture.md
    - docs/getting-started.md
    - rfcs/0001-qdd-init.md
    - rfcs/0002-qdd-cognitive-layer.md
    - specification/qdd-spec.md
governance:
    certification_first: true
    enforce_rfc: true
    evidence_required_for_fixes: true
languages:
    - Go
plugins:
    - go
    - markdown
project: auto-detected
test_commands:
    - cd cli && go test ./...
    - cd npm && npm test
    - cd cli/pkg/consola/mod/opencode && node --test panel.test.js
    - cd cli/pkg/consola/mod/vscode && node --test
    - comando: cd cli/pkg/consola/mod/qdd-tareas && claude plugin validate . && claude plugin test
      requiere: [claude]
# Repositorio de blueprints de la organización (lo administra 'qdd blueprint add').
blueprints:
    origen: git@github.com:trdago/qdd-blueprints.git
