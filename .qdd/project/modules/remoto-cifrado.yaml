id: remoto-cifrado
nombre: Cifrado de lo que manda el teléfono al PC (RFC 0027)
estado: aprobado
rutas:
    - cli/pkg/remoto/cifrado
    - cli/pkg/remoto/testdata/cifrado1.json
objetivo_operativo:
    problema: 'El relay de QDD Móvil (Supabase) guarda entero, de 72 horas a 4 días, lo que manda el teléfono: el texto de un ejecutar, una respuesta, una acción y las fotos. Quien administra el proyecto de Supabase, o un error de permisos, puede leerlo (FND-321).'
    usuarios: La persona que usa QDD Móvil; la app (qdd-movile), que sella con el mismo fixture; qdd remoto, que abre.
    criterio_de_exito: Lo que el relay guarda de un ejecutar, un responder, una accion o una parte de foto2 no se puede leer sin la privada del PC, y un sellado copiado no sirve en otra solicitud, otro proyecto u otro campo. La app sella exactamente los bytes del fixture compartido.
    caso_real: '2026-11-24: qdd-movile contó en realtime.messages 62 textos o comandos, 31 acciones y 11 respuestas guardados del 21 al 24-11 (FND-321, FND-059 de qdd-movile). La persona aceptó el RFC 0027 el 2026-11-27.'
objetivo_tecnologico:
    arquitectura: 'Paquete aparte de pkg/remoto (la ficha remoto pasó las 60 decisiones, MEJ-073): solo construcción y verificación, sin red ni disco. Sellar es ECIES de una sola vía como HPKE en modo base: X25519 efímera por campo, HKDF-SHA256 (sal efímera ‖ pública del PC, info «qdd cifrado1», 44 bytes: clave AES-256 y nonce de 12) y AES-256-GCM con datos asociados. El sellado viaja como «c1.» + base64url sin relleno de efímera ‖ cifrado ‖ etiqueta. La X25519 del PC la firma su identidad Ed25519 (Clave {identidad, x25519, firma, desde}). Solo biblioteca estándar de Go (crypto/ecdh, crypto/hkdf, crypto/cipher, crypto/ed25519).'
    decisiones:
        - 'Datos asociados por campo («qdd cifrado1|evento|…» con lo que el relay ve en claro: ejecutar|solicitud|proyecto|tipo, responder|solicitud|proyecto|pregunta, accion|solicitud|proyecto, foto2|proyecto|id|parte|de): quien guarda un mensaje no puede repetir su contenido con otra solicitud, y la solicitud ya se ejecuta una sola vez.'
        - 'El nonce sale de HKDF y no viaja: la efímera es nueva en cada campo, así que clave y nonce nunca se repiten.'
        - 'De una parte de foto2 se sellan sus bytes, no su base64: el id sigue siendo el sha256 de la foto en claro y el PC verifica la huella después de abrir.'
        - 'Huella de la identidad: sha256 de la pública, 8 bytes en hex mayúscula en cuatro grupos de cuatro; la misma en la app y en qdd remoto dispositivos.'
        - El fixture compartido (pkg/remoto/testdata/cifrado1.json) lo escribe qdd con efímeras fijas y lo copia qdd-movile sin cambios; un byte distinto se vuelve a acordar con qdd-movile. Sus claves son solo de prueba.
    invariantes:
        - Un campo que no abre (en claro, mal formado, hacia otra clave o con otros datos asociados) es ErrNoAbre y nunca devuelve texto
        - Un sellado abre solo con los datos asociados de su evento, su solicitud (o su foto y parte), su proyecto y su campo
        - La clave de cifrado solo se acepta firmada por la identidad que la acompaña
        - El fixture compartido es exactamente lo que sella este paquete con sus efímeras fijas
pruebas:
    comandos:
        - cd cli && go test ./pkg/remoto/cifrado/
fuentes:
    - rfcs/0027-cifrado-desde-el-telefono.md
    - cli/pkg/remoto/testdata/README.md
ultima_revision: "2026-11-27"
revisado_en_commit: 1bd3f9e996f8
