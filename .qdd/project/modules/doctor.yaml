id: doctor
nombre: QDD Doctor (diagnóstico y autorreparación)
estado: aprobado
rutas:
    - cli/cmd/doctor.go
    - cli/cmd/doctor_todos.go
objetivo_operativo:
    problema: Quien usa QDD necesita saber, con un solo comando, si el entorno del proyecto está sano (estructura .qdd, integraciones de IA, dashboard, blueprints de la organización, consola de Claude Code) y repararlo sin conocer el detalle interno de QDD.
    usuarios: Desarrolladores al abrir un proyecto (también en otro PC), 'qdd init' (que corre doctor --fix al terminar) y las IAs que trabajan en el proyecto.
    criterio_de_exito: '''qdd doctor'' falla solo ante un problema real y dice qué hacer; ''qdd doctor --fix'' deja el entorno operativo sin descartar información, y lo que no puede reparar solo (decisiones humanas, credenciales) lo explica.'
    caso_real: 'v2.0.0: doctor decía ''100% operativo'' en un proyecto con blueprints que no podía reconstruir o atrasados respecto de la organización, porque no revisaba los blueprints.'
objetivo_tecnologico:
    arquitectura: Checklist determinista por grupos (CheckGroup/CheckItem). Con --fix, runSelectiveFixes despacha una reparación por cada ítem fallido y vuelve a evaluar. Escribe un reporte del resultado. El grupo de blueprints delega en pkg/blueprints (Diagnosticar/Reparar). El grupo 5 (findings y certificaciones del proyecto) delega en pkg/findings y pkg/certificaciones. El grupo 6 (consola de Claude Code) aparece solo si se activó en esta máquina y delega en pkg/consola (Diagnosticar/Reparar). El grupo 7 (herramientas del panel) aparece solo si el proyecto tiene alguna y delega en pkg/herramientas (Diagnosticar).
    decisiones:
        - 'Todos los proyectos de la máquina (pedido de qdd-movile, 2026-11-07: 6 de 8 proyectos registrados con las reglas atrasadas): qdd doctor --todos corre este mismo doctor (con --fix si se pide) en cada proyecto de <QDD_HOME>/proyectos.json, como un proceso aparte en su carpeta, y resume una línea por proyecto con lo que falla; una carpeta que ya no existe se nombra y no se corre. Sale con 1 si alguno falla. Nunca corre solo (al instalar o en qdd remoto): --fix deja cambios en git en cada repositorio, quizás con otra sesión trabajando ahí, así que lo pide la persona.'
        - 'Reglas para las IAs al día (FND-126): doctor falla si un archivo tiene el bloque de reglas de una revisión anterior («QCP block revision») y --fix lo renueva conservando lo demás; queda como cambio en git, que el proyecto commitea. Un bloque de revisión mayor no se toca: es de un qdd más nuevo.'
        - 'Reglas una sola vez (MEJ-062: en sfrc el bloque llegaba tres veces por sesión, desde ~/AGENTS.md, la carpeta de proyectos y el proyecto): las IAs cargan también los AGENTS.md y CLAUDE.md de las carpetas padre. doctor falla si uno de ellos, hasta la carpeta personal, trae el bloque de QDD, salvo que esa carpeta sea un proyecto QDD sin proyectos directos adentro (el bloque es suyo) o que el proyecto cuelgue de ella por una carpeta oculta (un worktree en .claude/worktrees). --fix saca solo el bloque, conserva lo demás, deja al lado un respaldo <archivo>.qdd-respaldo-<fecha> con el archivo entero y borra un archivo que era solo el bloque. Las pruebas nunca miran más arriba que su carpeta temporal.'
        - 'Grupo de blueprints: lockfile ilegible → se restaura del último commit; copia legada → migra; falta en esta máquina → reconstruye; lockfile editado → se rehace desde la versión publicada que fija; módulo sin su blueprint → se importa del registro; módulo desactualizado → se re-aplica con sus respuestas (la ficha vuelve a borrador).'
        - Los blueprints se reparan una sola vez por ejecución aunque fallen varios de sus ítems.
        - Sin red, el acceso al repositorio de la organización no falla si la carpeta central ya tiene todo lo que el lockfile fija (degradación elegante).
        - 'Grupo de la consola: con la consola activa, muestra con qué se lee el portapapeles para qdd foto; si falta la herramienta (wl-clipboard o xclip), --fix solo dice qué instalar: qdd no instala paquetes del sistema.'
        - 'Grupo de findings y certificaciones: un estado reconocido pero no canónico (RESOLVED, closed) → --fix escribe la forma canónica; un finding o una certificación del proyecto sin estado reconocido → doctor lo informa con el archivo y no lo repara, porque el estado lo decide una persona (FND-061).'
        - 'Grupo de la consola, además (qdd 2.8.0): el uso real medido de la versión que corre (un registro ilegible es falla y --fix lo aparta) y el modo de permisos de la IA del último mensaje (informativo; sin medir no es falla).'
        - 'Grupo del baúl (RFC 0023): solo aparece con tokens guardados o un .env con secretos. Token vencido o rechazado → falla que cambia la persona en su terminal (qdd baul guardar); sin uso en 90 días y .env con valores → aviso, con los nombres de las claves y nunca un valor; registro roto → --fix lo aparta como evidencia y empieza otro.'
        - 'Grupo de la consola (RFC 0006 §3.6): solo existe si se usó qdd consola activar en esta máquina. Panel ausente, de otra versión que la CLI o desactivado, o barra que ya no es la de QDD → --fix vuelve a activar con lo que se eligió al activar.'
        - 'Grupo de las herramientas del panel (RFC 0011): definición que no se lee o inválida, ejecutable que no está, variable de entorno que falta o prueba de humo que no sale con 0. --fix no las repara: un ejecutable ausente puede no estar compilado o ya no existir, y eso lo decide la persona; el detalle dice el comando (compilarlo, o qdd herramienta quitar <id> --si).'
        - 'Grupo 8 (incidentes de QDD, qdd 2.8.0): aparece solo si existe el registro de esta máquina; un archivo ilegible es falla y --fix lo aparta como .ilegible; lo pendiente de publicar se informa. Apartar un registro de uso ilegible o juntar la cola del panel son autorreparaciones de datos que QDD escribió: se registran como incidente.'
        - 'Grupo 9 (consola remota, RFC 0013): aparece solo si existe <QDD_HOME>/proyectos.json y delega en pkg/remoto/registro. Un registro ilegible es falla (REM-02) y --fix lo aparta como .ilegible (se registra como autorreparación); una ruta que ya no existe es falla (REM-01) y --fix la quita del registro.'
        - 'Grupo de QDD Móvil (2026-11-06: doctor dio 100 % con la persona diciendo que la app no veía el proyecto): aparece solo si este PC se emparejó o tiene el servicio. Revisa sin red, en cmd/remoto_movil_doctor.go: emparejado (--fix no lo intenta, pide el teléfono de la persona), servicio corriendo (--fix lo arranca solo si no corre), respuesta del relay en los últimos 3 latidos, proyecto en el registro y dentro del plan (--fix lo anota; el plan lo decide la persona) y último envío. El texto de un error de envío queda en el registro del servicio, nunca en el reporte. Una cola del teléfono apartada por ilegible se nombra y no se toca, porque puede traer un mensaje de la persona. No comprueba lo que dibuja la app.'
        - 'Grupo de flujos: aparece solo si el proyecto tiene flujos y nombra los que no se pueden usar con su problema. No los repara: corregirlos lo decide quien los escribió.'
    invariantes:
        - Toda funcionalidad de QDD es determinista y doctor sabe diagnosticarla y repararla. Si doctor no puede definir cómo debería comportarse para repararla, la funcionalidad quedó ambigua y se completa antes de darla por terminada.
        - 'Lo que necesita una decisión humana (preguntas de diseño, actualizar de versión, publicar en el repositorio de la organización) doctor no lo decide: dice exactamente qué decidir y con qué comando.'
        - doctor --fix nunca borra una copia de blueprint editada a mano ni actualiza blueprints por su cuenta (pueden traer preguntas que responde el humano).
        - En un proyecto sin blueprints, el grupo de blueprints no usa la red.
pruebas:
    comandos:
        - cd cli && go test ./cmd/ -run Doctor
        - cd cli && go test ./pkg/blueprints/...
        - cd cli && go test ./pkg/consola/...
        - cd cli && go test ./pkg/herramientas/ ./cmd/ -run 'Diagnosticar|Doctor_LasHerramientas'
fuentes:
    - cli/cmd/doctor.go
    - rfcs/0004-blueprints-centrales.md
    - rfcs/0005-reglas-como-principios.md
    - rfcs/0006-estado-por-frente-en-consola.md
ultima_revision: "2026-11-14"
