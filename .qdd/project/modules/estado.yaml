id: estado
nombre: Estado por tarea (qdd estado)
estado: aprobado
rutas:
    - cli/pkg/estado
    - cli/pkg/candado
    - cli/cmd/estado.go
    - cli/cmd/estado_watch.go
    - cli/cmd/estado_vt_windows.go
    - cli/cmd/estado_vt_other.go
    - cli/cmd/mcp_estado.go
    - cli/pkg/audit/estado_check.go
    - cli/pkg/consola
    - cli/cmd/consola.go
    - cli/cmd/consola_ciclo.go
    - cli/cmd/consola_materializar.go
    - cli/cmd/consola_blueprints.go
    - cli/cmd/consola_seguir.go
    - cli/cmd/consola_preguntas.go
    - cli/cmd/consola_telefono.go
    - cli/pkg/materializar
implementa:
    - blueprint: estado-por-tareas
      fuera:
        EPT-C13: qdd acepta las tres fuentes de pulso (en_curso=todos); la opción solo-agente, que rechaza los pulsos de comando, es para quien construye la receta sin ellos
    - blueprint: consola-claude-code
      fuera:
        CCC-C05: la compacta Claude Code con el autoCompactWindow que la persona fija en su configuración; qdd no lo escribe
objetivo_operativo:
    problema: El blueprint estado-por-frente con destino «archivo» pide una tabla de frentes × etapas que sobreviva a una sesión cortada y que un lector automático pueda revisar. Sin herramienta, la tabla se escribe a mano, sin validar, y nadie la ve mientras trabaja.
    usuarios: Las personas que siguen el avance desde la consola (barra de estado y panel) y los agentes que retoman o reportan trabajo (CLI y tool MCP qdd_estado).
    criterio_de_exito: Toda escritura por qdd estado set o cerrar, o por qdd_estado, deja un archivo que cumple EPF-C01…C07, o no escribe nada. qdd audit bloquea un estado.yaml que no los cumple. La barra muestra el resumen sin fallar nunca, y el panel se ve igual en Linux, macOS y Windows.
    caso_real: '2026-10-29, notificador_de_ofertas: los reportes de avance de la sesión ADR-008 (Gemini retirado) se daban en prosa. Con qdd estado quedaron 5 frentes; el set de un ✅ sin evidencia se rechazó con EPF-C02, y la barra mostró «◧ 5 frentes · ⏳4 ❌1».'
objetivo_tecnologico:
    arquitectura: 'pkg/estado es puro y sin terminal: Parse/Load/Save (escritura atómica con archivo temporal y rename), Check (EPF-C01…C07, contra la versión de git HEAD vía Anterior), CheckRespuesta (EPF-A01), Set/Init/Cerrar (validan el frente tocado antes de escribir), y los renderizadores Markdown, Mensajeria, Statusline y Panel. cmd/estado*.go solo conecta flags y terminal: el panel watch usa la pantalla alternativa ANSI, sondea mtime y tamaño (sin inotify) y restaura la terminal al salir. mcp_estado.go y audit/estado_check.go reutilizan las mismas funciones.'
    decisiones:
        - El aviso sin botón de una versión nueva queda solo para una instalación de Windows con qdd.exe dentro del paquete; con el binario en su carpeta de versión (FND-142), Windows tiene el botón. En ese esquema, el flujo vigila bin/actual.txt en vez del binario.
        - 'qdd estado tiene sus propios hooks vacíos: no escribe .qdd/working, no migra ni exige contexto, porque la barra lo ejecuta a cada rato.'
        - 'Barra directa (elegida por el modo goal, opción recomendada por la IA, 2026-11-05; la persona puede revertirla; RFC 0016): con un qdd instalado por npm, statusLine.command es «"<binario>" consola statusline || qdd consola statusline», sin arrancar Node cada 2 s. La ruta la renuevan qdd consola activar y qdd doctor --fix, cambiando solo el comando. Un binario compilado a mano no la escribe ni cambia la barra puesta; una ruta con comillas, $, `, % o saltos de línea usa ComandoBarra.'
        - 'statusline nunca falla ni escribe en stderr y corta a los 50 ms: si algo sale mal, la barra no muestra el segmento.'
        - 'Una escritura solo se rechaza por violaciones del frente que toca: un error previo en otro frente no bloquea el trabajo, pero check y audit lo siguen reportando.'
        - 'qdd estado check avisa sin bloquear de las tareas abiertas con todo listo y de las cerradas que conservan un ⏳ (MEJ-010): terminar una tarea lo decide quien trabaja en ella. esperas y fallas solo traen tareas abiertas (FND-151).'
        - 'Las abreviaturas del panel son únicas: si dos etapas se leen igual (sin distinguir mayúsculas, FND-087), se usa la primera letra más la siguiente que las distinga y no repita otra columna.'
        - 'Dependencias: golang.org/x/term v0.40.0 (compatible con Go 1.24 del CI) y golang.org/x/sys para el modo VT de Windows.'
        - qdd_estado no crea el archivo (init es del humano) ni marca aprobaciones por su cuenta.
        - El mod qdd-tareas dibuja lo que entrega qdd consola panel --json (estado y acciones) y solo pide acciones por id con qdd consola accion; no interpreta reglas ni lee el YAML (RFC 0006 §3.7, consola-claude-code v3.0.0).
        - 'Acciones del panel: aprobar cada ficha en borrador (hasta 9, teclas 1…9), revisar el estado (c, solo lectura) y auditar (u); aprobar usa el mismo código que qdd modules approve.'
        - "Barra de la consola (blueprint consola-claude-code v7, pedido del usuario, 2026-10-31): a la izquierda el modelo y el modo de la IA (el que anotó qdd consola ciclo en las últimas 12 h); a la derecha, uno por línea y terminando 6 columnas antes del borde (FND-091: el relleno empieza con U+2800, que Claude Code no borra), contexto, 5h y semana. El ancho sale de la terminal de la sesión (/dev/tty, CONOUT$ en Windows, o COLUMNS); sin ancho, la lista va sin relleno. Debajo del modelo, a la izquierda, la carpeta del proyecto con solo su nombre («\U0001F4C2 qdd», pedido del usuario, 2026-11-01); el resumen de tareas no: está en el panel."
        - 'Línea de recursos de la barra, al final y a la derecha (qdd consola activar --recursos): D disco del proyecto, G0…Gn % de uso de cada GPU (NVIDIA con nvidia-smi cada 5 s como mucho; las demás por /sys/class/drm), R RAM y C CPU entre dos lecturas, con caché en <QDD_HOME>/claude/recursos.json y tope total de 400 ms.'
        - 'Orden de las secciones del panel (FND-090): estado por tarea (cabecera y tabla), «▶ Para ti», ❌ Fallas y Acciones en una fila de botones, separadas por una línea fina; la confirmación y el resultado van en la sección del botón pulsado. Del proyecto se ve solo el nombre de la carpeta; la de un pedido, desde la del proyecto. Sin sección «Esperando» (pedido del usuario, 2026-10-30): el ⏳ ya está en la tabla y en el resumen, y su detalle en qdd estado ver.'
        - 'Una versión nueva de qdd se ofrece como pedido opcional del canal instalado, igual que un PR: qdd pregunta a npm cada hora, aparte; lo que dice el registro solo se acepta con forma de versión, porque termina dentro de un comando. En Windows es un aviso sin botón mientras npm no pueda reemplazar qdd.exe en uso (issue #107).'
        - 'El panel dibuja tres niveles (títulos en negrita, texto y detalle atenuado) con los colores de la marca de QDD Móvil, en la tabla COLOR del mod: ámbar para lo que espera, azul para lo que corre, verde y rojo para lo que terminó. El texto normal queda en el color de la terminal, porque un mod no puede leer si el tema es claro. Una tarea ocupa una fila y los botones de la cabecera van en su propia fila.'
        - 'Comandos para la persona (RFC 0006 §3.9): la IA deja un comando con qdd_consola_pedir o qdd consola pedir; la cola vive en <QDD_HOME>/claude/pedidos (una por proyecto, no se versiona, tope 9, sin duplicados) y el panel la muestra en «▶ Para ti», con teclas a, b, d… que da qdd. Vale cualquier comando: corre con la shell del sistema en su carpeta.'
        - 'Estados de un pedido (qdd 2.6.2): pendiente → ejecutando → hecho o fallo. Cada pedido guarda su tecla desde que se pide; ejecutando y hecho se ven en gris y sin botón, con falla se ve en rojo con «↻ Reintentar». Un hecho se sigue viendo 30 min; uno ejecutándose más de 15 min se da por cortado (fallo). La cola se cambia con un archivo de bloqueo.'
        - 'Límites de Claude (FND-130): limites.json no retrocede. En la misma ventana lo usado solo sube, una ventana más nueva manda y una que ya pasó no se guarda, porque cada barra escribe lo último que supo su sesión.'
        - 'En Linux un pedido corre en su propio scope (systemd-run --user --scope, FND-129): Setsid no lo saca del cgroup, y lanzado desde una unidad de systemd moriría al detenerse. Sin systemd de usuario se lanza como antes.'
        - 'Un pedido corre aparte del panel (qdd 2.8.0, FND-089): qdd consola accion lo marca ejecutando y lo lanza con «qdd consola correr» en su propia sesión del sistema (Setsid; en Windows, DETACHED_PROCESS) y vuelve en el acto. El panel nunca queda bloqueado y recargarlo o cerrar la terminal no corta el pedido. La cola anota el PID de quien lo corre y el del comando; si los dos murieron sin anotar el resultado, el pedido queda con falla al instante, con ↻ Reintentar. El panel muestra el comando en una línea («… (+N líneas)»); entero, solo al confirmarlo.'
        - 'Orden de los pedidos (qdd 2.8.0, RFC 0006 §3.9): la IA declara dependencias al pedir (--despues/--antes, o despues/antes en qdd_consola_pedir); qdd las guarda por id, entrega la cola con cada pedido justo después de lo que espera (sin dependencias, en el orden en que se pidió) y marca en espera, sin tecla, al que espera algo que no está hecho. El orden no se adivina leyendo los comandos: lo declara quien los pide.'
        - 'Una cola por repositorio (qdd 2.8.0): la cola y la actividad usan estado.ClaveLocal (un worktree es su checkout principal, leyendo .git y commondir sin ejecutar git), y un pedido va a la cola del proyecto donde corre; doctor (grupo 6) junta lo que quedó fuera de lugar.'
        - 'Un pedido extiende una tarea (pedido del usuario, 2026-10-31): lleva su id (--tarea, o la tarea en curso de su propia sesión, FND-153) y, en cada mensaje de la persona, qdd anota la huella de esa fila del estado. Si la fila cambia después (la persona prefirió seguir trabajando en vez de ejecutarlo), el pedido queda retirado: sale de «▶ Para ti» y de las teclas. Cuando la IA lo pide de nuevo para la misma tarea, el nuevo reemplaza al retirado con su misma tecla. Sin estado legible no se retira nada; un retirado se borra a las 24 h.'
        - 'Atender una etapa (pedido del usuario, 2026-10-31): qdd ofrece atender:<tarea>:<índice de etapa> por cada ⏳ o ❌ de una tarea abierta, con el mensaje exacto para la IA (qué etapa, qué espera o qué falla, y que si falta algo deje un pedido con su tarea o pregunte). En el panel cada una de esas celdas es un botón: pide la acción por id (qdd la vuelve a calcular e imprime el mensaje) y lo envía a la conversación con $.prompt.submit, sin confirmación porque no escribe nada por sí misma.'
        - 'Tipos opcionales y textos cortos (FND-092, pedido del usuario, 2026-10-31): qdd consola panel entrega atender solo con --con atender, para que un panel anterior no lo muestre como botón sin tecla; el panel pone en Acciones solo los tipos que dibuja (aprobar y comando con tecla). Lo que leen la persona y la IA es un resumen estilo chat: el mensaje de atender cabe en 280 caracteres (se acortan el nombre y lo citado, nunca las instrucciones) y el motivo de un pedido en 60 (qdd rechaza uno más largo).'
        - '«Todavía no» y armado (pedido del usuario, 2026-11-01: «al ya tener mi intención no debería tener que apretar de nuevo… quedar escuchando para que cuando esté listo se ejecute»): un comando que sale con 75 (EX_TEMPFAIL) no es una falla. Confirmado desde el panel, el pedido queda ◷ armado y el mismo proceso de qdd que lo corre (qdd consola correr, aparte del panel) lo reintenta solo cada 30 s; uno que espera a otro pedido también se confirma antes (tiene su tecla) y corre solo cuando el otro termina (se mira cada 3 s). Vuelve a pendiente con el motivo con ✕ Dejar de esperar (qdd consola desarmar), pasadas 2 h o si el proceso que esperaba murió. El panel lo dice con jerarquía (lectura en F): ◷ y el nombre en amarillo y negrita, «Armado · corre solo cuando…» en amarillo y lo que dijo el comando atenuado debajo; un «todavía no» sin armar, igual.'
        - 'Cinco estados cerrados (qdd 2.8.0): ✅ ⏳ ❌, — no aplica y · sin empezar. Una tarea nueva llena con «·» lo que no se tocó: no queda terminada ni sale del panel (FND-085).'
        - 'Una sola cuenta para los resúmenes (Estado.Totales): tareas pendientes y cada ⏳ y ❌ que tienen; la barra y el JSON del panel (tareas, esperan, fallan) dicen lo mismo (FND-086).'
        - 'El panel dice hace cuánto se actualizó el tablero («Tareas · hace 9 h») y avisa en amarillo cuando quedó viejo: hay tareas pendientes y nadie lo tocó en TableroViejo (2 h). Los ⏳ y ❌ del resumen se nombran como etapas, no como tareas (FND-088).'
        - 'Un ciclo por mensaje (qdd 2.8.0, RFC 0006 §3.9): el mod llama qdd consola ciclo --modo <permission_mode> en cada mensaje de la persona. Un pedido hecho antes del último ciclo ya se vio y sale del tablero (y del resultado del panel); el modo queda para qdd_project_context y para doctor.'
        - 'La palabra visible es «tarea» (blueprint estado-por-tareas): ayuda, tabla, panel y errores. La clave frentes del YAML y el parámetro frente de qdd_estado se mantienen por compatibilidad.'
        - qdd consola activar instala el mod embebido con la versión de la CLI, con los comandos oficiales de Claude Code (alcance de usuario); nada se escribe en el proyecto.
        - 'La ficha del estado se busca por el blueprint que la generó: estado-por-tareas y, como legado, estado-por-frente (RFC 0009); un proyecto migrado conserva el id de su módulo.'
        - 'EPF-C08 lo revisa qdd estado check --respuesta: cada «<tarea> · <etapa>: <estado>» del texto es el de la tabla, y una afirmación sobre una tarea o etapa que no está en ella la contradice (blueprint estado-por-tareas 2.0.0).'
        - 'El panel de Claude Code también dibuja las herramientas del proyecto (ficha herramientas, RFC 0011): ⚙ Config a la derecha de la primera fila, con su lista y el paso a paso para agregar una, y una pestaña (qdd-herr-<id>) por herramienta. Su lógica vive en qdd herramienta; el panel solo dibuja, pide y nunca le pide nada a la IA al usarlas.'
        - 'Objetivos y dependencias (blueprint estado-por-tareas, pedido del usuario, 2026-11-01): un objetivo tiene id, nombre y criterio de éxito; a lo más uno abierto es el foco; se cumple solo con evidencia de su criterio (con sus tareas terminadas dice «tareas listas, falta verificar el criterio») y se cierra cumplido o descartado con motivo. Una tarea dice a qué objetivo sirve (o a ninguno) y de qué tareas depende; no termina (su última etapa que aplica no pasa a ✅, ni se cierra) mientras una no termine; una descartada no libera. Sin dependencias circulares. El archivo es formato 2 solo si usa objetivos o dependencias.'
        - 'Ciclos con nombre (decisión de la persona, 2026-11-01, por ciclo-de-vida-agentico en llmlocal): las etapas del archivo son el ciclo «proyecto»; ciclos: {nombre: [etapas]} declara otros (qdd estado ciclo, o la acción ciclo de qdd_estado) y objetivo.ciclo dice cuál siguen sus tareas, que toman esas etapas (EtapasDe es la única fuente: check, set, terminada, totales, panel, atender y sincronía). Cambiar de ciclo (el objetivo de una tarea, el ciclo de un objetivo o las etapas de un ciclo) conserva las celdas comunes, agrega las nuevas en «·» y no escribe si perdería un ✅ ⏳ o ❌ (EPT-K03). La respuesta trae una tabla por ciclo, la del proyecto primero, y check la lee entera (EPT-K04); el JSON del panel trae ciclos con sus abreviaturas y objetivo.ciclo, y los paneles ponen las abreviaturas del ciclo bajo la cabecera del objetivo (EPT-K05). El archivo es formato 3 solo si usa ciclos: un qdd anterior lo rechaza en vez de perderlos.'
        - "El árbol lo resuelve qdd (Estado.Arbol): por objetivo, el foco primero y las tareas sin objetivo al final; cada tarea cuelga de su primera dependencia visible del mismo objetivo; las que no terminaron se dicen «espera a X» («(otro objetivo)» si es de otro). El JSON del panel trae objetivos, prefijo, notas y la pregunta «¿Cómo vamos con…?» de cada fila; la tabla de la respuesta lleva una fila \U0001F3AF por objetivo con su estado en la última etapa. El panel solo dibuja: pinchar un nombre envía la pregunta a la IA y l ↻ vuelve a leer."
        - 'Sincronía panel–chat (pedido del usuario, 2026-11-01): con cada mensaje, qdd consola ciclo --contexto le dice a la IA qué espera el panel de la persona (pedidos, fichas en borrador, ⏳ suyos), solo si cambió desde el último mensaje; la IA refleja lo que ella resuelva en el chat (qdd_consola_pedir resuelto, descartar --hecho) y el mod relee el panel en el acto tras cada tool o comando de qdd.'
        - 'Aviso al chat (pedido del usuario, 2026-11-02: «el chat principal tiene que enterarse y verse una leyenda cuando acepto la tarea en el panel»; eligió que la IA siga sola y una notificación de escritorio): al confirmar un pedido, el panel le pasa a qdd consola accion --sesion su sesión de Claude Code, que la cola guarda, y le deja a la IA una nota invisible de que corre aparte (no lo repite). Una banda arriba del prompt dice «▶ [a] … · en marcha» o «◷ [a] … · armado» mientras corre. Al terminar (hecho o con falla), qdd consola panel lo entrega con avisar y el mensaje para la IA (≤600: cómo terminó, el final de la salida, qué hacer ahora); el panel de esa sesión lo reclama con qdd consola avisado, lo envía a la conversación con $.prompt.submit (la IA sigue sola) y notifica en el escritorio. Un hecho por avisar no sale con el ciclo hasta avisarse; reintentarlo es otra confirmación. Sin sesión (OpenCode, un qdd anterior) no hay aviso.'
        - 'Materializar (pedido del usuario, 2026-11-01): lo que cambia en el panel aparece como las ventanas del usuario (hypr-materialize): caracteres que parpadean en el acento, bloques que se afinan (█ ▓ ▒ ░) y el texto nítido; lo que se va, al revés. Solo lo mínimo que cambió (una celda de etapa, el nombre de una tarea, la cabecera de un objetivo, una tarjeta de pedido) y la primera vez que el panel dibuja. pkg/materializar es puro (Cuadros: misma entrada, mismos cuadros) y qdd consola materializar los calcula una vez por cambio; el Client del mod (hooks/materializar.js) solo los reproduce cada 40 ms y avisa al terminar. Acento y duraciones de ~/.config/hypr/materialize.conf y su shader si existen (solo se leen); si no, el acento del tema y 0,8 s / 0,4 s. Encendido por defecto: qdd consola efectos off o QDD_EFECTOS=off lo apaga; doctor (grupo 6) dice cómo está y --fix deja legible un interruptor roto. Mientras algo se materializa (0,8 s) no se puede pulsar.'
        - "\U0001F4E6 Blueprints en el panel (pedido del usuario, 2026-11-01): la tecla p abre la lista de los instalados y los disponibles con sus cuentas (instalados, sin IA, con IA, disponibles), que da qdd consola blueprints --json sin red ni IA. ↻ Actualizar catálogo corre qdd blueprint sync sin confirmar (solo escribe la copia central); ⬆ Actualizar, ⬆ Actualizar los N sin la IA y ＋ Instalar corren qdd blueprint add con «s  Sí» (escriben el lockfile); ✦ Aplicar con la IA es lo único que le escribe a la IA, con el mensaje que da qdd (≤280). Tras cada acción el panel relee y dice cuántas versiones nuevas trajo o cuántos se actualizaron o instalaron. qdd vuelve a calcular la acción antes de ejecutarla (prefijo blueprint:)."
        - 'Atajo desde el chat (pedido del usuario, 2026-11-01: sin mouse, en cualquier terminal y sistema): con el chat vacío, la tecla de lo que espera a la persona (un pedido a, b, d…; una ficha 1…9) y Enter no van a la IA: el panel abre su confirmación con el foco en «s  Sí» y otro Enter la aprueba; el teclado vuelve solo al chat. Mientras se escribe la tecla, el chat dice qué abre Enter. Solo se toma un mensaje que es exactamente esa tecla. Un carácter privado U+E000 + la letra (lo que un terminal o el sistema mapee a AltGr+letra) hace lo mismo en un paso sin escribirse. Probado en Claude Code 2.1.300: Alt+letra no llega a los mods y el texto descartado vuelve al chat después del hook, por eso el panel espera 40 ms antes de vaciarlo y tomar el foco.'
        - 'Ids de QDD (FND-109, pedido del usuario, 2026-11-02: «forzar una forma estándar de tener id… usando a qdd»): nombrar una tarea, un objetivo o un ciclo nunca lo crea. Crear es explícito: qdd estado nueva "<nombre>" (acción nueva de qdd_estado) le da el id desde el nombre (sus primeras 4 palabras sin tildes ni palabras vacías, ≤40, con -2 si ya existe); set y tarea crean solo con --nombre y un id de QDD (minúsculas, números y guiones); un objetivo nuevo, con nombre y criterio. Una referencia que no existe (set, cerrar, activar, tarea, --objetivo, --depende-de, --ciclo, el --tarea de un pedido) se rechaza con la más parecida por palabras del id y del nombre o a 1–2 letras del id, o con las abiertas si ninguna se parece. Un nombre que repite el de una tarea abierta se rechaza nombrándola, salvo --aunque-exista. El formato se exige al crear: los ids de un archivo anterior siguen valiendo. Doctor (grupo 5) señala las abiertas que se llaman como su id o casi igual que otra, sin repararlas.'
        - "PRs a un clic, siempre opcionales (pedido del usuario, 2026-11-02: «las autorizaciones de pr también deberían quedar en el panel de la derecha para aceptar en un click (siempre opcional)»; eligió «todo PR abierto del repo»): el panel lanza aparte, a lo más cada minuto, «qdd consola prs», que trae los PRs abiertos con gh y deja un pedido «\U0001F500 Mergear #N» por cada uno (no borradores, hasta 3, sin repetir un PR que un pedido abierto de la IA ya nombra; si ese pedido llega después, reemplaza al automático pendiente, FND-132). Su comando, «qdd consola mergear-pr N», mergea solo con el CI verde y dice «todavía no» (75) con el CI corriendo, así que confirmado queda armado. Opcionales: no abren el panel, no son esperas de la persona, ceden su lugar a un pedido de la IA, uno descartado no vuelve mientras siga abierto y uno pendiente de un PR que se cerró sale solo (pkg/consola/prs.go)."
        - 'Implementa estado-por-tareas 2.2.0 (2026-11-02): los escenarios de ids EPT-I01…I04 se prueban con los datos exactos del blueprint en pkg/estado/conformidad_ids_test.go; implementados.go declara 2.2.0, así que un proyecto con este qdd puede subir a 2.2.0 sin BP-08.'
        - 'Registro de la máquina (RFC 0013, ficha remoto): MarcarCiclo anota el proyecto en <QDD_HOME>/proyectos.json con pkg/remoto/registro, que solo lee si ya está y se vio hace menos de 1 h; es de mejor esfuerzo y nunca corta el ciclo.'
        - 'pkg/consola exporta ClaudeDir (la carpeta de Claude Code: CLAUDE_CONFIG_DIR o ~/.claude) y ProcesoVivo para qdd remoto (RFC 0013): leer el transcript de la consola remota y correr una sola vez por máquina. Son accesores sin efectos; no cambian el panel ni la cola.'
        - 'Preguntas de la consola (decisión de la persona, 2026-11-03; RFC 0013): pkg/consola guarda en <QDD_HOME>/claude/preguntas/<proyecto>.json (con candado, escritura atómica, una cola ilegible se aparta como .ilegible) lo que Claude Code pregunta: AskUserQuestion (origen ia), permisos de herramientas (origen permiso, opciones exactamente permitir y negar) y, para un comando de qdd, preguntas explícitas (origen qdd, sin ningún comando que lo use todavía). qdd consola panel las entrega como acciones tipo pregunta solo con --con pregunta, y qdd consola accion las rechaza: se responden, no se ejecutan. La primera respuesta gana; cerrar desde el PC gana sobre una del teléfono que la consola todavía no recogió. Una pregunta vence sin latido de esperar por 1 min, a los 30 min o al cerrarse su sesión, y sigue visible 5 min después de cerrada; la cola guarda 20 como mucho. El mod qdd-tareas las registra desde classic.PermissionRequest, que corre junto al diálogo de la terminal, solo en sesiones interactivas, en el hilo principal y con QDD Móvil activado; deja decidir primero a los hooks de la persona, y nunca devuelve updatedPermissions.'
        - 'Esperas como preguntas (pedido de sfrc, 2026-11-03; RFC 0013 (d)): PreguntasA suma a la cola cada ⏳ de la persona de las tareas abiertas como pregunta origen estado de respuesta libre (q1, otra, sin opciones), sacada del estado en cada lectura, con id espera-<sha256(tarea, etapa, bloqueo)>; no hay copia que se desincronice y sale cuando la celda cambia. ResponderPregunta de una espera la valida, la deja como instrucción del teléfono para la IA (RegistrarEjecucion) y la recuerda respondida 24 h (VidaEsperaRespondida); responder una que la celda ya no tiene es ErrPreguntaDesconocida.'
        - 'Límites de la máquina en la barra (pedido de qdd-movile, 2026-11-04): qdd consola statusline guarda rate_limits en <QDD_HOME>/claude/limites.json para qdd remoto, al cambiar o cada minuto (CadaLimites), con escritura atómica. Nunca falla ni demora la barra, y una entrada sin límites no borra los últimos.'
        - 'Esperas sin pregunta (decisión de la persona, 2026-11-03): qdd estado check lista, sin bloquear ni cambiar su código de salida, los ⏳ de la persona que no preguntan nada (¿…?) y que ningún pedido abierto cubre. Una nota de avance es válida, por eso es un aviso y no una violación. Esa cuenta es la medición que decide el gate en el Stop hook, que espera a tener esos datos.'
        - 'Solo pregunta lo que pregunta (MEJ-004, qdd-movile, 2026-11-03: de 11 ⏳ publicados al teléfono casi todos eran notas de avance o esperaban un pedido ya armado): un ⏳ de la persona es pregunta solo si su bloqueo tiene una frase ¿…?, y su texto va desde la primera de esas frases hasta el final del bloqueo, porque lo que sigue suele decir qué hacer (FND-155), mientras que lo anterior es historial y no se publica; uno que nombra con [tecla] un pedido abierto no se publica, porque el panel ya lo pide. Sin campo nuevo en estado.yaml: el formato es del blueprint estado-por-tareas.'
        - 'Sin sesión no se pregunta (FND-124, qdd-movile, 2026-11-03): la respuesta a un ⏳ es una instrucción para la IA, y sin una sesión abierta vencía a los 30 min con la pregunta aún «respondida». responderEspera la rechaza sin HaySesion (ErrPreguntaDesconocida, que el teléfono ve como vencida) y qdd remoto no publica esos ⏳. El panel local los sigue listando: ahí hay una sesión si se está mirando.'
        - "Lo mandado desde el teléfono (solo Pro; RFC 0013 «Ejecutar desde el teléfono»): pkg/consola guarda en <QDD_HOME>/claude/telefono/<proyecto>.json (con candado, escritura atómica, una cola ilegible se aparta) cada comando qdd (ejecutando → hecho | fallo, lo anota qdd remoto) e instrucción para la IA (pendiente → hecho al tomarla una sesión, vencida a los 30 min, retirada desde el teléfono o fallo si no se entregó), una vez por solicitud, las 10 más nuevas y lo cerrado 30 min. qdd consola panel las entrega como pedidos origen telefono (id telefono:<solicitud>, con dispositivo y solicitud, sin tecla; una instrucción que espera sale armada) solo con --con telefono, y no son acciones de qdd consola accion. Con QDD Móvil activado y Pro, el panel trae ejecutar {qdd, ia, sugeridos} (cmd datosPanel con remoto.PlanLocal). Cada sesión interactiva del mod qdd-tareas late cada 5 s con qdd consola telefono latir --sesion (<QDD_HOME>/claude/sesiones/<proyecto>.json; viva 30 s, --fin al cerrarse; sin QDD Móvil activado no anota y el mod late cada minuto) y recibe las instrucciones que le tocan, una sola vez entre todas las sesiones; las envía con prompt.submit como «\U0001F4F1 La persona te escribe desde «<teléfono>» (QDD Móvil)…» (nunca algo que no empiece con \U0001F4F1: ni ! ni /) y notifica; si el motor no lo acepta, qdd consola telefono fallo."
        - 'El panel recibe sus datos de un solo proceso por sesión, qdd consola seguir, en vez de lanzar uno cada 2 s (RFC 0016, MEJ-020): se lee en el mismo proceso, cuando fsnotify avisa de una escritura en las carpetas del panel y cada 10 s por lo que depende de la hora, y se emite una línea solo si cambió. El sondeo de 2 s queda solo para un qdd que no trae seguir o mientras el flujo se reabre.'
        - 'El flujo late con una línea vacía cada vez que lee sin cambios: un proceso cuyo lector murió se entera al escribir, en cualquier sistema (os.Getppid no sirve en Windows). Si el binario cambió, termina con 0 y el panel lo reabre con el nuevo.'
        - qdd consola binario le da al panel la ruta real del binario, que evita el envoltorio de Node (y cmd en Windows) en cada llamada; se vuelve a preguntar cada vez que el flujo se corta.
        - 'Una sesión sin terminal (claude -p) no abre el flujo ni lee cada 2 s: no hay panel que dibujar.'
    invariantes:
        - La barra termina sola aunque nadie cierre su stdin (FND-145).
        - Nada escribe estado.yaml sin pasar por Check del frente tocado.
        - Un pedido tiene un solo dueño vivo; un proceso que dejó de serlo termina sin correrlo (FND-125).
        - El binario lleva cada archivo del mod (salvo pruebas y tipos) y doctor no da por sano un panel cuya copia instalada no los tiene todos (FND-107).
        - Un frente nunca se borra; se cierra o se descarta con motivo.
        - statusline no imprime nada si no hay archivo o está ilegible, y nunca sale con error.
        - Sin estado.yaml, qdd audit no reporta EPF-01-CHECK.
        - Ninguna línea del panel es más ancha que la terminal.
        - 'Materializar nunca deja un hueco en blanco por más de 250 ms: si los cuadros no llegan a tiempo, el proceso se corta y se dibuja el texto sin efecto (FND-144).'
        - 'Materializar nunca cambia el ancho de lo que anima ni lo mueve de lugar: cada cuadro mide lo mismo que el texto final, y el último cuadro al abrir es el texto tal cual.'
        - Sin efectos encendidos, o sin Client en la superficie, el panel no pide cuadros y dibuja lo de siempre.
        - Ver los blueprints, traer el catálogo, actualizar e instalar nunca le escriben a la IA; solo ✦ Aplicar lo hace, y lo que escribe el lockfile no corre sin «s  Sí».
        - 'Una etapa que no se tocó nunca se muestra como «no aplica»: es «·» hasta que alguien la marque.'
        - La barra y el panel nunca muestran totales distintos de ⏳ y ❌.
        - Un modo de permisos que no es de Claude Code no se anota, y uno de hace más de 12 h ya no se sabe (sin medir).
        - Una barra propia (statusLine) nunca se reemplaza; antes de cambiar settings.json queda una copia.
        - Sin activar la consola, doctor no revisa nada de Claude Code.
        - qdd consola accion vuelve a calcular las acciones y rechaza un id que no ofrece, sin ejecutar nada.
        - Una acción que escribe (aprobar, auditar) no corre sin --confirmado, que el panel pasa solo después de «s  Sí».
        - 'Un comando pedido por la IA nunca lo ejecuta QDD por su cuenta: corre solo con --confirmado, después de que la persona ve en el panel su motivo, el comando exacto y la carpeta y confirma con «s  Sí». La única excepción es el modo goal que la persona activó en ese proyecto (decisión de la persona, 2026-11-04; RFC 0015): ahí corre sin ese «s  Sí» y queda registrado.'
        - Pedir o descartar un comando no escribe nada en el proyecto.
        - 'Un pedido armado corre solo con el «s  Sí» que ya dio la persona: nunca se arma sin él, una falla de verdad (código distinto de 0 y 75) no se reintenta y no corre dos veces (FND-070).'
        - 'El resultado de un pedido llega a la conversación una sola vez y solo a la sesión que lo confirmó: qdd consola avisado lo marca con la cola bloqueada y sale con 0 solo la primera vez, aunque haya varias sesiones abiertas o el mod se recargue.'
        - 'Ninguna escritura del estado crea una tarea u objetivo por nombrar un id que no existe: sin --nombre (o qdd estado nueva) se rechaza y no cambia el archivo (FND-109).'
        - 'Un pedido aceptado no se ejecuta dos veces: solo uno pendiente o con falla corre, y el cambio a ejecutando se hace con la cola bloqueada (FND-070).'
        - Ningún pedido queda «ejecutando» sin un proceso vivo que lo corra (FND-089), y mientras corre el panel sigue respondiendo.
        - La tecla de un pedido no cambia mientras está abierto (FND-071).
        - Un pedido que espera a otro no hecho no se ejecuta ni tiene botón (FND-080); un orden con ciclo, con una referencia que no está o que va antes de algo ya ejecutado se rechaza sin cambiar la cola.
        - Todas las sesiones de un mismo repositorio (checkout principal y worktrees) ven la misma cola de pedidos (FND-081).
        - Un pedido que sale con 75 nunca queda como falla ni pierde su tecla (FND-082).
        - 'La línea de recursos nunca inventa un valor: una GPU sin contador va con «—» y lo que el sistema no expone se omite.'
        - 'La línea de recursos no demora la barra: si la medición pasa de 400 ms, la barra sale sin ella.'
        - 'Leer, cambiar y escribir la actividad, la cola de pedidos y el registro de uso es uno a la vez entre procesos con un archivo de bloqueo (pkg/candado; uno de más de 10 s es de un proceso que murió): los pulsos corren en segundo plano, uno por herramienta, y sin bloqueo uno que leyó antes borraba lo que otro escribió (FND-097).'
        - 'La actividad (tarea en curso y pulsos, blueprint estado-por-tareas) vive fuera del repositorio (<QDD_HOME>/claude/actividad/, misma clave por proyecto que la cola de pedidos: RutaLocal) y nunca cambia estado.yaml; no usa .qdd/working, que es el archivo del comando qdd en curso (FND-079).'
        - Una tarea sin pulsos durante 120 s deja de estar en curso; cerrarla o descartarla la apaga.
        - Un pulso nunca demora la herramienta, el subagente ni el comando que lo produce; sin tarea en curso no hace nada.
        - qdd consola seguir entrega exactamente el JSON de qdd consola panel --json; los dos salen de la misma función (lecturaPanel).
        - Un flujo sin nadie que lo lea termina solo; nunca queda un proceso huérfano.
        - Una lectura lenta nunca pisa en el panel una línea más nueva del flujo.
