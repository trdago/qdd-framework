id: estado
nombre: Estado por tarea (qdd estado)
estado: aprobado
rutas:
    - cli/pkg/estado
    - cli/cmd/estado.go
    - cli/cmd/estado_watch.go
    - cli/cmd/estado_vt_windows.go
    - cli/cmd/estado_vt_other.go
    - cli/cmd/mcp_estado.go
    - cli/pkg/audit/estado_check.go
    - cli/pkg/consola
    - cli/cmd/consola.go
objetivo_operativo:
    problema: El blueprint estado-por-frente con destino «archivo» pide una tabla de frentes × etapas que sobreviva a una sesión cortada y que un lector automático pueda revisar. Sin herramienta, la tabla se escribe a mano, sin validar, y nadie la ve mientras trabaja.
    usuarios: Las personas que siguen el avance desde la consola (barra de estado y panel) y los agentes que retoman o reportan trabajo (CLI y tool MCP qdd_estado).
    criterio_de_exito: Toda escritura por qdd estado set o cerrar, o por qdd_estado, deja un archivo que cumple EPF-C01…C07, o no escribe nada. qdd audit bloquea un estado.yaml que no los cumple. La barra muestra el resumen sin fallar nunca, y el panel se ve igual en Linux, macOS y Windows.
    caso_real: '2026-10-29, notificador_de_ofertas: los reportes de avance de la sesión ADR-008 (Gemini retirado) se daban en prosa. Con qdd estado quedaron 5 frentes; el set de un ✅ sin evidencia se rechazó con EPF-C02, y la barra mostró «◧ 5 frentes · ⏳4 ❌1».'
objetivo_tecnologico:
    arquitectura: 'pkg/estado es puro y sin terminal: Parse/Load/Save (escritura atómica con archivo temporal y rename), Check (EPF-C01…C07, contra la versión de git HEAD vía Anterior), CheckRespuesta (EPF-A01), Set/Init/Cerrar (validan el frente tocado antes de escribir), y los renderizadores Markdown, Mensajeria, Statusline y Panel. cmd/estado*.go solo conecta flags y terminal: el panel watch usa la pantalla alternativa ANSI, sondea mtime y tamaño (sin inotify) y restaura la terminal al salir. mcp_estado.go y audit/estado_check.go reutilizan las mismas funciones.'
    decisiones:
        - 'qdd estado tiene sus propios hooks vacíos: no escribe .qdd/working, no migra ni exige contexto, porque la barra lo ejecuta a cada rato.'
        - 'statusline nunca falla ni escribe en stderr y corta a los 50 ms: si algo sale mal, la barra no muestra el segmento.'
        - 'Una escritura solo se rechaza por violaciones del frente que toca: un error previo en otro frente no bloquea el trabajo, pero check y audit lo siguen reportando.'
        - 'Las abreviaturas del panel son únicas: si dos etapas empiezan igual, se usa la primera letra más la siguiente que las distinga.'
        - 'Dependencias: golang.org/x/term v0.40.0 (compatible con Go 1.24 del CI) y golang.org/x/sys para el modo VT de Windows.'
        - qdd_estado no crea el archivo (init es del humano) ni marca aprobaciones por su cuenta.
        - El mod qdd-tareas dibuja lo que entrega qdd consola panel --json (estado y acciones) y solo pide acciones por id con qdd consola accion; no interpreta reglas ni lee el YAML (RFC 0006 §3.7, consola-claude-code v3.0.0).
        - 'Acciones del panel: aprobar cada ficha en borrador (hasta 9, teclas 1…9), revisar el estado (c, solo lectura) y auditar (u); aprobar usa el mismo código que qdd modules approve.'
        - 'Línea de recursos de la barra (qdd consola activar --recursos): D disco del proyecto, G0…Gn % de uso de cada GPU (NVIDIA con nvidia-smi cada 5 s como mucho; las demás por /sys/class/drm), R RAM y C CPU entre dos lecturas, con caché en <QDD_HOME>/claude/recursos.json y tope total de 400 ms.'
        - 'Orden de las secciones del panel: estado por frente (cabecera y tabla), Acciones, «▶ Para ti», ⏳ Esperando y ❌ Fallas; la confirmación va en la sección del botón pulsado.'
        - 'El panel dibuja cuatro niveles: números grandes de 3 filas en la cabecera, títulos en negrita, texto y detalle atenuado; cada frente toma el color de su peor etapa.'
        - 'Comandos para la persona (RFC 0006 §3.9): la IA deja un comando con qdd_consola_pedir o qdd consola pedir; la cola vive en <QDD_HOME>/claude/pedidos (una por proyecto, no se versiona, tope 9, sin duplicados) y el panel la muestra en «▶ Para ti», con teclas a, b, d… que da qdd. Vale cualquier comando: corre con la shell del sistema en su carpeta.'
        - 'Estados de un pedido (qdd 2.6.2): pendiente → ejecutando → hecho o fallo. Cada pedido guarda su tecla desde que se pide; ejecutando y hecho se ven en gris y sin botón, con falla se ve en rojo con «↻ Reintentar». Un hecho se sigue viendo 30 min; uno ejecutándose más de 15 min se da por cortado (fallo). La cola se cambia con un archivo de bloqueo.'
        - 'Orden de los pedidos (qdd 2.8.0, RFC 0006 §3.9): la IA declara dependencias al pedir (--despues/--antes, o despues/antes en qdd_consola_pedir); qdd las guarda por id, entrega la cola con cada pedido justo después de lo que espera (sin dependencias, en el orden en que se pidió) y marca en espera, sin tecla, al que espera algo que no está hecho. El orden no se adivina leyendo los comandos: lo declara quien los pide.'
        - 'Una cola por repositorio (qdd 2.8.0): la cola y la actividad usan estado.ClaveLocal (un worktree es su checkout principal, leyendo .git y commondir sin ejecutar git), y un pedido va a la cola del proyecto donde corre; doctor (grupo 6) junta lo que quedó fuera de lugar.'
        - '«Todavía no» (qdd 2.8.0): un comando que sale con 75 (EX_TEMPFAIL) vuelve a pendiente con su aviso, en gris; no es una falla.'
        - 'Cinco estados cerrados (qdd 2.8.0): ✅ ⏳ ❌, — no aplica y · sin empezar. Una tarea nueva llena con «·» lo que no se tocó: no queda terminada ni sale del panel (FND-085).'
        - 'Una sola cuenta para los resúmenes (Estado.Totales): tareas pendientes y cada ⏳ y ❌ que tienen; la barra y el JSON del panel (tareas, esperan, fallan) dicen lo mismo (FND-086).'
        - 'La palabra visible es «tarea» (blueprint estado-por-tareas): ayuda, tabla, panel y errores. La clave frentes del YAML y el parámetro frente de qdd_estado se mantienen por compatibilidad.'
        - qdd consola activar instala el mod embebido con la versión de la CLI, con los comandos oficiales de Claude Code (alcance de usuario); nada se escribe en el proyecto.
        - 'La ficha del estado se busca por el blueprint que la generó: estado-por-tareas y, como legado, estado-por-frente (RFC 0009); un proyecto migrado conserva el id de su módulo.'
    invariantes:
        - Nada escribe estado.yaml sin pasar por Check del frente tocado.
        - Un frente nunca se borra; se cierra o se descarta con motivo.
        - statusline no imprime nada si no hay archivo o está ilegible, y nunca sale con error.
        - Sin estado.yaml, qdd audit no reporta EPF-01-CHECK.
        - Ninguna línea del panel es más ancha que la terminal.
        - 'Una etapa que no se tocó nunca se muestra como «no aplica»: es «·» hasta que alguien la marque.'
        - La barra y el panel nunca muestran totales distintos de ⏳ y ❌.
        - Una barra propia (statusLine) nunca se reemplaza; antes de cambiar settings.json queda una copia.
        - Sin activar la consola, doctor no revisa nada de Claude Code.
        - qdd consola accion vuelve a calcular las acciones y rechaza un id que no ofrece, sin ejecutar nada.
        - Una acción que escribe (aprobar, auditar) no corre sin --confirmado, que el panel pasa solo después de «s  Sí».
        - 'Un comando pedido por la IA nunca lo ejecuta QDD por su cuenta: corre solo con --confirmado, después de que la persona ve en el panel su motivo, el comando exacto y la carpeta y confirma con «s  Sí».'
        - Pedir o descartar un comando no escribe nada en el proyecto.
        - 'Un pedido aceptado no se ejecuta dos veces: solo uno pendiente o con falla corre, y el cambio a ejecutando se hace con la cola bloqueada (FND-070).'
        - La tecla de un pedido no cambia mientras está abierto (FND-071).
        - Un pedido que espera a otro no hecho no se ejecuta ni tiene botón (FND-080); un orden con ciclo, con una referencia que no está o que va antes de algo ya ejecutado se rechaza sin cambiar la cola.
        - Todas las sesiones de un mismo repositorio (checkout principal y worktrees) ven la misma cola de pedidos (FND-081).
        - Un pedido que sale con 75 nunca queda como falla ni pierde su tecla (FND-082).
        - 'La línea de recursos nunca inventa un valor: una GPU sin contador va con «—» y lo que el sistema no expone se omite.'
        - 'La línea de recursos no demora la barra: si la medición pasa de 400 ms, la barra sale sin ella.'
        - 'La actividad (tarea en curso y pulsos, blueprint estado-por-tareas) vive fuera del repositorio (<QDD_HOME>/claude/actividad/, misma clave por proyecto que la cola de pedidos: RutaLocal) y nunca cambia estado.yaml; no usa .qdd/working, que es el archivo del comando qdd en curso (FND-079).'
        - Una tarea sin pulsos durante 120 s deja de estar en curso; cerrarla o descartarla la apaga.
        - Un pulso nunca demora la herramienta, el subagente ni el comando que lo produce; sin tarea en curso no hace nada.
pruebas:
    comandos:
        - cd cli && go test ./pkg/estado/...
        - cd cli && go test ./pkg/audit/ -run EstadoCheck
        - cd cli && go test ./cmd/ -run EstadoTool
        - cd cli && go test ./pkg/consola/...
        - cd cli/pkg/consola/mod/opencode && node --test panel.test.js
        - cd cli && go test ./cmd/ -run ConsolaAccion
        - cd cli/pkg/consola/mod/qdd-tareas && claude plugin validate . && claude plugin test
        - cd cli && GOOS=windows go vet ./cmd ./pkg/estado ./pkg/consola && GOOS=darwin go vet ./cmd ./pkg/estado ./pkg/consola
fuentes:
    - rfcs/0006-estado-por-frente-en-consola.md
    - cli/pkg/estado/estado.go
    - cli/pkg/estado/check.go
    - cli/pkg/estado/set.go
    - cli/pkg/estado/render.go
    - cli/pkg/estado/actividad.go
