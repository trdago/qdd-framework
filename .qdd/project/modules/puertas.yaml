id: puertas
nombre: Puertas de QDD (encaminar por acciones, medido)
estado: aprobado
rutas:
    - cli/pkg/puertas
    - cli/cmd/puertas.go
    - cli/cmd/puertas_hooks.go
objetivo_operativo:
    problema: Las reglas del método (leer la ficha antes de editar, no commitear sin qdd audit, todo arreglo con su finding, publicar solo con la persona) dependen de que la IA se acuerde. Medido sin puertas (tmp/linea_base.py, 30 días), en notificador_de_ofertas solo el 7 % de los commits pasó por qdd audit y el 20 % de los fix nombró su finding; en qdd, el 67 % de las ediciones de código leyó antes la ficha. Adivinar la intención del mensaje cuesta tokens en cada turno y falla con el idioma; una acción (editar, commitear, publicar) se ve sin ambigüedad con cualquier IA.
    usuarios: Las IAs que trabajan en un proyecto QDD (Claude Code por su mod; cualquier otra por los hooks de git), la persona que confirma pedidos en el panel y quien mide si las puertas sirven (qdd puertas informe).
    criterio_de_exito: Tras una semana de uso real en qdd, notificador_de_ofertas y llmlocal, qdd puertas informe muestra por puerta decisiones, rechazos, % corregido al primer reintento, falsos positivos marcados, ms y tokens por rechazo; ≥80 % corregido al primer reintento, ≤5 % falsos positivos, ≤50 ms por decisión y 0 tokens cuando la acción pasa.
    caso_real: '2026-11-02: la línea base mostró que, sin puertas, 93 % de los commits de notificador_de_ofertas se hacían sin el gate y 4 de cada 5 arreglos quedaban sin finding: justo el aprendizaje que QDD dice garantizar.'
objetivo_tecnologico:
    arquitectura: pkg/puertas decide (una función pura por puerta sobre hechos ya leídos) y anota cada decisión; los adaptadores solo traen los hechos y aplican la respuesta. 'qdd puertas revisar <accion>' es la única entrada; la llaman el mod de Claude Code (antes de cada herramienta del agente) y los hooks de git pre-commit y commit-msg que instala 'qdd puertas instalar' (lo corren init y doctor --fix). 'qdd audit' aprobado deja una marca con la huella del árbol de trabajo que revisó; el pre-commit solo la compara. Cada decisión va a <QDD_HOME>/puertas/<proyecto>.jsonl; 'qdd puertas informe' lo resume y 'qdd puertas falso <id>' marca un falso positivo.
    decisiones:
        - 'Puerta ficha: la IA edita un archivo de código sin haber pedido en la sesión el contexto (qdd_project_context o qdd modules context) de una ruta que lo cubra → se rechaza con el comando exacto. Una zona sin ficha no bloquea: el contexto ya le dice a la IA que proponga una.'
        - 'Puerta audit: un commit cuyo árbol de trabajo no coincide con la huella del último qdd audit aprobado → se rechaza. Al día significa que nada cambió desde ese audit (archivos seguidos y nuevos no ignorados), así que commitear una parte de lo auditado pasa. El tablero (.qdd/project/estado.yaml) queda fuera de la huella (FND-299; el modo goal eligió la opción recomendada, 2026-11-22): la IA lo mueve mientras trabaja y cada escritura se valida antes de guardarse. También quedan fuera los registros de las herramientas del MCP, .qdd/project/metrics/mcp_eventos.json y cognitive_history.json (FND-303; la persona eligió la opción recomendada, 2026-11-23): qdd los escribe solo al usar sus herramientas y no son código.'
        - 'Puerta finding: un commit fix(...) o fix: debe nombrar un FND-NNN que exista en .qdd/project/findings con test_result; si no, se rechaza diciendo cómo registrarlo.'
        - 'Puerta publicar: la IA corre gh pr merge, git push de un tag, npm publish o gh release create → se rechaza y se le dice que lo deje como pedido (qdd consola pedir). La política puertas.publicar en .qdd/policies.yaml (pedido por defecto, ia para permitirlo) la decide el proyecto. Un pedido confirmado en el panel no pasa por esta puerta.'
        - 'La IA no puede saltarse una puerta con git commit --no-verify ni con variables de entorno: el mod rechaza esos comandos. La persona sí puede (--no-verify en su terminal) y eso no se mide.'
        - Un rechazo dice qué falta y el comando exacto para resolverlo, en ≤280 caracteres. Si la acción pasa, la IA no recibe nada (0 tokens).
        - 'Corregido al primer reintento: el siguiente intento de la misma puerta en la misma sesión pasa. Tokens por rechazo: caracteres del mensaje / 4.'
        - 'Los hooks conviven con lo que ya hay: se agrega un bloque marcado (# >>> qdd puertas … # <<<) al hook existente o se crea; con husky (core.hooksPath=.husky/_) va en .husky/<hook>. Nunca se reemplaza un hook ajeno.'
        - Las puertas se activan por proyecto con puertas en .qdd/policies.yaml (init las deja activas en proyectos nuevos; en uno existente las activa doctor --fix y lo dice).
        - 'Etapa 1 (2026-11-20): puertas audit y publicar, y el rechazo de --no-verify, desde el mod de Claude Code (tool.call → qdd puertas revisar --dir --sesion -- <comando>, rechazo con salida 2). Etapa 2: puertas ficha y finding, hooks de git (qdd puertas instalar), doctor, init e informe. La carpeta es la del evento o la de la sesión; un cd del comando se sigue, uno de un comando anterior no.'
        - 'Leer un comando: se parte como la shell (&&, ;, |, salto de línea) y lo que va entre comillas o en un heredoc es texto: un mensaje de commit que nombra gh pr merge no es un merge. Un git push publica solo con --tags, --follow-tags, --mirror o si lo que empuja es un tag del repositorio.'
        - 'Etapa 2a (2026-11-20): puertas ficha y finding desde el mod. Finding: el mensaje de -m (también el de un heredoc dentro de -m) o el archivo de -F; basta un FND-NNN nombrado que exista con test_result. Ficha: el mod recuerda las rutas de qdd_project_context y de qdd modules context mientras vive y las pasa con --leida; una ruta leída cuenta si es el archivo o si la ficha que lo cubre también la cubre (relativa a la raíz o a la carpeta de la sesión). Lo que una puerta no revisa (un commit que no es fix, una zona sin ficha) no se anota. Siguen en la etapa 2b: hooks de git, doctor, init e informe.'
        - 'Informe (2026-11-20): cada decisión lleva un id corto (fnv de fecha, puerta, sesión y resultado); qdd puertas falso [id] agrega al mismo registro una marca {falso, motivo} que no es una decisión (sin id, el último rechazo de la sesión). El % corregido cuenta solo los rechazos con un intento siguiente de la misma puerta en la misma sesión; los sin reintento se muestran aparte.'
        - 'Hooks (2026-11-20): pre-commit corre qdd puertas hook pre-commit (puerta audit) y commit-msg la finding (sin las líneas # del editor). Solo el 2 de qdd corta el commit (|| [ $? -ne 2 ] || exit 1, que sirve con sh -e de husky): sin qdd, con uno viejo o si falla, pasa. Dentro de Claude Code (CLAUDECODE) el hook decide pero no anota: el panel ya anotó ese commit. Con husky (core.hooksPath que termina en .husky/_, también absoluto) van en el .husky/ versionado del worktree; husky corre el del checkout principal, así que rigen cuando la rama llega a él. doctor --fix activa puertas: {} solo si ya hay policies.yaml (uno nuevo con solo puertas apagaría lo demás) e instala los hooks; init las deja activas en un proyecto nuevo. Los hooks son de todo el repositorio: se resuelven en su raíz y init y doctor --fix los instalan solo si el proyecto es esa raíz (un proyecto en una subcarpeta, o una prueba como TestPipelineExecution que corre init en cli/cmd, no los toca); en una subcarpeta doctor revisa solo la política, no los hooks (FND-245).'
        - 'Tope (FND-277, 2026-11-21): los hechos de una puerta (git) se esperan hasta 1,5 s, menos que los 2 s del panel, para que la anote qdd; pasado eso qdd puertas revisar y qdd puertas hook dejan pasar y anotan «error». El hook de git no tiene otro tope.'
        - 'Carpetas locales (FND-305, 2026-11-24): .qdd/working y .qdd/cache quedan fuera de la huella, como el tablero y los registros del MCP: las escribe qdd al correr, hasta el propio hook, y un proyecto nuevo no las ignora en git.'
        - 'Restos de la huella (FND-293, 2026-11-22): un corte por el tope deja la huella a medias (qdd sale sin su defer y el git abandonado sigue); cada huella borra los .git/qdd-huella-* de más de 1 min (RestoHuella) y no toca uno reciente, que puede ser de otra huella en curso.'
    invariantes:
        - Una puerta que no puede decidir (qdd ausente, error, más de 2 s) deja pasar la acción y anota el error; nunca bloquea por una falla propia.
        - Decidir no gasta tokens ni llama a un modelo; la misma acción con los mismos hechos da siempre la misma decisión.
        - Cada decisión queda anotada (puerta, resultado, ms, sesión, largo del mensaje), fuera del proyecto y sin contenido de archivos ni rutas absolutas.
        - doctor diagnostica las puertas (política, hooks instalados y vigentes, mod) y doctor --fix las repara sin tocar hooks ajenos.
        - Las puertas no reemplazan al gate de CI; el CI sigue corriendo qdd audit.
pruebas:
    comandos:
        - cd cli && go test ./pkg/puertas/...
        - cd cli && go test ./cmd/ -run 'Puertas|Doctor'
        - cd cli/pkg/consola/mod/qdd-tareas && claude plugin test
fuentes:
    - cli/pkg/uso/uso.go
    - cli/cmd/audit.go
    - cli/pkg/consola/mod/qdd-tareas/hooks/register.js
ultima_revision: "2026-11-24"
revisado_en_commit: 9e0c8e42a7a3
