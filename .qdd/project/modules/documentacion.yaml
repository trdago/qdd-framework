id: documentacion
nombre: Documentación pública
estado: aprobado
rutas:
    - README.md
    - docs
    - npm/README.md
    - rfcs
    - CONTRIBUTING.md
    - SECURITY.md
    - specification
objetivo_operativo:
    problema: Quien llega por GitHub o npm necesita saber qué hace QDD, cómo empezar y qué comandos y tools existen de verdad.
    usuarios: Personas que adoptan QDD, organizaciones que mantienen blueprints y las IAs que trabajan sobre un proyecto con QDD.
    criterio_de_exito: Cada comando de la CLI y cada tool MCP registrada aparece en docs/command-reference.md, ninguna tool documentada falta en el servidor y ningún enlace relativo está roto (cli/cmd/docs_reference_test.go en verde). El README nombra cada comando, los RFC tienen índice y ningún documento repite una afirmación sin respaldo (docs_al_dia_test.go).
    caso_real: FND-072, la documentación quedó atrás del binario desde v1.9.23 (blueprints, fichas de módulo y gate veraz sin documentar).
objetivo_tecnologico:
    arquitectura: Markdown en el repositorio. docs/command-reference.md es la fuente única de comandos y tools; README, getting-started, blueprints y la arquitectura enlazan a ella en vez de repetir el detalle. npm/README.md se publica con el paquete y enlaza a GitHub.
    decisiones:
        - Se documenta solo lo que existe; lo que existe a medias dice su límite ahí mismo, con su finding
        - Los comandos que solo existen por MCP se marcan como tales
    invariantes:
        - 'Ningún archivo versionado (documentación, findings, fichas, evidencias, CHANGELOG, código y pruebas) nombra una organización, un cliente o un proyecto real: el repositorio es público. make test lo revisa con las huellas privadas de la persona; los ejemplos usan proyecto-a, proyecto-b… y mi-organizacion.'
        - Toda capacidad nueva de la CLI o del MCP se documenta en la misma versión que la incorpora
pruebas:
    comandos:
        - cd cli && go test ./cmd/ -run TestDocs_
        - cd cli && go test ./cmd/ -run TestReadme_
findings:
    - FND-048
    - FND-072
    - FND-307
fuentes:
    - docs/command-reference.md
    - rfcs/0003-blueprints.md
    - CHANGELOG.md
ultima_revision: "2026-11-26"
revisado_en_commit: 1aec086bbf7d
