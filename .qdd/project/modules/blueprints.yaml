id: blueprints
nombre: Blueprints de la organización
estado: aprobado
rutas:
    - cli/pkg/blueprints
    - cli/cmd/blueprints.go
    - cli/cmd/mcp_blueprints.go
    - cli/cmd/blueprints_calidad.go
    - cli/cmd/blueprints_receta.go
    - cli/pkg/audit/blueprint_check.go
objetivo_operativo:
    problema: Cada organización mantiene sus estándares de módulo (auth, auditoría…) en su propio repositorio, privado si quiere, y todos sus proyectos deben usarlos, mantenerlos al día y aportar mejoras sin que cada proyecto cargue con una copia del repositorio. Una persona puede además sumar estándares de otras fuentes (p. ej. su repositorio público) sin mezclarlos con los de la organización.
    usuarios: Equipos que desarrollan varios proyectos con QDD (p. ej. FairplayChile) y las IAs que trabajan en ellos vía MCP.
    criterio_de_exito: Un proyecto cuyo remote git pertenece a una organización registrada ve sus blueprints sin configurar nada; el repositorio se clona una sola vez por máquina; el proyecto solo versiona el lockfile; el CI reconstruye cada blueprint desde el commit del lockfile; un proyecto del esquema anterior se migra solo, una vez.
    caso_real: 'RFC 0004: con 10 proyectos de FairplayChile había 10 registros, 10 copias vendorizadas y ningún flujo para aportar al repositorio de la organización.'
objetivo_tecnologico:
    arquitectura: 'Carpeta central por usuario ($QDD_HOME, por defecto ~/.local/share/qdd/blueprints): organizaciones.yaml (registro por patrón de remote git), mirrors/ (un clon espejo por repositorio, fetch incremental), store/<sha256>/ (contenido inmutable, de solo lectura, compartido por todos los proyectos) y aportes/ (clon editable para proponer cambios). El proyecto guarda solo .qdd/blueprints.lock.yaml (formato 2) con origen, subcarpeta, commit y sha256. Para qdd doctor (grupo 4), Diagnosticar revisa copias legadas, carpeta central, acceso al repositorio, vigencia y versión de los módulos, y Reparar los repara de forma determinista (diagnostico.go).'
    decisiones:
        - 'Opción A del RFC 0004: el CI reconstruye desde el commit del lockfile con credenciales de solo lectura; no se vendoriza.'
        - 'El store se direcciona por contenido (sha256): dos proyectos con la misma versión comparten la misma carpeta.'
        - 'Diagnosticar solo usa la red para comprobar el acceso al repositorio de un proyecto con blueprints; Reparar no decide lo que necesita a una persona (preguntas nuevas, actualizar de versión, aportar a la organización): dice qué hacer (FND-053).'
        - 'Varias fuentes (RFC 0007): el lockfile dice de qué repositorio salió cada blueprint. Sin origen, add, sync, contribute, propose y doctor usan esa fuente; los ids nuevos, --paquete y --todos van al repositorio registrado. --origen elige la fuente de un blueprint nuevo. No hay configuración extra: las fuentes son las del lockfile más la registrada.'
        - Una fuente puede ser cualquier URL git o carpeta local, incluida la raíz de un repositorio bare (FND-067). Ante un error de acceso a una URL SSH, QDD sugiere su URL HTTPS equivalente, que en un repositorio público no necesita llave (FND-068); al publicar (propose, release), si el push SSH falla, reintenta por esa URL HTTPS con las credenciales de git y lo dice (FND-063).
        - 'Un blueprint puede reemplazar a otros de su misma fuente (RFC 0009, reemplaza: [id…]): el gate lo dice con BP-07-REPLACED (sin red, desde el espejo, y sin repetir BP-06) y qdd blueprint add <nuevo> saca el viejo del lockfile y pasa sus registros de aplicación al nuevo, con el mismo módulo, las mismas respuestas y la versión vieja, para que BP-03 pida volver a aplicarlo. doctor lo informa pero no migra.'
        - 'La migración del esquema anterior (.qdd/blueprints/<id>) es automática y ocurre una vez: mueve al store las copias íntegras y deja las alteradas como BP-05-LEGACY para que una IA lleve sus cambios al repositorio de la organización.'
        - 'Índice de un blueprint (pedido del usuario, 2026-10-31): leer blueprints no cuesta miles de tokens. IndiceDe resume cada uno (identidad, preguntas con sus opciones, cuántas invariantes, qué escenarios y la línea de cada sección en blueprint.yaml); se calcula del contenido ya verificado por su sha256, sin archivos extra en el store que se puedan desactualizar. qdd_blueprint_list lista una línea por blueprint y da el detalle por sección (seccion); qdd blueprint list --json y show --json/--seccion lo mismo en la terminal; contribute dice en qué línea está cada sección para editar sin leer el archivo entero. El índice es para elegir; para construir, la receta completa (qdd_blueprint_apply deja en la ficha cada decisión, invariante y escenario con su detalle), que la salida siempre nombra.'
        - 'Calidad de la receta (pedido del usuario, 2026-10-31: «mide la calidad de los que ya existen y si se pueden optimizar, sin perder calidad»): un blueprint es como el plano de un arma en el juego Rust, con él se construye la pieza entera en cualquier lenguaje. CalidadDe lo mide de forma determinista (calidad.go): defectos de la receta (CAL-01 a CAL-05 y CAL-09, −10) y mejoras que la acortan sin quitarle nada (CAL-06 a CAL-08, −3), cada uno con su arreglo, y los tokens del índice y de la receta (por defecto y máxima, con el mismo componer de apply). qdd blueprint quality y qdd_blueprint_list {seccion: calidad} lo muestran; sin importados, miden lo publicado en la fuente.'
        - 'Receta reproducible (pedido del usuario, 2026-10-31: «el encargado de generar los blueprints es el mismo QDD… separando los detalles técnicos de los del negocio que deben ser adaptativos» y «preguntar hasta estar seguro… pruebas de generación ciega»): un blueprint declara alcance (incluye/excluye), parámetros de negocio {{id}} que la persona decide al aplicar (como las preguntas), constantes técnicas {{id}} con su porqué, pasos en orden (acción → resultado, con los escenarios que verifica) y requiere_qdd. qdd blueprint distill destila un borrador desde una ficha aprobada y da la entrevista (Entrevista: lo que solo la persona resuelve); qdd blueprint certify prepara una carpeta por variante (sugerida y adaptada) con solo RECETA.md fuera del proyecto, un agente nuevo la construye, y --verificar corre sus pruebas y exige cada escenario: certificacion.yaml queda atada a la huella de la receta (sin su versión).'
    invariantes:
        - Una receta con pasos no se propone sin una certificación ciega vigente (aprobada y de esa misma receta); los valores de negocio los decide la persona al aplicar, nunca la IA, y una ficha generada nunca queda con un {{id}} sin reemplazar.
        - 'Una versión nueva de un blueprint nunca empeora su receta: qdd blueprint propose rechaza un aporte que agrega defectos (los que ya tenía no bloquean) y un blueprint nuevo nace sin defectos; ningún arreglo de calidad quita una regla, opción ni escenario.'
        - Ningún proyecto contiene una copia ni un clon del repositorio de blueprints (salvo copias legadas pendientes de migrar, que el gate reporta).
        - Lo que se usa de un blueprint siempre coincide con el sha256 del lockfile; si no, BP-02-ALTERED.
        - Un repositorio git se clona con las credenciales del usuario, sin prompts interactivos y con protocol.ext.allow=never.
        - Las preguntas de diseño de un blueprint las responde un humano, nunca la IA.
        - 'Un id pertenece a una sola fuente: importarlo desde otra se rechaza salvo con --reemplazar, y un blueprint importado se aporta siempre a su fuente (FND-064).'
        - 'Si una fuente falla al importar o sincronizar, no oculta ni deja a medias las demás: el lockfile queda como estaba y el problema se informa por fuente (FND-065, FND-066).'
        - 'La migración nunca descarta cambios: una copia legada alterada o fuera del lockfile no se borra.'
        - Migrar a un blueprint que reemplaza a otro nunca cambia el id del módulo ni responde por la persona las preguntas nuevas; un reemplazo de otra fuente no toca el blueprint importado.
pruebas:
    comandos:
        - cd cli && go test ./pkg/blueprints/... ./pkg/audit/... ./cmd/...
fuentes:
    - rfcs/0003-blueprints.md
    - rfcs/0004-blueprints-centrales.md
    - rfcs/0007-fuentes-de-blueprints.md
    - rfcs/0009-blueprints-que-reemplazan.md
    - cli/pkg/blueprints/diagnostico.go
ultima_revision: "2026-10-31"
revisado_en_commit: b1642565cdda
