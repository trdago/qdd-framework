id: remoto
nombre: Consola remota (qdd remoto, QDD Móvil)
estado: aprobado
rutas:
    - cli/pkg/remoto
    - cli/cmd/remoto.go
    - cli/cmd/remoto_doctor.go
    - cli/cmd/remoto_relay.go
    - cli/cmd/remoto_dispositivos.go
    - cli/cmd/login.go
    - cli/cmd/sincronizar.go
objetivo_operativo:
    problema: El panel de QDD solo existe al lado de la conversación, en el PC. Fuera del escritorio no hay forma de ver qué falta para cumplir el objetivo en foco de cada proyecto, aprobar los pedidos y las fichas que esperan a la persona, ni ver qué hace la IA en este momento; y la persona trabaja en varios proyectos y en más de un PC.
    usuarios: La persona que trabaja con QDD en uno o varios PCs y quiere seguir y aprobar desde el teléfono (app QDD Móvil); la app y cualquier cliente futuro del protocolo.
    criterio_de_exito: La app muestra en vivo los proyectos de cada PC encendido con el mismo panel que qdd consola panel --json, y un PC apagado como «apagado»; aprobar desde el teléfono ejecuta una sola vez aunque llegue repetido y queda en el log local; un teléfono revocado no puede; la consola se transmite solo con espectadores, sin secretos, y se pausa al pasar el cupo. Con Pro, un comando qdd de la lista permitida mandado desde el teléfono corre una sola vez sin shell y devuelve el final de su salida sin secretos, y una instrucción llega una vez a la sesión abierta del proyecto como mensaje de la persona.
    caso_real: '2026-11-02: el usuario pidió una vista móvil en tiempo real de todos sus proyectos y PCs para aprobar pedidos y fichas fuera del escritorio (RFC 0013, plan del usuario), con Supabase solo como relay.'
objetivo_tecnologico:
    arquitectura: 'pkg/remoto/registro guarda los proyectos de la máquina (<QDD_HOME>/proyectos.json, 0600, atómico con pkg/candado); lo anotan qdd init y consola.MarcarCiclo, y no depende de pkg/consola. pkg/remoto arma el estado (Armar: un consola.Panel por proyecto, o su error), habla con el relay (RPC de PostgREST public.qdd_remoto_* y la Edge Function avisar), es un cliente Phoenix de Supabase Realtime (broadcast, presence, heartbeat, reconexión), calcula deltas, verifica y ejecuta acciones firmadas vía pkg/consola, transmite la consola desde el transcript de Claude Code y oculta secretos antes de enviar nada. cmd/remoto.go conecta los subcomandos (estado, activar, emparejar, desactivar, dispositivos, revocar, correr) y cmd/remoto_doctor.go el grupo 9 de doctor.'
    decisiones:
        - 'En Windows, cada versión de qdd vive en su carpeta (FND-142): consola actualizar apunta la tarea a la versión instalada sin arrancarla, lo que corre termina al ver bin/actual.txt y la tarea lo reinicia; doctor lo revisa (REM-04). Un binario compilado a mano no cambia la tarea.'
        - 'qdd login (issue #102, 2026-11-04): emparejar es el login, igual que qdd remoto activar. Sin banderas consulta el directorio firmado y, si no responde, lo avisa antes de dar el código y sigue con lo guardado; --relay y --clave son para quien opera su relay. Decisión de la persona: el remoto es una capacidad de qdd, pero la tecnología del relay (proyecto de Supabase, migraciones, funciones, secretos, app) es de qdd-movile, que desde 2026-11-06 tiene su propio proyecto.'
        - 'qdd remoto correr mira en cada sondeo el qdd del que arrancó (tamaño y fecha): si se reemplazó en el disco, termina con ErrActualizado y salida 3, y el servicio (systemd Restart=on-failure, launchd KeepAlive, tarea de Windows RestartOnFailure) lo arranca con la versión nueva. Mientras el archivo falta (npm lo está reemplazando) sigue (FND-120).'
        - 'El registro vive en un subpaquete (pkg/remoto/registro) porque pkg/consola lo anota en cada ciclo y pkg/remoto importa pkg/consola: así no hay ciclo de imports. Anotar solo lee si el proyecto está y se vio hace menos de 1 h; anotar es de mejor esfuerzo y no corta ni el ciclo ni init.'
        - 'Un registro ilegible no se trata como vacío (anotar encima perdería los proyectos): Anotar devuelve error, doctor lo señala (REM-02) y --fix lo aparta como proyectos.json.ilegible. REM-01 señala las rutas que ya no existen y --fix las quita.'
        - '«Rechazar» desde el teléfono es la acción rechazar:<id de la acción de un pedido>: el PC la acepta solo si el panel ofrece ese pedido y nadie lo aprobó (uno aprobado responde ya_aprobado con el lugar), lo descarta de la cola con consola.Descartar sin ejecutarlo y queda en el log. No es una acción del panel del PC, que ya tiene su ✕.'
        - 'Cada consola mirada recuerda qué teléfonos la miran: uno nuevo provoca otra tanda de inicio y, si está pausada, otro aviso del motivo (FND-110). Un sync reenvía además el estado de las solicitudes de la última media hora, como mucho 20, para el teléfono que se desconectó mientras corrían (FND-111).'
        - 'qdd remoto tiene hooks propios vacíos (como qdd consola): no exige proyecto, no escribe .qdd/working y su tráfico no cuenta como uso (inv. 10).'
        - 'El panel de cada proyecto es consola.Panel(root, now, pregunta) con la versión de qdd, igual que qdd consola panel --json --con pregunta, sin atender (no tiene sentido lejos de la conversación) y sin efectos. Las preguntas salen pasadas por el ocultador: etiqueta, detalle, resultado, encabezado, texto, opciones y el detalle del permiso.'
        - 'Preguntas desde el teléfono (decisión de la persona, 2026-11-03; RFC 0013 «Preguntas desde el teléfono»): el evento responder del relay (public.qdd_remoto_responder) trae {solicitud, proyecto, pregunta, respuesta (el texto de p_respuesta::text), dispositivo, nombre, en, firma}, firmado con hmac_sha256 sobre solicitud|proyecto|pregunta|respuesta|dispositivo|en, igual que las acciones. Se verifica, se guarda en solicitudes.json con la pregunta y se responde con accion_estado {solicitud, estado, resultado, lugar} una sola vez: hecha, ya_aprobado (lugar «PC» o el nombre del teléfono que ganó), vencida o rechazada, con el motivo en resultado. Si la terminal gana después de un hecha, seguirPreguntas corrige esa solicitud a ya_aprobado PC. Desde el teléfono un permiso solo se permite una vez o se niega. Como las aprobaciones, no depende del plan ni del interruptor de la consola (inv. 14).'
        - 'Ejecutar desde el teléfono (solo Pro, decisión de la persona, 2026-11-03; RFC 0013 «Ejecutar desde el teléfono»): el evento ejecutar del relay (public.qdd_remoto_ejecutar) trae {version, solicitud, proyecto, tipo, texto, dispositivo, nombre, en, firma}, firmado con hmac_sha256 sobre solicitud|proyecto|tipo|texto|dispositivo|en como responder (nombre no va firmado). Sin firma válida o viejo se descarta sin respuesta y sin recordarlo; si no, se guarda en solicitudes.json (con ejecutar = qdd | ia) y se responde accion_estado {solicitud, accion_id: ejecutar, estado, resultado} una sola vez. Se rechaza con el motivo un teléfono revocado, un proyecto que no se publica, una versión distinta de 1, un texto que no pasa la misma validación del relay y, sin Pro, «requiere Pro». Pro es el plan del último latido (b.plan.Pro(): plan == pro; hasta el primero, Gratis); el bucle lo guarda en <QDD_HOME>/remoto/plan.json (0600, solo si cambió) para qdd consola panel y qdd remoto estado (PlanLocal: Gratis sin credenciales o sin plan guardado).'
        - 'Un comando qdd del teléfono (ejecutar.go): se rechaza entero con metacaracteres de shell (; | & $ ` > < ( )), saltos de línea, controles o la palabra qdd delante; se parte por espacios con comillas simples o dobles y se compara con la lista permitida, del más largo al más corto: audit y doctor sin nada más (doctor nunca --fix ni -f), estado con --json, --alcance=abiertos|todos y --formato=markdown|mensajeria, estado check con --json, modules list, blueprint list con --json y blueprint quality con un id (^[a-z0-9][a-z0-9._-]{0,79}$) y --json. status y sprint status no están: no son comandos de la CLI (caen al manejador de intenciones deprecado). Corre os.Executable con exec.CommandContext en la raíz del proyecto, sin entrada, con gitenv.Limpio(os.Environ()), WaitDelay de 5 s y tope de 10 min, uno por proyecto a la vez; guarda los últimos 64 KB de stdout+stderr, los pasa enteros por el ocultador y manda el final (4000 caracteres). recibida → ejecutando → hecha | fallo; uno que corría cuando qdd remoto se cerró termina en fallo al volver.'
        - 'Editar un flujo desde el teléfono (solo Pro, decisión de la persona, 2026-11-06; RFC 0013): el tipo flujo del evento ejecutar lleva en texto un JSON de esquema cerrado. Se aplica al recibirlo, con las funciones de pkg/flujo, sin shell y sin comando, y no espera a un comando que corra. Comentar y pedir detalle llaman a la IA como una instrucción; si no llega, lo pendiente vuelve a quedar por enviar. El panel dice ejecutar.flujos. La biometría al entrar a editar la exige la app.'
        - 'Entrega confirmada (FND-138): el panel late con --confirma; la instrucción tomada queda ejecutando, y solo pasa a hecha cuando el panel confirma que $.prompt.submit la aceptó. Si responde { drop } o lanza un error, pasa a fallo con el motivo. Sin confirmación en TopeEntrega (15 min) pasa a fallo diciendo que puede no haber llegado; nunca vuelve a la cola, para que se entregue una sola vez. Un panel anterior, sin --confirma, sigue dándola por entregada al tomarla.'
        - 'Respuesta a un ⏳ (FND-141; botones, 2026-11-07): el ⏳ se responde con la misma firma, y la respuesta queda en el estado del proyecto (consola.aplicarAlEstado), con o sin sesión. Por eso se cierra hecha al contestar, con resultado lo que quedó (Pregunta.Aplicado: «el ⏳ pasa a la IA para que lo verifique», «la etapa queda en — (ya no va)», «vuelve a preguntarse en 24 h»), y el panel publicado ya no esconde los ⏳ sin sesión. Una solicitud anterior que todavía siga una instrucción (s.Instruccion) se sigue cerrando como antes: hecha cuando la sesión confirma, y fallo, vencida o rechazada con consola.ReabrirEspera si no llegó.'
        - 'Una instrucción del teléfono queda en la cola del teléfono de pkg/consola (pendiente) y se responde recibida diciendo que espera una sesión, o ejecutando si una sesión de Claude Code latió en los últimos 30 s; seguirEjecuciones la cierra hecha cuando una sesión la toma, vencida a los 30 min, rechazada si el teléfono la retiró (rechazar:telefono:<solicitud>, solo mientras espera) y fallo si la sesión no pudo entregarla. El panel publicado pide --con telefono y pasa esas acciones por el ocultador (etiqueta, detalle, aviso, resultado); con Pro cada panel trae ejecutar {qdd: true, ia: hay sesión viva, sugeridos: la lista permitida} (ConEjecutar), y un cambio de plan pide un delta.'
        - 'FND-118: una acción aprobada desde el teléfono que corre en segundo plano (auditar, revisar, aprobar) responde con el final de su salida (600 caracteres), pasada entera por el ocultador: el veredicto de audit está al final.'
        - 'Sin tools MCP nuevas: la CLI basta y tools/list está al borde del presupuesto.'
        - 'FND-128: el servicio deja vivo lo que lanzó al reiniciarse (KillMode=process en systemd, AbandonProcessGroup en launchd): qdd remoto termina al ver un qdd nuevo, y un pedido que lo está instalando tiene que seguir. Doctor reconoce un servicio de antes (REM-03) y --fix solo le agrega esa línea: el binario, el PATH y QDD_HOME son los que eligió la persona al activarlo.'
        - 'Reglas atrasadas en el teléfono (pedido de qdd-movile, 2026-11-07): cada proyecto publicado trae reglas_atrasadas (integration.BloquesViejos), fuera del panel; [] es al día y sin el campo no se midió. Está en la estructura, así que un cambio manda el estado completo.'
        - 'Sincronizar (la persona por qdd-movile, 2026-11-07; eligió «releer y avisar»): el evento sincronizar del teléfono, sin payload ni firma y gratis porque no escribe nada, hace que el PC relea de cero, mande un estado completo y responda al final sincronizado con, por cada proyecto con una sesión de Claude Code viva, lo que el tablero ya no dice bien: espera_tras_pedido, lista_sin_cerrar, terminada_con_espera y flujo_invalido. No corrige nada y no toca las reglas de las IAs. qdd sincronizar da lo mismo en el PC.'
        - 'Modo goal (RFC 0015): qdd_remoto_ejecutar acepta goal activar y goal desactivar, sin banderas y fuera de Sugeridos. Un comando del teléfono corre sin CLAUDECODE: lo mandó la persona. Los avisos goal_pausado y goal_terminado se piden al llegar a ese estado.'
        - 'Dependencias nuevas (rc.2): github.com/coder/websocket v1.8.14 (sin dependencias propias, mantenida por Coder, sucesora de nhooyr/websocket; go.mod no tenía WebSocket) y rsc.io/qr v0.2.0 (QR sin dependencias, de Russ Cox) para dibujar el QR con medios bloques.'
        - 'Cliente de Realtime propio (phoenix.go): Phoenix v1 al escribir (vsn=1.0.0) y v1/v2 al leer; join con config {broadcast:{self:false, ack:false}, presence:{key:"pc"}, private:true} y access_token = la clave publicable (el PC es anon). Heartbeat cada 25 s; sin respuesta antes del siguiente, la conexión está muerta. Reconexión con espera exponencial (1 s a 30 s) y jitter entre la mitad y el total; al volver repite el join y su track.'
        - 'Emparejar (contrato del relay, migración 20261102120000_qdd_remoto.sql): código de 8 caracteres base32 (A–Z, 2–7) en mayúsculas y p_codigo_hash = hex(sha256(código en mayúsculas)); tópico qdd:pc:<uuid>:<secreto base64url de 22>, donde el uuid es el id de la máquina que genera el PC; firma de 64 hex. Las credenciales se guardan recién cuando qdd_remoto_emparejada devuelve ese id; otro id es un error.'
        - 'Errores del relay: SQLSTATE 28000 son credenciales de máquina malas (la máquina se quitó): latido devuelve ErrCredenciales y qdd remoto correr termina con 0, sin reiniciarse. 53400 es un límite con su motivo. Un 404 es «no disponible» (la Edge Function avisar sin desplegar): se loguea una vez.'
        - 'El servicio corre qdd remoto correr con Restart=on-failure (systemd --user), KeepAlive SuccessfulExit=false (launchd) o una tarea al iniciar sesión con XML en UTF-16 (Windows, schtasks). Lleva el PATH de la terminal que activó, porque los pedidos corren con la shell y necesitan las mismas herramientas; y QDD_HOME si se fijó. Linger no se activa: se informa. Uno por máquina: <QDD_HOME>/remoto/correr.pid con un proceso vivo impide otro.'
        - 'Deltas: el bucle junta los cambios 300 ms (fsnotify sobre .qdd/project y modules de cada proyecto y lo local de QDD, más un sondeo cada 5 s por lo que cambia con la hora) y manda delta {version, seq, proyectos:{clave: panel|null}} solo con los paneles que cambiaron. Lo que un delta no dice (un proyecto nuevo, un nombre, un error, cuántos quedaron fuera del plan) va en un estado completo con el siguiente seq. Al llegar el primer teléfono (o tras una caída) el PC manda el estado sin esperar el sync; sync siempre lo responde.'
        - 'Plan: hasta el primer latido se supone Gratis (3 proyectos). Se publican los más recientes por visto hasta el límite y el estado dice fuera_del_plan. El latido va cada minuto aunque no haya teléfonos, con p_en_curso = tareas «● running» más pedidos ejecutando de todos los proyectos, y lo consumido desde el anterior (mensajes ≤ 10.000, minutos de consola ≤ 2; lo que no se pudo informar se suma al siguiente).'
        - 'Última respuesta del relay (FND-169): cada latido respondido anota su hora en <QDD_HOME>/remoto/latido.json (0600), aparte de plan.json, que solo se escribe si el plan cambia. UltimoLatido toma la más reciente de las dos porque un servicio anterior solo escribe plan.json; un latido sin respuesta no la renueva. REM-07 lee esa hora.'
        - 'Push (best effort, sin bloquear): un pedido pendiente o una ficha en borrador que aparece en un panel publicado pide avisar con {topico, firma, tipo, proyecto, clave}; proyecto es el nombre visible saneado a ^[\p{L}\p{N} ._()-]{1,80}$. Lo que ya esperaba al arrancar no se avisa. Cuando un proyecto ya no tiene nada de ese tipo esperando, pide pedido_resuelto o ficha_resuelto, para que la app quite el aviso; un 400 de un relay viejo a esos tipos no cuenta como falla. Sin panel no cambia lo visto: ni se resuelve ni vuelve a ser nuevo.'
        - 'Un delta se manda solo por un cambio real (pedido de la persona y de qdd-movile, 2026-11-05): hace, el pulso y la fuente de una tarea en curso, y proximo, intentos, inicio y aviso_en de un pedido no gastan un mensaje por sí solos. Viajan igual, al día, con el siguiente cambio real o con el estado completo, así que en el teléfono pueden estar atrasados: la app no los muestra como vigentes.'
        - 'Acciones (rc.3): la firma se verifica con hmac.Equal sobre solicitud|proyecto|accion_id|dispositivo|en (clave: el texto hex de la firma de la máquina) y en con formato YYYY-MM-DDTHH:MM:SSZ a ±5 min. Lo que no tiene firma válida o es viejo se descarta sin respuesta y queda en el log como descartada. Un teléfono en revocados.json, un proyecto fuera del registro o del plan, o un id que el panel recalculado no ofrece reciben rechazada con el motivo. Abrir carpeta y atender se rechazan: solo tienen sentido en el PC.'
        - 'Idempotencia: cada solicitud se guarda en <QDD_HOME>/remoto/solicitudes.json (0600, 7 días, 1000 como mucho) antes de ejecutarla; una repetida responde su último estado sin re-ejecutar, aunque qdd se haya reiniciado. Un archivo ilegible se aparta como .ilegible.'
        - 'Un pedido se ejecuta igual que en el panel (Accion.Lanzar, aparte y con la cola bloqueada) con la sesión remoto:<dispositivo>. Si el pedido ya no es ejecutable (lo aprobó el PC u otro teléfono), responde ya_aprobado con lugar: «PC», o el nombre del teléfono si su sesión es remoto:<id>. Al terminar, el PC responde hecha o fallo con el final de la salida, pide el push termino_bien o termino_falla y lo marca avisado (consola.Avisado), para que salga del tablero como uno que el panel ya avisó. Las demás acciones (aprobar ficha, descartar, revisar, auditar) corren con Accion.Ejecutar en segundo plano.'
        - 'Sin teléfonos en la presence el PC no responde accion_estado (inv. 12): el teléfono reintenta con el mismo id y recibe el último estado. El log (log.jsonl, 0600) anota cada acción terminada y cada descartada, con dispositivo, nombre, proyecto, acción y resultado ya sin secretos.'
        - qdd remoto revocar <id> escribe primero revocados.json (efecto inmediato en este PC) y después revoca en el relay; qdd remoto dispositivos marca revocado lo que dice cualquiera de los dos.
        - 'Consola (rc.4): se sigue solo la de cada proyecto publicado que un teléfono mira (presence mirando: <clave>); sin nadie mirando no hay ticker ni lectura. Cada 500 ms se junta lo nuevo y sale como mucho un mensaje (dos por segundo en total, por turnos si se miran varios proyectos, hasta 60 líneas por mensaje: lo demás va en el siguiente). El evento es consola {version, proyecto, inicio, lineas:[{fuente, rol, texto, en}]}; inicio marca la primera tanda (las últimas 40 líneas), que reemplaza lo que el teléfono tenía.'
        - La conversación sale del transcript de Claude Code más reciente del proyecto (<CLAUDE_CONFIG_DIR o ~/.claude>/projects/<ruta con lo no alfanumérico como «-»>/*.jsonl, también los de un worktree o una subcarpeta), confirmado con su cwd vía estado.ClaveLocal, porque «qdd» y «qdd-movil» empiezan igual. Se toman los turnos de la persona y de la IA y el nombre de cada herramienta; nunca la entrada ni el resultado de una herramienta, el razonamiento, los subagentes (isSidechain), lo meta ni el texto que inyecta Claude Code (empieza con «<»). Cada turno va recortado a 2000 caracteres. Cada 5 s se mira si hay un transcript más nuevo (otra sesión) y, si lo hay, empieza de nuevo con su cola.
        - 'Los pedidos que terminan mientras alguien mira salen como una línea de rol pedido: tecla, motivo, cómo terminó y el final de la salida que guarda la cola.'
        - 'Permiso: hasta el primer latido no se transmite. Si el latido dice consola_permitida false, cada consola mirada recibe una sola vez {pausada: motivo} y no se transmite ni se cuentan minutos; el estado y las acciones siguen. Si vuelve a estar permitida, quien mira recibe de nuevo la cola con inicio. Los minutos de consola se cuentan por tick transmitido (0,5 s) y van en el latido.'
        - 'Límites de Claude (pedido de qdd-movile, 2026-11-04; RFC 0013): la barra los guarda en <QDD_HOME>/claude/limites.json (consola.GuardarLimites) al cambiar o cada minuto; Armar los lee y van en estado y en delta como campo opcional limites, sin subir version. Un delta los lleva solo si cambió usado o reinicia (Huella). Son de la máquina: solo porcentajes y fechas, sin rutas ni el modelo; lo que no vino se omite.'
        - 'Flujos en QDD Móvil (pedido de qdd-movile, 2026-11-06; RFC 0013): el panel publicado lleva solo el resumen en flujos, con una huella que depende solo del archivo, y cada flujo viaja en un evento flujo aparte, después de cada estado completo (también tras un sync) y cuando cambia su huella. Con los nodos en el panel, cada delta los reenviaría. Los textos pasan por el ocultador (inv. 16).'
        - 'Logrado para QDD Móvil (2026-11-09): el panel que publica el relay pide --con logrado, y ocultarDelPanel pasa por el ocultador titulo, detalle, salida, motivo, criterio y evidencia de cada entrada (inv. 16), en una copia: la lista de quien la armó no cambia.'
    invariantes:
        - qdd remoto desactivar nunca apaga ni borra un servicio que publica otro QDD_HOME (FND-136).
        - Una edición de un flujo desde el teléfono solo se aplica si cumple el esquema exacto, con firma válida, Pro y un teléfono no revocado. Un campo desconocido la rechaza entera y nunca puede decir que la hizo la IA.
        - El teléfono solo envía ids de acción que el PC ofreció; el PC vuelve a calcular el panel antes de ejecutar y rechaza un id que no ofrece (inv. 1). La única excepción, solo con Pro, es ejecutar desde el teléfono.
        - 'Un comando mandado desde el teléfono nunca pasa por una shell ni corre si no está en la lista permitida (solo comandos que leen o revisan; doctor nunca con --fix): el PC lo vuelve a validar aunque lo haya validado el relay, y sin Pro no corre nada.'
        - "Una instrucción del teléfono llega a una sola sesión interactiva de Claude Code, una sola vez, como un mensaje de la persona que dice de qué teléfono viene y empieza con \U0001F4F1 (nunca como un comando ! o /)."
        - Una acción con la misma solicitud se ejecuta una sola vez; una repetida responde el último estado sin re-ejecutar (inv. 3).
        - Cada acción recibe recibida → ejecutando → hecha | fallo, o ya_aprobado o rechazada (inv. 4, 19).
        - Quién aprobó qué, cuándo y desde qué dispositivo queda en <QDD_HOME>/remoto/log.jsonl (0600), nunca en el relay (inv. 5).
        - La consola se transmite solo mientras alguien la mira y es de solo lectura (inv. 6, 7); solo con Pro el teléfono escribe en ella, y solo una instrucción a la IA o una edición de un flujo.
        - Las credenciales viven en <QDD_HOME>/remoto/ con permisos 0600; el PC nunca acepta ni guarda una clave secreta o service_role (inv. 9).
        - Sin teléfono conectado, el PC no publica nada más que su Presence (inv. 12).
        - Los deltas se agrupan cada 300 ms y la consola manda como mucho 2 mensajes por segundo (inv. 13).
        - 'Nada que parezca un secreto sale del PC: todo lo que sale (consola, resultado, error, y en el panel el tablero, los pedidos y las preguntas, FND-157) pasa por el ocultador (inv. 16).'
        - El push solo dice el tipo cerrado y el proyecto; nunca un comando ni una salida (inv. 17).
        - Una acción sin firma válida del relay, vieja (más de 5 min), de un dispositivo revocado o de un proyecto desconocido se descarta y queda en el log (inv. 18).
        - 'Un registro de proyectos ilegible nunca se reescribe en silencio: se aparta.'
        - 'Una pregunta se responde una sola vez: gana la primera respuesta, de la terminal o de un teléfono, y el otro lado recibe ya_aprobado con el lugar; un permiso respondido desde el teléfono nunca agrega reglas («permitir siempre»).'
        - 'El relay sale de un directorio firmado (RFC 0013 inv. 20, decisión de la persona 2026-11-06): solo una respuesta exacta, firmada con la clave que trae qdd y de serie igual o mayor cambia el relay. Sin red sigue con el recordado. Un relay dado con banderas no se consulta si el PC está emparejado; sin emparejar manda el directorio (FND-171, pedido de la persona por qdd-movile 2026-11-06).'
        - 'El directorio se sirve desde tres sitios fijos en el código, en orden, con la misma respuesta firmada (FND-171, decisión de la persona 2026-11-06, por qdd-movile): gana la primera que valide. Doctor lo revisa sin red (REM-11, también con el servicio apagado y sin emparejar); --fix es lo único de doctor que consulta, lo repara antes de arrancar el servicio y, si lo cambia con el servicio corriendo, lo reinicia.'
