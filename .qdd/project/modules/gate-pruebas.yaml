id: gate-pruebas
nombre: Pruebas del gate (QA)
estado: borrador
rutas:
    - cli/pkg/audit/coverage.go
objetivo_operativo:
    problema: 'El gate (qdd audit) es la única puerta antes de un commit o un despliegue: si una suite del proyecto no corre ahí, nadie sabe si pasa. Algunas suites necesitan una herramienta que no está en todas las máquinas (p. ej. la CLI de Claude para probar un mod de consola): sin ella, el gate no puede fingir que pasaron ni romper el CI que no la tiene.'
    usuarios: Las personas y las IAs que corren qdd audit, localmente y en el CI.
    criterio_de_exito: Cada suite del proyecto corre en el gate; la que no se puede correr en esta máquina queda «sin medir» y lo dice, nunca como aprobada.
    caso_real: '2026-10-31: las 41 pruebas del panel de Claude Code y las 9 del panel de OpenCode no estaban en el gate ni en el CI; solo pasaban cuando alguien se acordaba de correrlas.'
objetivo_tecnologico:
    arquitectura: 'RunCoverageCheck corre los test_commands de .qdd/config.yaml (o los que detecta: npm, go, flutter, pytest) y cada falla es QA-01-ALL-TESTS-PASS. Un test_command es un texto o {comando, requiere: [programas]}.'
    decisiones:
        - 'Una suite con requiere cuyos programas no están en el PATH no se corre: queda QA-03-SIN-MEDIR, una recomendación que no bloquea y dice qué falta. No es aprobada ni fallida: se mide donde está la herramienta (pedido del usuario, 2026-10-31: «testear el panel de la derecha y verificar que pase todas las pruebas»).'
    invariantes:
        - Una suite que corre y falla siempre bloquea el gate (QA-01).
        - Una suite que no se pudo correr nunca se informa como aprobada.
pruebas:
    comandos:
        - cd cli && go test ./pkg/audit/ -run 'Coverage|TestCommand|SinMedir'
