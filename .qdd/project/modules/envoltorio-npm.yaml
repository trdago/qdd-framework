id: envoltorio-npm
nombre: Envoltorio npm de qdd
estado: aprobado
rutas:
    - npm/bin/qdd.js
objetivo_operativo:
    problema: Quien instala qdd con npm ejecuta un script de node que tiene que lanzar el binario nativo, entregar su salida y explicar bien cuando no puede.
    usuarios: Las personas, las IAs y los pedidos del panel que llaman a qdd.
    criterio_de_exito: qdd responde con la salida del binario; si el binario falta mientras npm lo reinstala, un pedido queda en «todavía no» y no en fallo.
    caso_real: '2026-11-03: un pedido de mergear un PR falló con ENOENT porque otro pedido estaba instalando qdd (FND-135).'
objetivo_tecnologico:
    arquitectura: npm/bin/qdd.js lanza bin/qdd (qdd.exe en Windows) con spawnSync y stdio heredado, y sale con el mismo código.
    decisiones:
        - 'npm 12 bloquea el postinstall por defecto, y sin él no hay binario: toda instrucción de instalación de qdd lleva --allow-scripts=qdd-framework y el mensaje de binario ausente lo dice (FND-143). npm 10 y 11 toleran la bandera.'
        - 'Binario ausente: primero lo baja con install.js --primer-uso (FND-143, decisión de la persona, 2026-11-05: quien instala sin la bandera no queda sin qdd); un turno evita que varios qdd bajen cada uno el suyo y lo del instalador va a stderr.'
        - 'Binario que sigue ausente (ENOENT) sale con 75, el «todavía no» de los pedidos (FND-135): no se distingue una reinstalación de una instalación rota, así que el mensaje cubre las dos. Cualquier otro error de lanzarlo sale con 1.'
    invariantes:
        - Lo que escribe el instalador en el primer uso nunca llega a la salida estándar de qdd.
        - El código de salida del binario llega intacto a quien llamó a qdd.
        - Un binario que existe y no se puede ejecutar nunca sale con 75.
pruebas:
    comandos:
        - cd npm && node --test test/qdd.test.js
ultima_revision: "2026-11-05"
revisado_en_commit: 9074b21e5dd1
