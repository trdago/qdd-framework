id: "FND-311"
title: "qdd report dice CERTIFIED en gobernanza de IA sin haberla evaluado"
description: "2026-11-24, al comparar la documentación pública con el código (sprint 10). cmd/report.go parte de aiStatus = CERTIFIED y solo lo cambia si hay violaciones, así que un proyecto recién creado, sin IA o con ai_governance apagada sale «ai_governance_status: CERTIFIED» (reproducido)."
impact: "Afirma un cumplimiento que nadie midió; contradice «lo que no se midió se dice»."
action_taken: "El reporte dice SIN_EVALUAR (política apagada), NO_APLICA (sin IA), SIN_HALLAZGOS o VIOLATIONS_DETECTED, y aclara que son heurísticas que no acreditan una norma."
test_result: "cli/cmd/report_fnd311_test.go. Fallaba antes del cambio y pasa."
status: resolved
detectado_por: sesion
date: "2026-11-24"
