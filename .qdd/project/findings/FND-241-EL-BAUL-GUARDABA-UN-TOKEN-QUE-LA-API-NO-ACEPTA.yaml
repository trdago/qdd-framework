id: "FND-241"
title: "El baúl guardaba un token que la API no acepta si respondía 400"
description: "2026-11-20, tarea teamspeak-3-vm-gcp de notificador_de_ofertas: cloudflare-tenderbot quedó guardado con 2 caracteres copiados por error. Cloudflare contesta un token mal formado con 400 «Invalid request headers» (6003), no con 401. VerificarValor solo tomaba como rechazo un 401 o un 403; un 400 salía como «la API respondió 400», que guardar trata como «no se pudo verificar» (sin red, API caída) y guarda igual."
impact: "La IA pidió permiso, la persona lo dio y el uso falló contra Cloudflare con 6003: el DNS de ts.tenderbot.cl quedó detenido hasta volver a copiar el token, sin que el baúl avisara al guardarlo."
action_taken: "Un 400 de la API también es ErrRechazado: guardar (portapapeles y terminal) dice «no se guardó» y verificar lo marca rechazado. Sin red o con un 5xx se sigue guardando, como antes."
test_result: "cli/pkg/baul/baul_test.go TestVerificar_UnTokenMalFormadoEsRechazo_FND241: un servidor que contesta 400 con 6003; VerificarValor da ErrRechazado y GuardarDelPortapapeles no deja nada en el índice. Falló antes del cambio («la API respondió 400») y pasa después; go test ./pkg/baul ./cmd en verde."
status: resolved
detectado_por: persona
date: "2026-11-20"
