id: "FND-312"
title: "Tools MCP que escriben aunque se declaran de solo lectura, y otras que no hacen lo que dicen"
description: "2026-11-24, al comparar la documentación pública con el código (sprint 10). Por lectura de código: qdd_query_graph pasa cualquier SQL a una base abierta para escritura; qdd_map lleva readOnlyHint y escribe topology.json; qdd_resolve_diagnose deja un finding con status diagnosed, que FND-01 bloquea; qdd_resolve_certify no verifica el golden set ni firma; qdd_postgres_tuner devuelve siempre el mismo texto y qdd_graph_query es un aviso de «fase 2»."
impact: "La IA y la persona creen que se verificó algo que no se verificó."
action_taken: "La referencia dice lo que cada una hace de verdad."
