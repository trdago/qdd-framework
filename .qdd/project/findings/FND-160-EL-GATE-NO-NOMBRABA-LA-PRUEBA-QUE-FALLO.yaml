id: "FND-160"
title: "qdd audit decía «1 fail» sin nombrar la prueba que falló"
description: "Al fallar una suite, el gate guardaba solo las últimas 60 líneas de su salida. La suite del mod qdd-tareas imprime casi 200, y su línea (fail) queda antes de ese corte."
impact: "Una prueba del mod falló dos veces con la máquina cargada (carga 33 la segunda) y pasó al repetir la auditoría. Sin su nombre no se pudo saber cuál fue ni investigar la causa."
action_taken: "logDeFallo agrega al final de la salida las líneas anteriores que dicen «fail», hasta 40. La causa del fallo con carga sigue abierta: el límite de 5 s de esas pruebas no se puede cambiar desde claude plugin test."
test_result: "cli/pkg/audit/coverage_test.go: TestLogDeFallo_NombraLoQueFallaAunqueQuedeLejosDelFinal y TestLogDeFallo_UnaSalidaCortaQuedaIgualYLasFallasTienenTope."
status: resolved
