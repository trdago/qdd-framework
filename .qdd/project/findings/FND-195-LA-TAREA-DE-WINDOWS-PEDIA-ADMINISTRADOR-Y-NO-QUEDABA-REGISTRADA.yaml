id: "FND-195"
title: "La tarea de inicio de qdd remoto en Windows pedía administrador y quedaba sin registrar"
description: "2026-11-08 y 2026-11-10, Windows 10 Home y Enterprise, usuario sin administrador, qdd 2.10.0-rc.31 a rc.59 (MEJ-052 y MEJ-060, reportes REP-478 y REP-482 por el relay): 'qdd login' y 'qdd remoto activar' escribían <QDD_HOME>/remoto/qdd-remoto.xml, pero «schtasks /Create … /XML» respondía «Acceso denegado». El XML traía un LogonTrigger sin <UserId>, que se dispara al iniciar sesión cualquier usuario del equipo, y para registrarlo Windows exige administrador aunque RunLevel sea LeastPrivilege. Los dos reporteros probaron el arreglo a mano: con <UserId> en el disparador y en el Principal, schtasks la registra sin administrador. Además, doctor solo miraba el archivo, así que una tarea que nunca quedó registrada pasaba por sana."
impact: "En Windows sin administrador, QDD Móvil deja de ver el PC cada vez que 'qdd remoto correr' se corta o se cierra la sesión: no hay tarea que lo vuelva a lanzar, y nada lo dice después de la primera advertencia."
action_taken: "Servicio.Cuenta (DOMINIO\\usuario de user.Current, solo en Windows) va como <UserId> en el LogonTrigger y en el Principal. RenovarBinario pasa a RenovarTarea: además de apuntar al binario de la versión instalada (FND-142), le agrega el usuario a una tarea escrita antes y la vuelve a registrar; corre al actualizar qdd y en 'qdd doctor --fix'. Doctor suma REM-12: una tarea sin usuario «quizás nunca quedó registrada». La ventana de consola que abre la tarea (tercer punto de MEJ-052) queda aparte: sin consola, los pedidos que lanza qdd remoto abrirían ventanas propias, y eso se prueba en Windows antes de cambiarlo."
test_result: "cli/pkg/remoto/servicio_test.go: TestServicio_LaTareaDeWindowsEsSoloDelUsuario_FND195 (el XML lleva <UserId> escapado en disparador y principal) y TestServicio_RenovarTareaLeAgregaElUsuario_FND195 (una tarea vieja recibe el usuario, se registra una vez, el binario a mano no cambia, y después no hace nada). cli/cmd/remoto_doctor_fnd142_test.go: TestDoctor_VeYReparaLaTareaSinUsuario_FND195 (doctor la ve como REM-12 y --fix la registra con el usuario). Fallaban antes del cambio (no compilaban: no existían Cuenta ni TareaSinCuenta) y pasan después; las de FND-142 siguen pasando con RenovarTarea."
status: resolved
detectado_por: persona
date: "2026-11-10"
