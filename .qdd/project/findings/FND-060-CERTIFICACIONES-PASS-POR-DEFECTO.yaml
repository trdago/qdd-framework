title: "El dashboard muestra como PASS toda certificación que no dice su estado"
description: "processCertificationRow (cli/pkg/dashboard/state.go) asume status PASS cuando el YAML no trae status, y les pone a todas el nombre fijo 'Cumplimiento verificado' y el tipo 'Proyecto'. El grafo mezcla las certificaciones del proyecto con el catálogo core (estándares disponibles para adoptar, sin status), así que todo el catálogo aparece como cumplido."
impact: "El dashboard dice que el proyecto cumple certificaciones que nunca se evaluaron. Es un dato inventado (la misma clase de defecto que FND-055)."
action_taken: "pkg/certificaciones es el único lector: lee .qdd/project/certification y .qdd/core/certification desde los archivos (en el grafo el catálogo pisaba a la del proyecto con el mismo id), marca el origen y normaliza el estado (cumple, no_cumple, pendiente, sin estado). El catálogo se muestra como DISPONIBLE y nunca cuenta como cumplido; una certificación del proyecto sin status se muestra SIN ESTADO. El nombre y el tipo salen del YAML. El dashboard, qdd_score y report usan el mismo conteo: report solo contaba el texto literal status: certified y qdd_score comparaba con certified exacto, así que las 5 certificaciones con status PASSED no contaban. La UI muestra el conteo del backend. doctor (grupo 5) señala las certificaciones del proyecto sin estado."
test_result: "TestLeer_DistingueCatalogoYProyecto, TestContar y TestPorDecidir (pkg/certificaciones), TestBuildState_CertificacionesConSuEstadoReal (pkg/dashboard), TestIndicadores_MismoConteoDeCertificacionesEnTodosLosLectores (cmd, fallaba: qdd_score 1/4 y report 1 cumplida, want 2) y el test de vitest que cuenta las certificaciones según el backend."
status: resolved
detectado_por: ia
date: "2026-10-29"
