title: "Hay findings sin estado y doctor no los señala"
description: "24 findings de este repositorio (p. ej. FND-029, FND-032, FND-054) no tienen campo status, y 18 lo escriben en mayúscula. Desde FND-056 se cuentan como 'sin estado' y ya no como deuda abierta, pero nada pide corregirlos, y qdd bug sigue escribiendo RESOLVED en mayúscula (pkg/bugreport/bugreport.go:105)."
impact: "Los indicadores muestran findings 'sin estado' indefinidamente, y quien registra un finding nuevo no sabe qué valores son válidos."
action_taken: "doctor tiene el grupo 5, Findings y certificaciones del proyecto: lista los findings sin estado reconocido (no los repara: el estado lo decide una persona) y los que tienen un estado reconocido escrito de otra forma (RESOLVED, closed), que doctor --fix reescribe en su forma canónica tocando solo la línea status. qdd bug escribe open y resolved con las constantes de pkg/findings y agrega detectado_por qdd. La plantilla de finding documenta status (open | resolved | wontfix), categoria y detectado_por. En este repositorio, los 24 findings sin status se marcaron resolved por decisión del mantenedor (todos describen la corrección en action_taken) y doctor --fix normalizó los 18 en mayúscula."
test_result: "TestPorDecidir, TestNoCanonicos y TestEscribirCanonicos (pkg/findings), TestDoctor_RegistrosDelProyecto y TestDoctor_RegistrosSanos (cmd), TestFile_CreatesOpenFindingAndEvidence y TestMarkResolved_EscribeEstadoCanonico (pkg/bugreport). qdd doctor en este repositorio: grupo 5 sin anomalías."
status: resolved
detectado_por: ia
