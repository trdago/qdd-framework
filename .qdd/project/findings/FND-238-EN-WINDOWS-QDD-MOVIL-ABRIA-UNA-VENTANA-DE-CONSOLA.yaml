id: "FND-238"
title: "En Windows, QDD Móvil abría una ventana de consola que había que dejar abierta"
description: "2026-11-15, pedido de la persona (sprint 9): en Windows, la tarea «QDD remoto» lanzaba qdd.exe remoto correr con InteractiveToken. qdd.exe es un programa de consola, así que Windows le abría una ventana, y <Hidden>true</Hidden> solo esconde la tarea en el Programador de tareas, no esa ventana. Cerrarla desconectaba el PC del teléfono. Además, su registro iba a esa ventana: sin ella, no quedaba en ninguna parte."
impact: "En Windows, tener QDD Móvil conectado obligaba a dejar una ventana de consola abierta todo el día, y cerrarla por error desconectaba el PC."
action_taken: "Decisión de la persona: «Lanzador oculto». cli/qddw es un programa de ventanas (-H=windowsgui -s -w, 1,9 MB) que corre el qdd.exe de su carpeta sin ventana (CREATE_NO_WINDOW) dentro de un trabajo que muere con él, del que los pedidos salen solos (FND-128), y sale con su código. El release de Windows lo compila antes y qdd.exe lo lleva dentro (pkg/remoto/lanzador); al instalar o renovar la tarea, qdd lo deja junto a sí y la tarea lo lanza. Sin consola, qdd remoto correr escribe en <QDD_HOME>/remoto/correr.log (1 MB y una copia). REM-23 en doctor ve una tarea con ventana o sin qddw.exe y --fix la renueva; un PC con la tarea anterior pasa al lanzador al actualizar qdd (FND-142). RFC 0013, ficha remoto y referencia de comandos actualizadas."
test_result: "cli/qddw/main_test.go (corre el qdd de su carpeta con los argumentos y sale con su código; sin qdd sale con 2; misma variable que qdd; se compila como programa de ventanas y pesa menos de 4 MB), cli/qddw/sinventana_windows_test.go (en el runner de Windows: GetConsoleWindow = 0 en el qdd lanzado, y termina con qddw.exe), cli/pkg/remoto/lanzador_test.go, registro_rotado_test.go y cli/cmd/remoto_sin_ventana_test.go no compilaban sin el cambio (rojo) y pasan; go test ./cmd/ ./pkg/remoto/... ./qddw/ en verde. La prueba de Windows corre en quality.yml (panel-windows)."
status: resolved
detectado_por: persona
date: "2026-11-15"
