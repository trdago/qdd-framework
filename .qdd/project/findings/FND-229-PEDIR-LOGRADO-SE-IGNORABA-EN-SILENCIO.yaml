id: "FND-229"
title: "qdd remoto ignoraba en silencio un pedir_logrado y no se podía saber por qué QDD Móvil no recibía lo logrado — MEJ-080"
description: "2026-11-15, QDD Móvil 130 en un teléfono real con qdd rc.85 (MEJ-080): al abrir Logrado, la app mandaba pedir_logrado y no volvía nada (10:29 y 10:36, con reintentos), mientras Sincronizar por el mismo camino sí volvía. El registro de qdd-remoto.service solo decía «1 teléfono(s) en el canal» y «conectado al relay» al arrancar: alPedirLogrado descartaba sin decir nada un pedido sin teléfonos en el canal, ilegible, con clave o solicitud inválida, y el canal descartaba sin contar un evento que no cabía en su cola de 256. Revisado: el proceso era el de rc.85 (que ya trae pedir_logrado desde rc.75), uno solo por QDD_HOME, y la app manda version_app como texto y el pedido con el contrato. La causa del caso real sigue sin confirmar."
impact: "Lo logrado no aparecía en el teléfono y ni el registro ni qdd doctor permitían distinguir un pedido que no llegó, uno descartado o una respuesta que salió y no llegó."
action_taken: "Cada pedir_logrado deja una línea en el registro: respondido con N entradas (con error o recortado), o ignorado y por qué (ilegible, clave inválida, solicitud inválida, sin teléfonos en el canal); un envío fallido ya se registraba. El canal cuenta los eventos que no cupieron y el siguiente evento los lleva (Evento.Perdidos), y el bucle escribe «se perdieron N eventos del relay». telefonoDe ya no borra del canal a un teléfono cuya presence trae un campo opcional de otro tipo (preventivo: la app actual manda los tipos del contrato). Queda abierto hasta ver el registro del próximo intento con la versión que trae esto."
test_result: "cli/pkg/remoto/logrado_registro_mej080_test.go: TestLogrado_CadaPedidoDejaEnElRegistroSiSeRespondio_MEJ080, TestLogrado_UnPedidoIgnoradoDiceElPorQue_MEJ080, TestTelefonos_UnCampoOpcionalDeOtroTipoNoBorraAlTelefono_MEJ080, TestCanal_UnEventoQueNoCupoSeCuentaEnElSiguiente_MEJ080 y TestBucle_EventosPerdidosQuedanEnElRegistro_MEJ080 no compilaban o fallaban sin el cambio y pasan; go test ./pkg/remoto/... en verde."
status: open
detectado_por: persona
date: "2026-11-15"
