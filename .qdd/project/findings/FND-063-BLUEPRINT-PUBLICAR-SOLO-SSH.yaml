id: "FND-063"
type: "bug"
title: "qdd blueprint propose y release solo publican por SSH: con una deploy key sin escritura fallan aunque gh tenga sesión"
status: "resolved"
categoria: "correccion"
detectado_por: "ia"
severity: "medium"
discovered_at: "2026-10-29T19:30:00Z"
discovered_by: "Claude Code (RFC 0006, publicación de consola-claude-code 2.0.0)"

context:
  module: "blueprints"
  files_affected:
    - "cli/pkg/blueprints/evolucion.go"
  description: >
    propose y release hacen git push al origen registrado (git@github.com:trdago/qdd-blueprints.git). En una máquina
    cuya clave SSH es una deploy key de otro repositorio, el push falla con «Permission … denied to deploy key»,
    aunque gh tenga sesión con permisos de escritura y git use gh como credential helper para HTTPS. propose dejó el
    commit hecho, sin rama publicada ni PR; release no dejó la etiqueta local. Se publicó a mano por HTTPS (PR #1 y
    etiqueta v2.0.0, formato de release respetado).

reproduction:
  steps:
    - "1. Máquina con una deploy key de otro repo como clave SSH por defecto y gh con sesión"
    - "2. qdd blueprint propose <id> -m '…'"
  expected: "La rama se publica y el PR se abre (por SSH o, si falla, por HTTPS con las credenciales de gh)"
  actual: "ERROR: Permission to trdago/qdd-blueprints.git denied to deploy key; sin rama ni PR"

impact_analysis:
  blast_radius: "low"
  zero_else_violated: false
  zero_mocks_violated: false

resolution:
  propuesta: >
    Si el push SSH falla por permisos y el origen es de github.com, reintentar contra la URL HTTPS equivalente (git
    usa el credential helper de gh) y decirlo en la salida; prueba de regresión con un remoto que rechaza SSH.
  action_taken: >
    propose y release publican con empujar (cli/pkg/blueprints/publicas.go): si el push al origin falla y el origin
    es una URL SSH, reintentan contra la URL HTTPS del mismo repositorio, que usa las credenciales de git (el credential
    helper de gh). La salida lo dice (Propuesta.Via, Publicacion.Via) y el PR se abre igual. Si HTTPS también falla,
    el error nombra los dos intentos. Se reprodujo de nuevo el 2026-10-30 al publicar trdago/qdd-blueprints#4.
  test_result: >
    TestProponer_PublishesOverHTTPSWhenSSHCannotPush y TestPublicar_TagsOverHTTPSWhenSSHCannotPush (pkg/blueprints),
    con un origin cuyo push falla: antes del arreglo fallaban con «no se pudo publicar»; ahora la rama y el tag llegan
    al repositorio y Via menciona HTTPS.
  resolved_at: "2026-10-30"
