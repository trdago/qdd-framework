id: "FND-204"
title: "En Windows, qdd remoto quedaba caído tras actualizar qdd hasta el próximo inicio de sesión"
description: "2026-11-11, Windows 10, qdd 2.10.0-rc.62 (MEJ-064, reporte REP-483 por el relay): el teléfono dejó de recibir el panel; doctor marcaba REM-06 (el servicio no corre) y REM-07 (sin respuesta del relay hace 56 min). La tarea «QDD remoto» se había vuelto a registrar al actualizar (LastRunTime 1999-11-30, LastTaskResult 267011: nunca corrió) y nada la arrancó. Causa: RenovarTarea solo la registraba, confiando en que lo que corría terminara con salida 3 al ver la versión nueva y RestartOnFailure lo relanzara; pero en una tarea programada RestartOnFailure solo reintenta cuando la tarea no pudo arrancar, no cuando el programa sale con error, y su único disparador era el inicio de sesión. Además quedaba una tarea «qdd-remoto», registrada a mano mientras qdd no podía (FND-195), que apuntaba a qdd rc.59, ya desinstalado, y que nadie revisaba."
impact: "En Windows, después de cada actualización de qdd, QDD Móvil se quedaba sin ese PC (sin panel, sin aprobaciones) hasta que la persona cerraba sesión o corría qdd doctor --fix. La tarea sobrante competía con la de qdd al iniciar sesión y podía lanzar una versión vieja."
action_taken: "La tarea de Windows lleva, además del inicio de sesión, un disparador cada 5 minutos (TimeTrigger con Repetition PT5M); con MultipleInstancesPolicy IgnoreNew, si ya corre no abre otra. RenovarTarea (al actualizar qdd y con doctor --fix) agrega ese disparador a una tarea de antes y, después de registrarla, la arranca con schtasks /Run. Doctor suma REM-13 (la tarea solo arranca al iniciar sesión; --fix la renueva y la arranca) y REM-14 (queda la tarea «qdd-remoto» que lanza qdd remoto correr; --fix la apaga y la borra; una con ese nombre que lanza otra cosa no se toca). Si el teléfono quitó el PC, qdd remoto correr desactiva la tarea (schtasks /Change /DISABLE) para que el disparador no lo relance cada 5 minutos; qdd remoto activar la vuelve a registrar. Linux y macOS no tenían el hueco: systemd (Restart=on-failure) y launchd (KeepAlive SuccessfulExit=false) reinician ante la salida 3."
test_result: "cli/pkg/remoto/servicio_fnd204_test.go: TestServicio_LaTareaDeWindowsVuelveSiSeCae_FND204, TestServicio_RenovarTareaLaArrancaYLeAgregaElReintento_FND204, TestServicio_RenovarTareaSoloPorElReintento_FND204, TestServicio_ArrancarFallaLoDice_FND204, TestServicio_TareaSobranteDeAntes_FND204, TestServicio_UnPCQuitadoNoSeRelanzaCadaCincoMinutos_FND204 y TestServicio_FueraDeWindowsNoHayReintentoQueAgregar_FND204; cli/cmd/remoto_doctor_fnd204_test.go: TestActualizar_ArrancaLaTareaConLaVersionNueva_FND204, TestDoctor_VeYReparaLaTareaSinReintento_FND204, TestDoctor_VeYQuitaLaTareaSobrante_FND204, TestDoctor_SinTareaSobranteNoDiceNada_FND204 y TestRemoto_UnPCQuitadoDesactivaLaTarea_FND204. Fallaban antes (no compilaban: no existían TareaSinReintento, TareaSobrante ni ComandosAlQuitarse) y pasan después. Las de FND-142 y FND-195 ahora esperan /Create seguido de /Run. Las pruebas usan un ejecutor que solo anota: nunca corren schtasks. No probado en un Windows real."
status: resolved
detectado_por: persona
date: "2026-11-14"
