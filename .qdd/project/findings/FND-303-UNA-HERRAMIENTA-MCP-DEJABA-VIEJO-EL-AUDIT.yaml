id: "FND-303"
title: "Una herramienta MCP de qdd dejaba viejo el audit"
description: "notificador_de_ofertas, 2026-11-23, verificando FND-299 con rc.121: después de qdd audit, un qdd_estado set por MCP y el commit, la puerta rechazó el commit («el árbol cambió desde el último qdd audit aprobado»). estado.yaml ya no contaba (FND-299), pero cada llamada al MCP escribe su registro en .qdd/project/metrics/: mcp_eventos.json desde FND-059, o cognitive_history.json si el MCP corre un binario anterior (el de notificador era del 21-11, anterior a rc.116)."
impact: "Mover el tablero o usar cualquier herramienta de qdd entre el audit y el commit obligaba a repetir el audit, y lo que pedían las reglas (mover el tablero mientras se trabaja) bloqueaba el commit."
action_taken: "La persona eligió la opción recomendada (2026-11-23): FueraDeHuella (pkg/puertas/huella.go) deja fuera el tablero y los dos registros del MCP; cualquier otro archivo, también de metrics/, sigue cambiando la huella. Ficha puertas actualizada."
test_result: "cli/pkg/puertas/huella_registros_fnd303_test.go (los dos registros no cambian la huella, tampoco en el índice; otro archivo de metrics/ sí) fallaba antes del cambio y pasa; go test ./pkg/puertas en verde. Verificado por quien lo reportó (notificador_de_ofertas, 2026-11-23, qdd v2.10.0-rc.123): qdd audit (exit 0), qdd_estado set por MCP con el binario viejo (escribió estado.yaml y cognitive_history.json) y el commit en otro comando pasó a la primera (f1369cc7)."
