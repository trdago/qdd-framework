id: "FND-321"
title: "Los documentos decían que el relay no guarda las acciones ni los textos del teléfono, y quedan de 3 a 4 días"
description: "El RFC 0013 («No se guardan en Supabase ni el estado ni las acciones», entre lo que la persona decidió, y «El relay no guarda ni el comando ni su salida») y docs/command-reference.md lo afirmaban. Las migraciones del relay (qdd-movile, origin/main, leídas el 2026-11-24) mandan accion, responder, ejecutar y foto con realtime.send, y la documentación de Supabase dice que esos mensajes se guardan en realtime.messages y que Broadcast Replay los ofrece «at least 72 hours and at most 4 days». Lo encontró qdd-movile con las fotos (su FND-059). qdd-movile contó en la base, del 21 al 24-11: 62 ejecutar, 31 accion, 11 responder, ninguna foto, y ningún evento de los que van por Broadcast directo (indicio, sin prueba dirigida)."
impact: "Los textos a la IA (hasta 4000 caracteres), las respuestas (hasta 4096) y las acciones quedan días en Supabase sin cifrado de extremo a extremo, contra lo que la persona decidió y lo que dice la documentación pública de QDD. Según el FND-059 de qdd-movile, la política de la app sí lo dice de los textos («en pocos días»)."
action_taken: "Los documentos dicen qué queda guardado, cuánto y qué no está medido; una prueba impide volver a negarlo. La persona decidió el 2026-11-27: la política de la app lo dice (publicada por qdd-movile, «entre 72 horas y 4 días», verificada en la página de privacidad) y el cifrado en el teléfono llega después de la 2.10.0 (RFC 0027, tarea cifrar-telefono-va-pc)."
test_result: "TestDocs_NadieDiceQueElRelayNoGuardaLoDelTelefono_FND321 fallaba antes del cambio y pasa. El comportamiento del relay no cambió."
status: resolved
detectado_por: ia
date: "2026-11-24"
