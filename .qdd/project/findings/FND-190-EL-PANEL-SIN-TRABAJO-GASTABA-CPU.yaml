id: "FND-190"
title: "El panel sin trabajo gastaba CPU: los candados de cada latido despertaban a todos los paneles"
description: "2026-11-08, con Dota abierto: 8 procesos 'qdd consola seguir' (uno por sesión de Claude Code, en 4 proyectos) gastaban entre 2 y 9 % de CPU cada uno sin nada que mostrar, y el de qdd leía 12 MB cada 10 s. Dos causas que se multiplicaban. 1) SenalesDelPanel vigila las carpetas locales <QDD_HOME>/claude/<carpeta>, que son de todos los proyectos de la máquina, y reaccionaba a cualquier evento: el latido del teléfono de cada panel (cada 5 s) crea y borra <proyecto>.json.lock en claude/telefono sin cambiar datos, y eso despertaba a todos los demás paneles (48 eventos en 20 s con 8 paneles). 2) Cada relectura cargaba estado.yaml unas cinco veces (Panel, Acciones, EsperasDelPanel, PreguntasA, descartes, atenciones), y con 115 KB cada parseo de YAML cuesta ~6 ms: 31 ms por relectura."
impact: "Con N paneles abiertos, el trabajo crece como N²: cada uno despierta a todos. En una máquina de 16 hilos se iba ~medio núcleo constante, que se notaba como caídas de FPS en un juego y menos batería. Nadie lo veía porque cada proceso por separado parecía chico."
action_taken: "1) EventoDelPanel: un .lock o un .tmp nunca despierta al panel (la escritura atómica avisa al renombrar el archivo final), y en las carpetas locales compartidas solo importa el archivo del propio proyecto. SenalesDelPanel recibe ese filtro. 2) estado.Load recuerda el último parseo y solo vuelve a parsear si los bytes cambiaron; siempre entrega una copia profunda (clonar), porque quien carga puede modificar lo que recibe y no guardarlo si Check lo rechaza. Medido con pprof sobre una copia de los datos reales: la relectura bajó de 31 ms a 3,5 ms, y las relecturas de 1-2 por segundo a la del respaldo (cada 10 s) más los cambios reales."
test_result: "cli/pkg/consola/seguir_test.go: TestSenalesDelPanel_UnCandadoOUnTemporalNoAvisan y TestEventoDelPanel_EnLoCompartidoSoloElArchivoPropio fallaban (no compilaban: SenalesDelPanel no filtraba) y pasan. cli/pkg/estado/load_recordado_test.go: TestLoad_ParseaUnaVezMientrasElArchivoNoCambia, TestLoad_ModificarLoCargadoNoCambiaLaProximaCarga y TestClonar_NoComparteNingunSliceNiMapa (recorre con reflect todo Estado, así que un campo nuevo con un slice o un mapa sin clonar la hace fallar)."
status: resolved
detectado_por: persona
date: "2026-11-08"
