id: "FND-288"
title: "Las pruebas dejaban carpetas en el TMPDIR de la máquina"
description: "Medido 2026-11-21 cuando /mnt/fast (el TMPDIR de este PC) llegó al 100 %: había 1916 carpetas TestGoal_CorreLosPedidosDeLaIAYNoLosDeUnPR*, 58 TestAccion_UnPedidoAprobadoEnElPCDiceLugarPC* y otras, y en cada corrida de pkg/consola quedaba una qdd-pruebas-* vacía. Tres causas: un pedido lanzado por la prueba sigue un momento en su proceso después de marcarse hecho y vuelve a crear su carpeta de QDD_HOME cuando la prueba ya la borró; aislar.Correr borraba su QDD_HOME una sola vez, aunque un proceso rezagado la volviera a crear; y los ayudantes que una prueba lanza con el mismo binario (-test.run=^TestSeguirAyudante$, -test.run=^$, ^TestAuditAyudante$) creaban su propio QDD_HOME aislado (qdd-pruebas-* o qdd-home-*, con uso/<versión>.json) y salían con os.Exit o los mataban sin borrarlo."
impact: "Cada corrida de pruebas dejaba basura en el disco de la persona, y con muchas corridas (IAs que auditan seguido) llenó el disco temporal y cortó compilaciones de otras sesiones (\"no space left on device\")."
action_taken: "esperarEstado espera a que salga el proceso de un pedido hecho o fallido (hasta 5 s); aislar.Correr insiste en borrar su carpeta durante 1 s; un ayudante usa la carpeta que hereda (aislar.Carpeta, también en los TestMain de cmd y blueprints, y el de audit la de su prueba) en vez de crear otra. Medido con TMPDIR propio fuera de un repositorio: go test ./... dejaba 2 qdd-home-* por corrida y pkg/consola 1 qdd-pruebas-*; cmd, blueprints, consola, estado y reportes ahora dejan 0 (dos corridas)."
test_result: "cli/pkg/aislar/aislar_test.go TestCorrer_BorraSuCarpetaAunqueUnProcesoRezagadoLaVuelvaACrear falló sin el arreglo («la carpeta de las pruebas quedó en la máquina») y pasa con él; TestCorrer_UnAyudanteUsaElQDDHomeDeSuPadre pasa con él. Tres corridas de pkg/consola con TMPDIR=/tmp/qdd-fuga.*: 1 resto cada una antes, 0 después."
status: resolved
detectado_por: ia
date: "2026-11-21"
