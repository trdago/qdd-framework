id: "FND-234"
title: "Una sesión detenida en un permiso tomaba los mensajes del teléfono y quedaban «ejecutando» — MEJ-084"
description: "2026-11-15, qdd rc.87, proyecto proyecto-b (MEJ-084): a las 20:09 y 20:32 la persona mandó desde QDD Móvil un mensaje a la IA y el pedido quedó «ejecutando» hasta fallar a los 15 min. Los tomó la sesión 5a61b6fd: un trabajo de Claude Code en segundo plano («notificador-export-1506», kind bg) detenido en un permiso desde las 03:32 (~/.claude/sessions/2290863.json: status waiting, waitingFor permission prompt). Su mod seguía latiendo cada 5 s y tomaba las instrucciones; Claude Code las dejó en su cola (queue-operation enqueue a las 23:09:58 y 23:32:48 UTC, sin dequeue) detrás del permiso, así que $.prompt.submit no volvió y nadie confirmó la entrega. La ventana que la persona miraba (2a4886f1) estaba libre. El diálogo no estaba entre las preguntas de qdd, así que qdd no sabía que esa sesión no podía recibir."
impact: "Un mensaje del teléfono se pierde en silencio cuando otra sesión del proyecto (a veces una que la persona no ve) espera un permiso: la persona espera 15 min y el teléfono solo dice que puede no haber llegado."
action_taken: "pkg/consola lee lo que Claude Code publica de cada proceso (<config>/sessions/<pid>.json): una sesión con status waiting y su proceso vivo no toma instrucciones (tomar, por latir y por el flujo). Las toma otra sesión abierta, o la misma cuando el diálogo se cierra; una dirigida (Para, MEJ-082) a una sesión detenida la toma otra. Mientras espera, la instrucción dice el motivo (la sesión <id> espera un diálogo en la terminal), que el pedido del teléfono muestra, y si vence a los 30 min vence con ese motivo. Un archivo ausente, ilegible o de un proceso muerto no cuenta. Ficha remoto y RFC 0013 actualizadas."
test_result: "cli/pkg/consola/sesion_en_dialogo_mej084_test.go: la sesión en un diálogo no la toma y la toma otra; cuando el diálogo se cierra la toma; dirigida a una sesión detenida la toma otra; un archivo de un proceso muerto o ilegible no la detiene; el pedido dice el motivo y vence con él; tomada borra el motivo. Fallaban antes del cambio (rojo) y pasan; go test ./pkg/consola/ ./pkg/remoto/ en verde."
status: resolved
detectado_por: persona
date: "2026-11-15"
