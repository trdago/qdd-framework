id: "FND-240"
title: "qdd_project_context pasaba el tope de una herramienta con fichas grandes"
description: "MEJ-073 (REP-490, qdd-movile, rc.59): qdd_project_context con 3 rutas devolvió 68.841 caracteres. Claude Code lo rechazó por pasar el tope de una herramienta y lo dejó en un archivo que hubo que leer por partes. En qdd, una sola carpeta (cli/pkg/remoto) daba 50.537. La causa: cada llamada traía las fichas enteras (todas las decisiones en párrafos largos, usuarios y caso real) y el mapa de todos los módulos, aunque la IA fuera a tocar uno."
impact: "Cada tarea empezaba gastando miles de tokens en contexto que la IA no usaba, y con fichas que crecen sprint a sprint la respuesta dejaba de llegar entera: más probable que una IA pasara por alto una invariante."
action_taken: "Decisión de la persona: «Adelgazar y certificar» (opción recomendada que eligió el modo goal, 2026-11-20). Por defecto, cada decisión sale en su primera frase (hasta 160 caracteres) y las invariantes, el criterio de éxito, la arquitectura y las pruebas salen enteros; usuarios y caso real, a pedido. Con rutas, el mapa de módulos sale como una línea con cuántos hay. Una ficha con más de 25 decisiones pide dividirse. La ficha entera y el mapa siguen a un parámetro: detalle=completo en la tool, --completo en 'qdd modules context'. El ambiente limpio (e2e/limpio) certifica en cada PR que tools/list y project_context de un proyecto nuevo caben en su presupuesto."
test_result: "cli/pkg/modules/contexto_liviano_test.go: 3 fichas de 30 decisiones largas y 40 módulos más caben en 12.000 caracteres (10.073) con cada invariante entera y cada decisión nombrada; completo trae la ficha entera y el mapa; sin rutas, el mapa. No compilaba sin el cambio (rojo). En qdd: cli/pkg/remoto bajó de 50.537 a 20.940 caracteres; tres rutas, de 58.426 a 26.016. TestMCP_DescripcionesDentroDelPresupuesto detectó que el parámetro nuevo pasaba tools/list a 16.117 de 16.000 y se acortaron descripciones. go test ./... en verde; e2e/limpio/certificar.sh en verde con los dos pasos de tokens."
status: resolved
detectado_por: qdd-movile
date: "2026-11-20"
