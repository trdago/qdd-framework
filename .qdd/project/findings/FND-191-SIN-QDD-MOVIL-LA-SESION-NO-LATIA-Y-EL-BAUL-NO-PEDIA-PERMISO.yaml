id: "FND-191"
title: "Sin QDD Móvil la sesión no latía, y qdd baul usar nunca dejaba el pedido 🔑"
description: "2026-11-09, Windows 10, qdd 2.10.0-rc.54 (MEJ-056, reporte REP-479 por el relay): qdd baul usar <token> --para … -- <cmd> respondía siempre «la sesión <id> no late en este proyecto» y salía con 1, sin dejar el pedido 🔑 en el panel, aunque el panel estaba abierto en modo flujo. Con dos sesiones y tras reiniciar Claude Code tres veces, igual. En ~/.local/share/qdd/claude/sesiones/ no había archivo del proyecto."
impact: "En un PC sin QDD Móvil emparejado, la persona no tenía forma de dar permiso al baúl: ningún token se podía usar desde una sesión de Claude Code. Lo mismo dejaba sin sesión viva a quien pregunta por ella (HaySesion: el modo goal, las respuestas del teléfono)."
action_taken: "latidoDelFlujo (cmd/consola_seguir.go) y telefonoLatir (cmd/consola_telefono.go) salían antes de anotar la sesión si no había credenciales del relay: venían de cuando la sesión viva solo servía al teléfono. El baúl (RFC 0023) la usa también. Ahora la sesión late siempre; entregar instrucciones sigue siendo solo con QDD Móvil."
test_result: "cmd: TestLatidoDelFlujo_SinQDDMovilAnotaLaSesionPeroNoEmite_FND191 y TestConsolaTelefono_SinQDDMovilLatePeroNoEntrega_FND191 fallaban antes del cambio (reemplazan a las dos pruebas que fijaban lo contrario) y pasan después; go test ./cmd ./pkg/baul ./pkg/consola en verde; GOOS=windows go vet ./cmd sin errores. Sin probar en el Windows de la persona. Queda sin cubrir el camino sin flujo: el mod pausa 60 s tras «activo: false» y la sesión vive 30 s, así que ahí late a ratos."
status: resolved
detectado_por: persona
date: "2026-11-09"
