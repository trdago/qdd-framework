id: "FND-251"
title: "Una herramienta guardaba un token escrito fuera de sus argumentos y el rechazo lo repetía"
description: "herramientas.Guardar buscaba secretos solo en el comando, la prueba de humo y los argumentos de cada acción. Un ghp_ en el nombre, la descripción o una opción de un campo se guardaba en .qdd/herramientas/<id>.yaml (versionado); uno en el modo, el tipo de un campo o la ruta del comando se rechazaba citándolo entero en el mensaje; y una prueba de humo que fallaba imprimiendo el valor de una variable de su entorno lo repetía en el mensaje de qdd herramienta guardar."
impact: "Rompía herramientas#bb7175a2: el valor de un secreto quedaba en git o llegaba al chat de la IA que corre qdd herramienta guardar."
action_taken: "Guardar rechaza la definición si cualquier parte del texto tiene formato de credencial y tapa con ••• toda credencial en los mensajes; la salida de la prueba de humo que se cita tapa el valor de cada variable de su entorno."
test_result: "cli/pkg/herramientas/herramientas_test.go TestGuardar_UnSecretoEnCualquierCampoNoSeGuardaNiSeRepite fallaba antes (3 definiciones guardadas con el token, 3 mensajes que lo repetían, la salida de humo con el valor) y pasa después; HER_C02 exige además que ningún rechazo repita el token."
status: resolved
detectado_por: ia
date: "2026-11-21"
