id: "FND-209"
title: "El estado para el teléfono puede pasar el tope de Realtime y perderse sin que nadie lo note"
description: "2026-11-15, revisión de la comunicación con QDD Móvil: el estado completo de este PC (11 proyectos registrados) pesa unos 170 KB tal como sale por el canal, en JSON compacto. Corrección del mismo día: el primer número, 249 KB, se midió con qdd remoto estado --json, que imprime con sangría, y no es lo que viaja. Supabase Realtime descarta sin aviso un broadcast que pasa su tope (256 KB en el plan Free); la app ya lo sabía para los flujos (por eso viajan aparte, con tope de 100 KB), pero el PC nunca medía el estado. Con broadcast sin ack, el PC no se entera de que no llegó: doctor seguiría en verde y la sonda también, porque su mensaje es chico. Lo que más pesa por proyecto es el historial «logrado» (hasta 18 KB) y las acciones (hasta 23 KB)."
impact: "El día que el estado pase el tope (un proyecto más, un historial más largo), el teléfono se queda sin el panel de ese PC sin ningún error visible en el PC ni en la app."
action_taken: "El servicio anota cuánto pesó cada estado completo que salió (<QDD_HOME>/remoto/peso.json) y qdd doctor lo compara con el tope sin usar la red (REM-21): desde el 80 % avisa con los dos números. Reducir el estado (qué proyectos o qué partes del panel van al teléfono) es una decisión de la persona y de qdd-movile: queda pendiente como pregunta en el estado; --fix no lo toca. Además, pedido de qdd-movile: la salida de cada logro va al teléfono recortada a 500 caracteres (antes 2000), el final con «…» delante. En este PC el recorte casi no cambia nada (133 bytes), porque sus salidas son cortas: lo que más pesa son las acciones (76 KB) y lo logrado (50 KB, sobre todo motivo y título). Lo logrado bajo pedido, acordado con qdd-movile, va en la rama feat/logrado-bajo-pedido. 2026-11-22: el estado completo que salió pesó 184 006 bytes (72 % del tope; lo logrado bajo pedido ya ahorraba unos 58 KB). Las filas del tablero viajan sin su pregunta (acordado con qdd-movile): 93 filas, 15 KB menos. Acordado con qdd-movile el arreglo de raíz: un estado completo para teléfonos con la capacidad estado_por_partes sale en partes de hasta 128 KB, cada una con la cabecera completa; la app solo lo dibuja con todas las partes del mismo seq. Sigue abierto hasta que las partes estén en el PC y en la app."
test_result: "cli/pkg/remoto/peso_fnd209_test.go: TestPeso_ElServicioAnotaCuantoPesaElEstadoCompleto_FND209 y TestPeso_SeGuardaYSeJuzgaContraElTope_FND209, TestPeso_LaSalidaDeCadaLogroVaRecortadaYElEstadoBaja_FND209 (lo logrado de un proyecto grande baja de 134.578 a 37.138 bytes); cli/cmd/remoto_sonda_doctor_test.go: TestDoctorMovil_UnEstadoCercaDelTopeAvisaYNoSeRepara_REM21_FND209. cli/pkg/remoto/filas_sin_pregunta_fnd209_test.go: TestTablero_LasFilasVanAlTelefonoSinPregunta_FND209. Fallaban antes (no existían AlPesar, GuardarPeso ni REM-21) y pasan después. El tope de 256 KB es el documentado para el plan Free de Supabase; no se midió contra el relay real con un estado mayor."
status: open
detectado_por: ia
