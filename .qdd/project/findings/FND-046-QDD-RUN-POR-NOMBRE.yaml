title: "qdd run fallaba siempre que QDD se invocaba por su nombre"
description: "executePipelineCommand lanzaba os.Args[0] con os.StartProcess, que no busca en el PATH. Invocado como 'qdd' (lo normal tras npm install -g) respondía 'fork/exec qdd: no such file or directory' y ejecutaba el rollback."
impact: "El pipeline documentado en el README no funcionaba para nadie que lo instalara normalmente; solo con ruta absoluta."
action_taken: "selfExecutable() usa os.Executable() (con LookPath de respaldo). Test en cli/cmd/root_raiz_test.go; el recorrido de primera vez lo prueba invocando 'qdd' desde el PATH."
date: "2026-10-24"
