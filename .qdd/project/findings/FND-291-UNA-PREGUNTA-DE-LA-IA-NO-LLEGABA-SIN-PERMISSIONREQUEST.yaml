id: "FND-291"
title: "Una pregunta de la IA no llegaba al panel ni al teléfono sin el hook PermissionRequest, y el teléfono decía «trabajando»"
description: "MEJ-094 (REP-510, QDD rc.107, windows/amd64, 2026-11-21): la IA preguntó con AskUserQuestion (3 preguntas) y la sesión estuvo unas 3 horas esperando; QDD Móvil mostraba «trabajando» y ninguna pregunta. Dos causas: (1) el mod registraba la pregunta solo desde el hook PermissionRequest, que Claude Code no garantiza para AskUserQuestion (la documentación de hooks solo dice que corre cuando va a pedir permiso; anthropics/claude-code #15400 y #59908; en Windows los hooks tienen reglas propias); sin él, nada se registraba. (2) trabajando lo pone la primera api-request del turno y lo quita turn_duration, que Claude Code no escribe hasta que alguien responde. En este PC (Linux) el hook sí corre: la pregunta de las 16:18:53 se registró y la respondió el modo goal."
impact: "La persona, lejos del PC, creía que la IA seguía trabajando mientras la sesión estaba detenida esperándola: horas perdidas sin aviso, ni en el panel ni en el teléfono."
action_taken: "(1) Si a los 5 s de la llamada a AskUserQuestion no llegó el PermissionRequest, el mod la registra con responder_en «pc»: sale en «▶ Para ti» sin botones, en el teléfono con su push y sin botones (acordado con qdd-movile), y ResponderPregunta la rechaza con ErrSoloEnPC (teléfono, panel o goal; el goal la cuenta como algo que espera a la persona). Si el permiso llega tarde, se cierra la del respaldo y se registra la normal; si qdd no la registra, «Para ti» la cuenta igual (MEJ-057). (2) El tool_use de AskUserQuestion del hilo principal quita trabajando; la api-request siguiente lo retoma con la hora de inicio del turno, para que el contador del teléfono no vuelva a cero. Decisiones en las fichas estado, goal (invariante goal#49d86e1f) y remoto."
test_result: "Mod: para-ti-siempre.test.ts (7 pruebas MEJ-094: respaldo registrado con responder_en pc, sin registrar, sin botones, sin duplicar con el permiso a tiempo o tarde, solo AskUserQuestion); fallaron sin el arreglo, 362/362 pasan. Go: preguntas_solo_pc_mej094_test.go y consola_esperando_mej094_test.go fallaron sin el arreglo y pasan."
status: resolved
detectado_por: persona
date: "2026-11-21"
