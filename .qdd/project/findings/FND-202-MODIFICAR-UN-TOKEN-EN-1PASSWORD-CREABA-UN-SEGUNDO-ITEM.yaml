id: "FND-202"
title: "Modificar un token en 1Password creaba un segundo ítem"
description: "2026-11-13: la prueba de punta a punta del baúl (binario real, op falso, carpetas temporales) guardó pg-app en 1Password y lo modificó; quedaron dos ítems «qdd-baul-pg-app». Guardar siempre corría «op item create», y 1Password deja convivir ítems con el mismo título; después «op item get» falla con «more than one item matches» y el token no se puede usar. El op falso de las pruebas guardaba un solo archivo, así que el caso nunca se vio."
impact: "Quien modifica (rota) un token guardado en 1Password lo deja inservible, y el valor anterior queda en 1Password."
action_taken: "Al modificar un ítem que ya está en 1Password, guardarValor crea el nuevo con el título «.nuevo» (el valor por la entrada estándar, nunca en argumentos), borra el anterior y le pone el título con «op item edit --title». Si no puede borrar el anterior, borra el nuevo y lo dice: el anterior sigue igual. Las pruebas usan un op falso que se comporta como el real (varios ítems con el mismo título; get, delete y edit exigen uno solo)."
test_result: "cli/pkg/baul/op_modificar_test.go: TestFND202_ModificarEnUnoPasswordDejaUnSoloItem fallaba antes (quedaban 3 ítems tras 3 guardados) y pasa después; TestFND202_SiNoSePuedeBorrarElAnteriorNoQuedaElNuevo fija la salida segura. Las pruebas de pkg/baul siguen pasando."
status: resolved
detectado_por: ia
date: "2026-11-13"
