id: "FND-310"
title: "La tool qdd_release no pasa el gate y calla sus errores"
description: "2026-11-24, al comparar la documentación pública con el código (sprint 10). pkg cmd/mcp_agile.go: runReleaseBuilds y tagRelease ignoran el error de npm run build, make build y git tag, y la tool responde siempre «Release X finalizado». No corre qdd audit. Un recorrido por MCP creó el tag con una prueba en rojo."
impact: "Un agente puede etiquetar una versión rota creyendo que se revisó."
action_taken: "qdd_release corre el gate y compila antes de etiquetar; si algo falla, o el tag ya existe, lo dice y no etiqueta ni cambia la versión. npm run build corre solo si el script existe."
