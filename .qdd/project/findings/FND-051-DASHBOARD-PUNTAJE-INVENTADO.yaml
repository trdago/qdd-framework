title: "El dashboard mostraba 100 'World-Class' con pruebas que fallaban, y gráficos inventados"
description: "El dashboard calculaba su propio puntaje solo con findings abiertos (decisión de FND-021), así que un proyecto con una prueba rota mostraba 100 'World-Class' mientras qdd audit lo bloqueaba con 84/100; ese 100 además se guardaba a diario en el historial. Sin historial dibujaba una evolución inventada (40 → 75 → 100) y el gráfico siempre incluía series fijas de certificaciones (10, 20, 27), bugs (15, 5, 0) y sprints (1, 2, 4)."
impact: "La pantalla que miran quienes no usan la terminal contradecía al gate; dos cifras distintas hacen que no se confíe en ninguna."
action_taken: "Reemplaza la decisión de FND-021: el dashboard muestra el puntaje único (audit.Score) de la última certificación con la escala actual, sin correr las pruebas en cada refresco. Al abrirse sin certificación vigente mide una vez con qdd certify y mientras tanto muestra '—' / 'Midiendo'. Solo guarda historial con puntajes reales y el gráfico muestra únicamente datos reales. Tests en cli/pkg/dashboard/state_test.go, cli/cmd/dashboard_medir_test.go y cli/ui/src/App.spec.js."
date: "2026-10-24"
