id: FND-028-SINGLE-USE-VALIDATION-TOKEN-ENFORCEMENT
type: BUG
title: 'Control estricto de enlaces de validación pública de un solo uso'
status: RESOLVED
severity: MEDIUM
impact: 'MEDIUM - Luego de aplicar una decisión en un enlace público de validación, el token permanecía en estado activo y la UI permitía reenviar decisiones repetidamente.'
created_at: '2026-08-22T12:26:00-04:00'
description: 'Se desactivó el token (is_active = false) al registrar la primera respuesta en ApplyPublicTokenDecision, se bloquearon intentos posteriores con error 400 Bad Request ("enlace ya utilizado") y la UI en PublicValidationPortal.vue pasa a modo Solo Lectura con candado y sello de confirmación.'
resolution: 'Implementado, probado con test unitario en public_validation_handler_test.go y desplegado a producción.'
