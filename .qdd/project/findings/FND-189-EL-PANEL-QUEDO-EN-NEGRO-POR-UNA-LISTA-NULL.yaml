id: "FND-189"
title: "El panel quedó en negro por una lista null sin repositorio de blueprints"
description: "En un proyecto sin repositorio de blueprints de la organización (todo usuario nuevo), 'qdd consola blueprints --json' entregó \"entradas\": null, un slice nil de Go. vistaBlueprints hizo inv.entradas.filter, lanzó TypeError, y como la vista se dibujaba dentro del render entero del panel, el panel quedó en negro o congelado hasta reiniciar Claude Code. Lo reportaron MEJ-045 (Windows, rc.31 a rc.37) y MEJ-050 (Linux, rc.48)."
impact: "Abrir Blueprints, o recargar con esa vista abierta, dejaba sin panel a quien empieza con QDD. Cualquier otra lista null en cualquier vista hacía lo mismo, y la falla no llegaba a QDD: había que notarla y reportarla a mano."
action_taken: "Tres capas. 1) pkg/listas.Marshal entrega los slices y mapas sin valor como [] y {} a cualquier profundidad, y lo usan todas las salidas JSON que lee el panel (consola panel y seguir, blueprints, proyectos, preguntas, flujo ver y lista, y la foto del flujo compartido). 2) Una prueba de contrato (listas.Nulas) lee cada salida junto con su tipo de Go en un proyecto vacío y en uno con datos, y falla si alguna lista viene null. 3) El panel dibuja cada vista protegida: si lanza, se ve «✗ La vista X falló» bajo la cabecera, se puede volver al tablero o reintentar, y la falla queda una vez en 'qdd incidentes panel', anonimizada. Además, leerBlueprints normaliza entradas por si responde un qdd anterior."
test_result: "cli/cmd/consola_contrato_test.go: TestContrato_ElPanelNuncaRecibeUnaListaNull_FND189 falla con json.Marshal («.inventario.entradas») y pasa con listas.Marshal. cli/pkg/listas: TestMarshal_NingunaListaNiMapaSaleNull_FND189 y TestNulas_DiceDondeHayUnaListaNull. cli/cmd/incidentes_panel_test.go: TestIncidentesPanel_UnaVistaQueFallaQuedaAnonimizada_FND189. Panel (tests/blueprints.test.ts): «Sin repositorio de blueprints (entradas null) la vista se dibuja con su aviso (FND-189)» y «Una vista que falla se dice, deja volver al tablero y queda como incidente (FND-189)»."
status: resolved
detectado_por: persona
date: "2026-11-08"
