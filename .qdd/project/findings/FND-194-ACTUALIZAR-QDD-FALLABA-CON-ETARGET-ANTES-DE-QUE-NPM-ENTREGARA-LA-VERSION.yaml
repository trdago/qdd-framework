id: "FND-194"
title: "«Actualizar qdd» fallaba con ETARGET cuando npm todavía no entregaba la versión"
description: "2026-11-08, Windows, qdd 2.10.0-rc.44 (MEJ-049, reporte REP-218 por el relay): el panel ofreció «⬆ Actualizar qdd a 2.10.0-rc.40», y al confirmarlo npm respondió «ETARGET · No matching version found». Minutos después, npm view ya la mostraba. La oferta sale de los dist-tags del registro de npm (no de GitHub ni del relay, como suponía el reporte), y esos dist-tags nombran la versión antes de que el documento del paquete, que es lo que usa npm install, la incluya en todas partes. El comando instalaba sin preguntar."
impact: "La persona confirma una actualización que falla en rojo, sin saber que basta esperar unos minutos. El pedido queda como fallido y hay que pedirlo de nuevo."
action_taken: "ComandoActualizarQDD primero corre «npm view qdd-framework@<v> version --prefer-online»: si npm no la ve, el pedido sale con 75 («todavía no»), queda armado y se reintenta solo. La instalación también va con --prefer-online, para que la caché de npm no responda por el registro. El paréntesis y «exit 75» valen igual en sh y en cmd. La otra parte del reporte (desde QDD Móvil, «Ya lo hice» a un ⏳ que ya había cambiado) no es un fallo del PC: desde v2.8.0 una respuesta a una espera que ya no está se rechaza como vencida («esa pregunta ya no está en este PC»), y TestEspera_CuandoLaCeldaCambiaLaPreguntaSale lo fija. Cómo lo muestra el teléfono es de qdd-movile."
test_result: "cli/pkg/consola/version_nueva_test.go: TestComandoActualizarQDD_EsperaAQueNpmLaEntregue_FND194 corre el comando con la shell del sistema y un npm falso. Sin la versión, sale con 75 y no instala; con la versión, instala con --prefer-online. Falló antes del cambio (código 0: instalaba sin preguntar) y pasa después en Linux. En el CI corre también en Windows con cmd /C y un npm.cmd falso (filtro FND194 del job «Flujo del panel en Windows»). TestVersion_SeOfreceComoPedidoOpcional (FND-143) sigue exigiendo --allow-scripts=qdd-framework."
status: resolved
detectado_por: persona
date: "2026-11-10"
