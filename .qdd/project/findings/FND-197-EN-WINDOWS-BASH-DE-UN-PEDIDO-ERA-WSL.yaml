id: "FND-197"
title: "En Windows, «bash» en un pedido abría WSL, su error se guardaba ilegible y doctor --fix no registraba la tarea de qdd remoto"
description: "2026-11-10, Windows 10, qdd 2.10.0-rc.59 (MEJ-058, reporte REP-481 por el relay): un pedido «bash <script>» corrió en cmd.exe, donde «bash» resuelve a C:\\Windows\\System32\\bash.exe, el lanzador de WSL, antes que el bash de Git que usa la sesión de Claude Code. Con WSL colgado (HCS_E_CONNECTION_TIMEOUT) el pedido murió por timeout, y el resultado que guardó el panel era UTF-16LE sin decodificar («L\\0a\\0 \\0o\\0p…»). Además, 'qdd doctor --fix' (REM-06) arrancaba la tarea de qdd remoto con el XML ya escrito, que no tenía usuario: schtasks /Create la rechazaba sin administrador y el servicio no quedaba corriendo."
impact: "En Windows con WSL instalado, cualquier pedido que la IA dejaba con bash (scripts de publicación, merges encadenados) fallaba lejos de lo que la IA probó, con un error que nadie podía leer; y doctor no reparaba qdd remoto."
action_taken: "En Windows, el pedido lleva primero en su PATH la carpeta del bash de Git: el de CLAUDE_CODE_GIT_BASH_PATH si existe, o Git\\bin\\bash.exe junto a git (Git\\cmd o Git\\mingw64\\bin). Sin bash de Git no cambia nada. La salida que se guarda pasa por salidaLegible: UTF-16LE (con BOM o con nulos en casi todas las posiciones impares) se decodifica; UTF-8 queda igual. arrancarServicioMovil llama a RenovarTarea (FND-195) antes de registrar y arrancar la tarea."
test_result: "cli/pkg/consola/pedido_bash_test.go: TestEntornoDelPedido_EnWindowsBashEsElDeGit_FND197, TestBashDeGit_LoBuscaJuntoAGit_FND197 y TestSalidaLegible_UTF16DeWSLSeLee_FND197 (no compilaban antes: no había nada que hiciera eso). cli/cmd/remoto_doctor_fnd142_test.go: TestDoctor_ArrancarQDDRemotoPoneAlDiaLaTarea_FND197 falló antes (la tarea seguía sin usuario) y pasa después. Corren también en el job de Windows del CI (filtro FND197)."
status: resolved
detectado_por: persona
date: "2026-11-11"
