id: "FND-135"
title: "Un pedido que llamaba a qdd fallaba mientras se reinstalaba qdd"
description: "Mientras npm reemplaza qdd-framework, el binario nativo falta unos segundos. El envoltorio npm/bin/qdd.js respondía salida 1 y pedía reinstalar. El 2026-11-03 un pedido de mergear un PR falló así con spawnSync .../bin/qdd ENOENT, mientras otro pedido instalaba 2.8.1."
impact: "El pedido quedaba en rojo por una causa pasajera, con un mensaje que mandaba a reinstalar algo que ya se estaba instalando."
action_taken: "Si falta el binario, el envoltorio dice que qdd se está actualizando y sale con 75. El panel lo muestra como «todavía no» y un pedido armado se reintenta. Si el archivo existe pero no se puede ejecutar, sigue siendo un fallo. Límite conocido: si en ese instante falta el propio qdd.js, el error lo da la shell o node y sigue siendo un fallo."
test_result: "npm/test/qdd.test.js: sin binario sale con 75 y dice que qdd se está actualizando; con binario entrega su salida tal cual; un binario que no se puede ejecutar sigue siendo un fallo"
status: resolved
detectado_por: ia
date: "2026-11-04"
