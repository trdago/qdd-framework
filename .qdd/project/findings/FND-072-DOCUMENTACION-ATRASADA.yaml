title: "La documentación no mostraba lo nuevo de QDD y citaba comandos que no existen"
description: "Desde v1.9.23 la documentación quedó atrás del binario. El README, getting-started y la arquitectura no mencionaban blueprints, fichas de módulo, el gate veraz ni el adaptador OpenCode. La referencia omitía 6 comandos reales (qdd modules, modules approve, modules context, blueprint show, certify human, mcp-server) y 6 tools MCP (qdd_project_context, qdd_module_save, qdd_certify_human, qdd_postgres_tuner, qdd_sync_graph, qdd_graph_query). La arquitectura indicaba 'qdd sync' y 'qdd score', que no son comandos de la CLI, y el README de npm listaba /qdd validate y /qdd docs, marcados como no implementados. El badge de build apuntaba a azure-pipelines.yml, que no existe."
impact: "Quien llegaba por GitHub o npm no se enteraba de las capacidades principales de las últimas versiones, y la IA de su proyecto usaba tools que la persona no encontraba en ninguna parte. Una organización no tenía una guía para crear su repositorio de blueprints."
action_taken: "Referencia completa (CLI, tools MCP agrupadas, reglas del gate y adaptadores de IA), guía nueva docs/blueprints.md, arquitectura con fichas y blueprints, getting-started con el recorrido actual, README y README de npm al día, y badge corregido. Al rebasar sobre v2.6 (2026-10-30), la guía de blueprints pasó al modelo de la carpeta central (RFC 0004) y de varias fuentes (RFC 0007), y la referencia sumó qdd estado, qdd consola, qdd_estado y qdd_consola_pedir: el test de la referencia los marcaba como faltantes. Era FND-055, renumerado porque main ya tenía otro FND-055. El registro de tools MCP queda en registerMCPTools. Tests en cli/cmd/docs_reference_test.go: la referencia debe nombrar cada comando de la CLI y cada tool registrada, no puede nombrar tools que el servidor no registra, y los enlaces relativos de README y docs/ deben existir."
date: "2026-10-27"
