id: "FND-231"
title: "«Para ti» con otros proyectos se leía como un solo proyecto"
description: "2026-11-15, captura de la persona en el panel de notificador_de_ofertas: «¿por qué se mezclaron los proyectos en 1 solo proyecto?». Los datos estaban bien (qdd consola panel --con otros: fairplay_agent 2, qdd 17, qdd-movile 7, sfrc 17, secondscreemeditor 2 preguntas, cada una de su proyecto), pero el panel de Claude Code (qdd-tareas, otroProyecto) dejaba un renglón entre el nombre del proyecto y su «? N preguntas», el mismo renglón que entre un proyecto y el siguiente, y lo de este proyecto no llevaba nombre. Cada cuenta quedaba a la misma distancia de su proyecto y del siguiente."
impact: "La persona no podía saber de qué proyecto era cada grupo de preguntas: el panel parecía haber mezclado todo en un proyecto."
action_taken: "El nombre de cada proyecto y su «? N» van en la misma línea (ot-cab-<carpeta>), lo demás sangrado 2 debajo (ot-cont-<carpeta>), y el renglón queda solo entre proyectos. Con otros proyectos debajo, lo de este proyecto lleva «◦ <carpeta> · este proyecto» y va sangrado igual; sin otros, «Para ti» queda como antes."
test_result: "cli/pkg/consola/mod/qdd-tareas/tests/para-ti-otros.test.ts: «el nombre de cada proyecto y su «? N» van en la misma línea, y lo demás sangrado debajo» y «con otros proyectos, lo propio lleva su nombre» fallaban antes del cambio y pasan; «sin otros proyectos, lo propio no lleva nombre» fija lo de antes. claude plugin test: 328 de 328."
status: resolved
detectado_por: persona
date: "2026-11-15"
