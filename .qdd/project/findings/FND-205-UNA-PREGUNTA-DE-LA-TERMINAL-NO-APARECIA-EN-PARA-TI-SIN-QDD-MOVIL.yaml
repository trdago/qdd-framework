id: "FND-205"
title: "Una pregunta de la terminal (AskUserQuestion o un permiso) no aparecía en «Para ti» sin QDD Móvil, ni si qdd no la registraba"
description: "2026-11-10, Windows 10, qdd 2.10.0-rc.57 (MEJ-057, reporte REP-480 por el relay): la IA preguntó con AskUserQuestion y la pregunta no salió en «▶ Para ti»; la persona tuvo que contestar en la terminal. Al escribir las pruebas del sprint 8 (una por cada tipo de pregunta) aparecieron dos huecos. 1) 'qdd consola pregunta registrar' solo anotaba la pregunta si el PC tenía QDD Móvil activado o el modo goal encendido (RFC 0013: sin teléfono no había a quién más preguntarle). Pero «Para ti» dibuja solo lo que está en esa cola, así que sin teléfono una pregunta de la terminal nunca aparecía en el panel. 2) Si registrar fallaba (cola tomada, timeout, un qdd anterior que sin teléfono devuelve id vacío), el panel no la contaba en ningún lado. Además, el aviso «📱 También se puede responder desde QDD Móvil» salía aunque no hubiera teléfono. No se sabe si el PC del reporte tenía QDD Móvil activado; si lo tenía, la causa de ese caso no está confirmada."
impact: "Quien trabajaba sin QDD Móvil no veía en el panel ninguna pregunta ni permiso abierto en la terminal: «Para ti» decía «nada por hacer» mientras Claude Code esperaba una respuesta."
action_taken: "registrar anota toda pregunta, con QDD Móvil o sin él, y devuelve telefono (true solo con QDD Móvil o goal). El mod sigue latiendo mientras el diálogo está abierto ('pregunta esperar' cada 10 s), así que no vence, y muestra el aviso del teléfono solo con telefono. Si registrar falla o devuelve id vacío, el mod la guarda en memoria (sinRegistrar) y «Para ti» la cuenta en «? N» y en «N por responder» como «… · en la terminal». Sale al terminar su herramienta, o la siguiente si no se pudo atar a una, o al cerrar la sesión. Sprint 8: un contrato en Go recorre cada constante Tipo… y Origen… de pkg/consola y falla si una nueva no tiene su prueba de «Para ti» ni el motivo por el que no pregunta."
test_result: "cli/cmd/consola_preguntas_test.go: TestConsolaPregunta_SinQDDMovilIgualRegistraParaElPanel_MEJ057 y TestConsolaPregunta_ConQDDMovilDiceQueHayTelefono fallaban antes (id vacío; sin telefono) y pasan después. cli/pkg/consola/mod/qdd-tareas/tests/para-ti-siempre.test.ts: «sin QDD Móvil la pregunta se registra… sin ofrecer el teléfono», «si qdd no registra la pregunta, «Para ti» igual la cuenta…» y «un qdd anterior que sin QDD Móvil no registra…» fallaban antes y pasan después; mod 305/305. cli/pkg/consola/para_ti_siempre_test.go (TestParaTi_*, 10 pruebas: los 6 tipos con turno, turnos distintos, el teléfono ve lo mismo, el contrato, respondida o vencida sale, el latido, la cola ilegible, dos sesiones y el tope de la cola) pasa; el contrato falla si se le quita un origen (mutación probada). No probado en Windows ni en una sesión real."
status: resolved
detectado_por: persona
date: "2026-11-15"
