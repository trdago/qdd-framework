id: "FND-308"
title: "qdd init no registra el servidor MCP en Claude Code ni en OpenCode"
description: "2026-11-24, al comparar la documentación pública con el código (sprint 10). Los adaptadores solo escriben .cursor/mcp.json (pkg/integration/cursor.go y antigravity.go); ningún código escribe .mcp.json, opencode.json ni corre claude mcp add, aunque README, npm, getting-started y la referencia decían que quedaba conectado. Comprobado por lectura y con grep; en el PC de desarrollo funciona porque está registrado a mano a nivel de usuario. Además el command de .cursor/mcp.json es una ruta absoluta de la máquina, que se rompe al commitearla."
impact: "Quien empieza con Claude Code tiene las reglas, pero la IA no tiene las tools de QDD."
action_taken: "La documentación dice cómo registrarlo a mano (claude mcp add). Falta que init o consola activar lo registre y doctor lo revise."
