id: "FND-215"
title: "Una prueba del dashboard falla a veces en el gate: una ráfaga de cambios no se difunde a tiempo"
description: "2026-11-15: TestVigilar_ReaccionaSoloAEventosReales (pkg/dashboard) falló dos veces en el gate con «una ráfaga de cambios reales produjo 0 difusiones; want 1», ambas con la máquina cargada (load ~24, varias sesiones corriendo go test). Esperaba la difusión en una ventana fija de 2,5 s, con 1 s de agrupación más armar el estado. No se reprodujo: 0 fallas en 18 corridas con la CPU saturada (32 procesos en 16 núcleos), ni en 16 corridas del paquete completo en paralelo, con la versión vieja ni con la nueva. Causa sin confirmar: lentitud al armar el estado o un evento de fsnotify perdido bajo carga de disco."
impact: "El gate puede fallar sin que el cambio tenga que ver (90/100) y obliga a repetirlo. qdd dashboard está obsoleto (RFC 0018), así que no afecta a la persona."
action_taken: "Mitigación: la prueba espera la primera difusión hasta 15 s (vuelve apenas llega) y después comprueba que la ráfaga no produjo otra en la ventana de agrupación más 1 s. Si vuelve a fallar con esta espera, la causa es un evento perdido y no la lentitud."
test_result: "Estrés local sin reproducción (ver descripción). Queda abierto hasta ver si vuelve a fallar en el gate o en el CI."
status: open
detectado_por: ia
date: "2026-11-15"
