id: "FND-181"
title: "Ramas con sangría anidadas cuatro niveles se pasan del ancho"
description: "Una rama lado a lado que adentro tiene ramas con sangría, tres o cuatro niveles, suma 3 columnas por nivel más una caja de 7 y pasa del ancho de su rama. En 24 000 dibujos al azar pasa en 2 (antes de los desvíos al costado, en 12). Caso: semilla 23, ronda 220, ancho 50 (n0 → n1, n3, n7, n6; n1 → n2, n4; n2 → n5, n6; n5 → n8, n9; n8 → n10 → n8): una línea ocupa 59 columnas."
impact: "En flujos muy ramificados y un panel angosto, una línea del dibujo se corta a la derecha. No se pierde ningún nodo."
action_taken: "bifurcacion dibuja lado a lado de prueba. Si una rama no cabe en su columna, deshace lo dibujado (hechos) y dibuja toda la bifurcación con sangría desde ese nivel, que le deja el ancho entero. Medido con el barrido de 60 semillas × 400 rondas: 0 líneas pasadas del ancho (antes, 2). El barrido tarda 15 s y no queda en la suite. El dibujo de siempre no se hizo más lento: TestDibujar_NoSePasaDelAncho tarda 0,77 s con y sin el cambio."
test_result: "TestDibujar_RamasConSangriaAnidadasCabenEnSuRama_FND181 (cli/pkg/flujo/ancho_fnd181_test.go), con el caso de la semilla 23 y la ronda 220 en todos los anchos de 40 a 80, falla sin el arreglo (51 columnas en 46) y pasa con él. go test ./pkg/flujo en verde."
status: resolved
detectado_por: ia
