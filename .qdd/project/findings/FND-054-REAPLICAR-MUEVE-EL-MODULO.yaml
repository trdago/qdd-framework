title: "Re-aplicar un blueprint movía el módulo a las rutas sugeridas y la ficha citaba una copia que ya no existe"
description: "Al definir cómo doctor repara un módulo desactualizado (BP-03), apareció que 'qdd blueprint apply' sin --ruta reemplazaba las rutas propias del módulo (p. ej. internal/crm) por las sugeridas por el blueprint y creaba esqueletos ahí. Además, desde v2.0.0 la ficha seguía citando como fuente .qdd/blueprints/<id>/blueprint.yaml, que ya no existe en el proyecto."
impact: "Re-aplicar (a mano o desde doctor) desordenaba el mapa de módulos y dejaba carpetas nuevas en el proyecto; las fichas citaban archivos inexistentes."
action_taken: "Re-aplicar sin --ruta conserva las rutas del módulo; solo un módulo nuevo toma las sugeridas. Las fuentes citan el lockfile y se limpian las rutas del esquema anterior. Encontrado aplicando el principio 'doctor debe saber reparar cada funcionalidad'. Test: TestApply_ReapplyKeepsTheModuleRoutesAndCitesExistingSources."
date: "2026-10-28"
status: resolved
