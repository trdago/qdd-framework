id: "FND-216"
title: "El modo goal empujaba a la IA con tareas que esperan a la persona o a terceros"
description: "2026-11-15 (MEJ-055): con 2 min de silencio el modo goal le recordaba a la IA «quedan N tareas abiertas» contando todas las abiertas (64 en qdd), aunque casi todas esperaban a la persona (un ⏳ suyo, un uso real), a terceros (CI con verifica, INRPAC, CIAL, qdd-movile) o a otra tarea abierta. La IA no podía moverlas: gastaba los 3 recordatorios, el modo se detenía «sin avance» y la persona no sabía qué le tocaba a ella. En proyecto-a, 30 de las 47 abiertas solo tenían pendiente la Validación real, que es uso real de la persona."
impact: "El modo goal no servía en un proyecto donde todo espera a otros: empujaba sin sentido, quemaba recordatorios y no decía qué faltaba de la persona."
action_taken: "estado.Movibles separa lo que la IA mueve (primera etapa sin terminar · o ❌, un ⏳ de la IA o de una sesión del proyecto sin verifica, o todo hecho por cerrar) de lo que espera a otros; una tarea que depende de otra abierta no cuenta, y una Validación real sin empezar espera un uso real. El recordatorio nombra solo las movibles. Si no queda ninguna, el modo queda en pausa (motivo todo_espera, el panel dice «todo espera a la persona») y avisa una vez con hasta 5 ⏳ (qué y de quién); vuelve a avisar solo si cambia la huella de ese conjunto, y sigue trabajando solo cuando aparece algo movible."
test_result: "Regresión: TestMovibles_SoloLasQueLaIAPuedeMover_FND216, TestMovibles_LaValidacionRealSinEmpezarEsperaUnUsoReal_FND216 y TestMovibles_DeLaIA (pkg/estado); TestGoal_RecuerdaSoloLoQueLaIAPuedeMover_FND216, TestGoal_SiTodoEsperaAvisaUnaVezYCalla_FND216, TestGoal_UnaEsperaNuevaVuelveAAvisar_FND216 y TestGoal_CuandoAlgoSeMueveVuelveATrabajar_FND216 (pkg/consola); «el panel dice que todo espera a la persona (FND-216)» en el mod. Cuenta real con los tableros de hoy: qdd 43 movibles de 66 abiertas, proyecto-a 2 de 47."
status: resolved
detectado_por: persona
date: "2026-11-15"
