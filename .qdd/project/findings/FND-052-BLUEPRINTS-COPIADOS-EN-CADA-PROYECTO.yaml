title: "Cada proyecto cargaba su propia copia de los blueprints y nadie administraba su evolución"
description: "En v1.10–v1.11, 'qdd blueprint add' clonaba el repositorio de la organización a un temporal, lo borraba y copiaba cada blueprint a .qdd/blueprints/<id> del proyecto. Cada proyecto registraba el repositorio por su cuenta, el mismo repositorio se clonaba entero una y otra vez, y BP-02 prohibía editar la copia pero QDD no ofrecía cómo aportar el cambio al repositorio de la organización. Además se aceptaban ramas, commits sueltos y carpetas sin git como origen, y la versión de un cambio la elegía quien lo hacía."
impact: "Con 10 proyectos de FairplayChile: 10 registros, 10 copias vendorizadas, ningún flujo para aportar y ninguna garantía de que un cambio llevara la versión semver que le corresponde."
action_taken: "RFC 0004. Carpeta central por usuario (~/.local/share/qdd/blueprints): registro de organizaciones por remote git, un espejo por repositorio, store inmutable direccionado por sha256 y espacio de aportes. El proyecto solo versiona el lockfile (formato 2); el CI reconstruye desde el commit fijado. QDD dicta la evolución: solo versiones publicadas (tags vX.Y.Z), 'propose' calcula el bump semver, 'release' rechaza cambios que no pasaron por 'propose', y el gate reporta BP-05-LEGACY y BP-06-BEHIND. Migración automática una sola vez, con aviso a la IA por qdd_project_context. Tests en cli/pkg/blueprints/central_test.go, evolucion_test.go y cli/cmd/blueprints_test.go."
date: "2026-10-28"
