id: "FND-118"
title: "«Auditar» (y las demás acciones) desde el teléfono devolvía el principio de la salida y no el veredicto"
description: "Una acción del panel aprobada desde QDD Móvil que corre en segundo plano (auditar, revisar estado, aprobar una ficha) cerraba su solicitud con Recortar(salida, 600), que deja los primeros 600 caracteres. qdd audit escribe primero los pilares y al final el veredicto, así que el teléfono veía «pilar ok…» cortado y nunca si el gate pasó. Se vio al probar el sprint 2 (ejecutar desde el teléfono), cuya salida tiene que llegar con su final."
impact: "Desde el teléfono no se sabía cómo terminó una auditoría larga sin ir al PC: el resultado que llega es justo el que no dice nada."
action_taken: "alResultado (pkg/remoto/acciones.go) pasa toda la salida por el ocultador y manda su final (recortarFinal, 600 caracteres, con «…» delante si cortó). Lo mandado a ejecutar desde el teléfono usa el mismo criterio con 4000 caracteres."
test_result: "TestAccion_AuditarDesdeElTelefonoDevuelveElFinalDeLaSalida: con un qdd falso que escribe 200 líneas y el veredicto al final, la solicitud termina hecha con «VEREDICTO: gate aprobado» al final y ≤ 601 caracteres."
status: resolved
detectado_por: ia
date: "2026-11-03"
