id: "FND-065"
title: "qdd blueprint add <id>, lo que pide BP-06-BEHIND, buscaba el id en el repositorio de la organización aunque viniera de otra fuente"
description: "Sin origen, AddManaged (cli/pkg/blueprints/registry.go) usaba siempre el repositorio registrado del proyecto o de su organización. Para un blueprint importado desde otra fuente, el comando que sugieren el gate (BP-06-BEHIND), qdd blueprint sync y doctor fallaba si la organización no tenía ese id, o traía el de la organización si sí lo tenía."
impact: "Seguir la instrucción del gate no dejaba el proyecto al día, o le cambiaba la fuente de un blueprint sin avisar."
action_taken: "Sin origen, AddManaged reparte los ids por fuente: un id del lockfile se actualiza desde su propia fuente y uno nuevo, un paquete o --todos salen del repositorio registrado. Si una fuente falla, el lockfile queda como estaba. --ref se rechaza cuando lo pedido viene de varias fuentes. El aviso de BP-06-BEHIND nombra la fuente que publicó."
test_result: "TestAddManaged_ImportedBlueprintUpdatesFromItsOwnSource, TestAddManaged_AFailingSourceLeavesTheLockfileAsItWas y TestAddManaged_RefBelongsToASingleSource (pkg/blueprints): antes del arreglo la actualización de mi-bp fallaba porque el repositorio de la organización no lo tiene."
status: resolved
detectado_por: ia
date: "2026-10-30"
