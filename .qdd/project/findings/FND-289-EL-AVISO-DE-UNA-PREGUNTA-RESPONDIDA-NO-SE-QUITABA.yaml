id: "FND-289"
title: "El aviso de una pregunta respondida no se quitaba del teléfono"
description: "Medido 2026-11-21. Con qdd-movile, en los logs del relay (tabla logs, 13:54-14:01Z) hubo un POST /functions/v1/avisar por la pregunta (10:54:24) y ninguno después de que el modo goal la respondiera (10:54:25.5): el PC nunca pidió pregunta_resuelto. El registro del PC (FND-247) lo confirma después de rc.108: «push pregunta de qdd» a las 13:18:53 y ningún resuelto. Causa: avisarNuevos pedía el resuelto de un tipo solo cuando no quedaba ninguna acción de ese tipo en el proyecto, y en qdd casi siempre queda un ⏳ del tablero con una pregunta para la persona («¿Al abrir Antigravity…?»), que cuenta como pregunta. Con pedidos sí funcionaba porque a ratos no queda ninguno."
impact: "En el teléfono, el aviso «pregunta» de un proyecto con ⏳ que preguntan algo se quedaba para siempre, aunque la persona o el modo goal ya hubiera respondido; la persona no podía fiarse de la bandeja."
action_taken: "El bucle recuerda qué acciones pidieron cada push (avisados) y pide el resuelto de un tipo cuando ya no espera ninguna de ellas, además de la regla de antes (ninguna de ese tipo en el proyecto). Con dos avisadas espera a la última. Lo avisado se guarda en <QDD_HOME>/remoto/avisados.json (solo el servicio, solo si cambia): un reinicio entre el aviso y la respuesta (una actualización de qdd) no deja el aviso pegado, caso que señaló qdd-movile. Los ⏳ que ya esperaban al arrancar siguen sin avisarse. Decisión agregada a la ficha remoto; acordada con qdd-movile antes de mergear (en la app un *_resuelto solo cancela la notificación de ese tipo, AvisoResuelto.kt). El TestMain de pkg/remoto ahora usa aislar.Correr."
test_result: "cli/pkg/remoto/avisos_resuelto_fnd289_test.go TestAvisos_ElResueltoSaleCuandoSeRespondeLoQueSeAvisoAunqueQuedenOtras_FND289 y TestAvisos_ConDosAvisadasElResueltoEsperaALaUltima_FND289 y TestAvisos_LoAvisadoSobreviveUnReinicioYSuResueltoSale_FND289 fallaron sin el arreglo («sin push pregunta_resuelto») y pasan con él; las de FND-208 y el contrato esperas.json siguen pasando."
status: resolved
detectado_por: ia
date: "2026-11-21"
