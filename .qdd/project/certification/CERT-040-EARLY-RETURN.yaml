active: true
status: "PASSED"
version: "1.0"
id: "CERT-040-EARLY-RETURN"
name: "Zero-Else & Early Return Universal Standard"
description: "Cero sentencias else o else-if en todo el código, estructurado con cláusulas de guarda y salida temprana. No es una moda, es estrategia: cada vez menos personas leen el código línea a línea (lo escriben y revisan IAs), así que el que sí se lee tiene que entenderse de un vistazo: con guardas, cada caso especial se resuelve arriba y sale, y el camino principal queda recto, sin ramas que seguir ni estado que recordar."
category: "CleanCode"
severity: "CRITICAL"
rules:
    - type: "ast-no-else"
      target: "all"
      message: "Uso de 'else' o 'else if': resuélvelo con una cláusula de guarda (salida temprana); el código tiene que entenderse de un vistazo, porque cada vez menos personas lo leen línea a línea."
