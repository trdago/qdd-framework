blueprint: estado-por-tareas
version: 2.1.0
modulo: estado-por-tareas
respuestas:
    alcance: abiertos
    cuando: cada-avance
    destino: archivo
    en_curso: todos
    etapas: propias
    formato: mensajeria
    objetivos: si
    requieren_aprobacion: Producción
    vida: "120"
generado:
    decisiones:
        - 'Los estados son cerrados: ✅ ⏳ ❌ —'
        - La prosa acompaña a la tabla; no la reemplaza
        - 'La tabla del reporte es su primera tabla: la tarea en la primera columna y una etapa por columna'
        - 'Una celda empieza por su estado y sigue con una nota libre; la «—» es estado solo al comienzo, y otro ✅ ⏳ ❌ en la nota es un segundo estado: la celda no vale'
        - La evidencia de un ✅ es un commit (de 7 a 40 caracteres hexadecimales, con al menos un dígito), una versión semver (con o sin «v»), «n/n pruebas» con las dos cifras iguales y mayores que cero, o «corrida <id>» con al menos un dígito en el id
        - El «de quién» de un ⏳ es un rol de una lista base (la persona, QA, el CI, producción) que el proyecto puede ampliar; nunca el nombre de alguien
        - Un ❌ nombra en su nota lo que falta o falla
        - 'Requieren aprobación antes de pasar a ✅: Producción'
        - La aprobación dada se escribe «✅ … aprobado por <rol>»; la que falta, «⏳ espera aprobación de <rol>»
        - 'Un cierre se escribe en el reporte como «<tarea>: cerrada — <motivo>» o «<tarea>: descartada — <motivo>»'
        - 'El texto afirma un estado con «<tarea> · <etapa>: <estado>»; solo esas afirmaciones se comparan con la tabla, y una sobre una tarea o etapa que no está en ella también la contradice'
        - Una tarea puede depender de otras (por su id); mientras una no termine, su última etapa que aplica no pasa a ✅ ni se cierra, y la tabla la nombra «<tarea> (espera a X, Y)»
        - Una dependencia que no existe, la de una tarea consigo misma o una que cierra un ciclo no vale
        - 'Descartar una dependencia no libera a quien la espera: hay que quitarla de sus dependencias'
        - 'Credenciales y datos personales, como mínimo: correos, teléfonos, RUT u otro identificador nacional, tokens con prefijo conocido (sk-, ghp_, AKIA, xox, npm_), claves privadas, «clave=», «token=», «password=» y «Bearer …»; un proyecto puede agregar, nunca quitar'
        - 'Vocabulario «tarea»: Una línea de trabajo del proyecto; es una fila de la tabla (antes «frente»).'
        - 'Vocabulario «etapa»: Un paso por el que pasa toda tarea; es una columna de la tabla.'
        - 'Vocabulario «estado»: El valor de una celda, uno de cuatro: ✅ hecho, ⏳ en curso o esperando, ❌ falta o falla, — no aplica.'
        - 'Vocabulario «evidencia»: Lo que respalda un ✅ (commit, versión, n/n pruebas o id de corrida).'
        - 'Vocabulario «bloqueo»: Lo que espera un ⏳ y de quién.'
        - 'Vocabulario «validación real»: Ver el resultado funcionando en un uso real; no es lo mismo que desplegado.'
        - 'Vocabulario «en curso»: Una tarea que el agente declaró y que latió hace menos de la vida; el panel la muestra «● running».'
        - 'Vocabulario «pulso»: Una señal de vida de la tarea en curso: una herramienta del agente, un subagente o un comando externo (script, test, deploy o worker) que trabaja en ella.'
        - 'Vocabulario «fuente»: De dónde viene un pulso, una de tres: agente, subagente o comando.'
        - 'Vocabulario «vida»: Cuánto sigue en curso una tarea sin pulsos antes de apagarse sola; la elige cada proyecto.'
        - 'Vocabulario «dependencia»: Una tarea que otra espera; la que espera no termina antes que ella.'
        - 'Vocabulario «terminada»: Una tarea cerrada, o abierta con todas sus etapas en ✅ o —. Una descartada no termina.'
        - 'Vocabulario «objetivo»: Para qué se hacen unas tareas y cuándo se cumple (su criterio de éxito).'
        - 'Vocabulario «foco»: El objetivo abierto en el que se trabaja ahora; a lo más uno, y se muestra primero.'
        - 'Vocabulario «ciclo»: Una lista de etapas con nombre. Las etapas de la tabla son el ciclo «proyecto»; un objetivo puede seguir otro ciclo y sus tareas toman esas etapas. No es el ciclo de dependencias (una dependencia que vuelve a la misma tarea), que no vale.'
        - 'Vocabulario «actividad»: El registro de las tareas en curso y sus pulsos. Es de la máquina, vive fuera del proyecto (en la carpeta central de QDD), no es estado y no se commitea.'
        - Paso 1 · Armar la tabla de tareas (filas) por las etapas elegidas (columnas), con un estado cerrado por celda (✅ ⏳ ❌ —) → una tabla en la que cada celda tiene exactamente un estado (verifica EPF-C01)
        - Paso 2 · Exigir a cada ✅ su evidencia y a cada ⏳ qué espera y de quién; nombrar cada ❌ → celdas que un lector automático acepta o rechaza (verifica EPF-C02, EPF-C03, EPF-C09)
        - Paso 3 · Separar desplegado de validado y dejar en la celda la aprobación que falta, sin avanzar sin ella → ninguna etapa en ✅ que no lo esté de verdad (verifica EPF-C04, EPF-C06)
        - Paso 4 · Guardar de qué tareas depende cada una y rechazar la última etapa en ✅ o el cierre mientras una no termine → ninguna tarea termina antes que sus dependencias y ninguna dependencia rota o en ciclo (verifica EPT-D01, EPT-D02)
        - "Paso 5 · Agrupar las tareas bajo objetivos con su criterio, a lo más un foco, y cumplirlos solo con evidencia → una tabla con una fila \U0001F3AF por objetivo antes de sus tareas, el foco primero y las sin objetivo al final (verifica EPT-O01, EPT-O02, EPT-O03, EPT-O04, EPT-O05, EPT-O06)"
        - Paso 6 · Dejar que un objetivo siga un ciclo con sus propias etapas, sin cambiar las del proyecto ni perder avance al cambiar de ciclo → tareas con las celdas de su ciclo y una tabla por ciclo, la del proyecto primero (verifica EPT-K01, EPT-K02, EPT-K03, EPT-K04)
        - Paso 7 · Comparar cada reporte con el anterior y con su texto, y revisar que no lleve secretos → ninguna tarea desaparece sin cierre o descarte con motivo, el texto coincide con la tabla y no hay datos personales (verifica EPF-C05, EPF-C07, EPF-C08)
        - Paso 8 · Guardar la misma tabla en .qdd/project/estado.yaml en cada reporte → un archivo desde el que otro agente retoma por los ⏳, y un JSON del panel con el árbol y la pregunta de cada fila (verifica EPF-A01, EPT-A02, EPT-A03)
        - Paso 9 · Llevar al JSON del panel el ciclo de cada fila, con sus etapas y abreviaturas → filas con un símbolo por etapa de su ciclo y un panel que nombra cada ciclo bajo su objetivo (verifica EPT-K05)
        - Paso 10 · Registrar la tarea en curso fuera del proyecto, activando solo tareas abiertas y recibiendo pulsos con su fuente → una actividad que se apaga sola tras 120 s sin pulsos, al terminar o al cerrar la tarea (verifica EPT-C01, EPT-C02, EPT-C03, EPT-C05, EPT-C06)
        - Paso 11 · Aceptar los pulsos de los comandos externos que trabajan en una tarea → la tarea en curso con fuente comando (verifica EPT-C04)
        - Paso 12 · Mostrar la tarea en curso en el panel, aunque no esté entre las más nuevas → «● running» que alterna cada 1 s y destella con cada pulso, también en un panel de solo lectura (verifica EPT-C07, EPT-C08, EPT-C09, EPT-C11)
        - Paso 13 · Hacer latir las herramientas del agente y sus subagentes sin demorarlas → como mucho un pulso cada 5 s por panel, sin esperar a la CLI (verifica EPT-C10, EPT-C12)
        - 'etapas → propias: Etapas definidas por el proyecto, que nombra cuál de ellas cumple el rol de Validación real.'
        - 'cuando → cada-avance: En cada respuesta o reporte que trae avance.'
        - 'alcance → abiertos: Las tareas abiertas y las recién cerradas.'
        - 'objetivos → si: Sí. Cada objetivo tiene un criterio de éxito, uno puede ser el foco y una tarea puede no tener objetivo.'
        - Un objetivo tiene id, nombre y criterio de éxito; cada tarea dice a qué objetivo sirve, o a ninguno
        - Pueden estar abiertos varios objetivos; a lo más uno es el foco, y marcar uno desmarca al anterior
        - Un objetivo se cumple ✅ solo con evidencia de su criterio; con todas sus tareas terminadas y sin esa evidencia queda ⏳ «tareas listas, falta verificar el criterio»
        - Un objetivo abierto con tareas pendientes queda ⏳ «n/m tareas listas» (las descartadas no cuentan)
        - Un objetivo se cierra cumplido (con su evidencia) o descartado (con su motivo); sus tareas siguen en la tabla
        - "En la tabla, antes de las tareas de cada objetivo va su fila: «\U0001F3AF <objetivo>» (con «· foco» si lo es) en la primera columna, «—» en cada etapa salvo la última, que lleva su estado y su criterio"
        - "Los objetivos van con el foco primero y después en orden; las tareas sin objetivo van al final bajo una fila «\U0001F3AF sin objetivo», con todas sus etapas en «—»"
        - Una tarea que depende de otra de otro objetivo queda bajo su propio objetivo y dice «espera a X (otro objetivo)»
        - 'Las etapas elegidas son el ciclo «proyecto». Un proyecto puede declarar otros ciclos con nombre, cada uno con sus etapas, y un objetivo puede seguir uno: sus tareas toman esas etapas. Sin ciclo, el objetivo sigue el del proyecto'
        - Un blueprint que trae su propio ciclo (p. ej. las fases de ciclo-de-vida-agentico) lo declara al aplicarse y pone sus tareas bajo un objetivo que lo sigue; no cambia las etapas del proyecto
        - 'Con ciclos, el reporte trae una tabla por ciclo, cada una con sus columnas: la del proyecto primero y después cada ciclo en el orden de sus objetivos'
        - Cambiar una tarea de ciclo (por su objetivo, por el ciclo del objetivo o por las etapas del ciclo) conserva las celdas de las etapas comunes y agrega las nuevas sin empezar
        - 'destino → archivo: Además en el archivo .qdd/project/estado.yaml del proyecto.'
        - Una sesión cortada o un agente nuevo retoma desde los ⏳ del archivo, sin rehacer lo hecho
        - 'El JSON del panel trae el árbol resuelto: las filas en orden (por objetivo si los hay, el foco primero), cada una con su prefijo de dibujo («├─ », «│  └─ »), sus notas «espera a X» y la pregunta para el agente; los paneles solo lo dibujan'
        - Cada tarea cuelga de su primera dependencia visible del mismo objetivo; sin ella es raíz. Bajo un objetivo las raíces llevan conector; sin objetivos, no
        - La pregunta de una tarea es «¿Cómo vamos con «<tarea>»? Avance, bloqueos y siguiente paso; actualiza sus celdas con evidencia.»; la de un objetivo nombra también su criterio
        - 'formato → mensajeria: Texto apto para aplicaciones de mensajería.'
        - 'en_curso → todos: Sí. Laten las herramientas del agente, sus subagentes y los comandos externos que llaman a ''qdd estado pulso <tarea> --fuente comando'' (scripts, tests, deploys, workers).'
        - Los scripts largos del proyecto (tests, deploys, workers) llaman a 'qdd estado pulso <tarea> --fuente comando'
        - La tarea en curso la declara el agente al empezar a trabajarla; puede haber varias (sesiones distintas)
        - Un pulso sin tarea late la última activada; un pulso con tarea la enciende si estaba apagada
        - La vida es de 120 s sin pulsos; el panel envía como mucho un pulso cada 5 s
        - 'Se ve como «● running»: el ● alterna tenue y brillante cada 1 s y destella en acento durante un 1 s con cada pulso'
    invariantes:
        - Cada celda tiene exactamente un estado
        - 'Un ✅ lleva evidencia: commit, versión, n/n pruebas o id de corrida'
        - Un ⏳ dice qué espera y de quién
        - Una falla conocida se reporta igual como ❌ y se nombra
        - 'Desplegado no es validado: «Producción ✅ v1.2.0 y Validación real ⏳ espera ver un uso real de la persona»'
        - Lo que requiere aprobación lo dice en la celda y nunca avanza sin ella
        - Una tarea no desaparece en silencio
        - 'No hay credenciales ni datos personales en el reporte: ni en la tabla ni en el texto'
        - El texto y la tabla no se contradicen
        - Una tarea no termina antes que sus dependencias
        - Las dependencias no hacen ciclos
        - Un objetivo cumplido lleva evidencia de su criterio; terminar sus tareas no basta
        - A lo más un objetivo abierto es el foco
        - Una tarea sirve a un objetivo que existe, o a ninguno
        - Un objetivo no desaparece en silencio
        - Una tarea tiene una celda por cada etapa de su ciclo, y solo esas
        - Un objetivo sigue un ciclo que existe; un ciclo tiene etapas, sin repetir
        - 'Cambiar de ciclo nunca pierde avance: una tarea con ✅ ⏳ o ❌ en una etapa que el ciclo nuevo no tiene no cambia'
        - 'La actividad no es estado: no cambia la tabla y no se commitea'
        - Solo una tarea abierta puede estar en curso; cerrarla o descartarla la apaga
        - 'Una tarea sin pulsos durante la vida deja de estar en curso: nunca queda encendida para siempre'
        - Un pulso nunca demora ni bloquea la herramienta, el subagente o el comando que lo produjo
        - Una tarea en curso siempre se ve en el panel, aunque no esté entre las más nuevas
        - 'El latido es sutil: un destello por pulso, sin abrir ni enfocar el panel ni sonar'
        - 'La actividad no guarda credenciales ni datos personales: «quién» es una herramienta, no una persona'
aplicado_el: "2026-11-02"
