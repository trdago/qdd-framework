name: Code Quality & Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gates:
    name: Enforce Clean Code & Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Historial y tags completos: la regla VER-03 compara los commits
          # desde el último tag con el salto de versión declarado.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Build Framework
        run: |
          make build

      - name: Run Unit Tests & No-Else Rule
        run: |
          make test

      - name: Run Architecture Audit
        run: |
          make audit

  panel-windows:
    # El flujo del panel (RFC 0016) depende de cómo el sistema avisa escrituras y cierra tuberías: se prueba en Windows.
    name: Flujo del panel en Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Pruebas del flujo
        working-directory: cli
        run: go test ./pkg/consola/ -run "Seguir|SenalesDelPanel|BinarioCambio" -count=1 -v
