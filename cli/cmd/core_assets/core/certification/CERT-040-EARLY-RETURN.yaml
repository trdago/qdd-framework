tags:
    - core
active: true
id: CERT-040-EARLY-RETURN
name: Early Return and Guard Clauses Enforcement
description: |
    QDD prohíbe la palabra 'else' en todo el código, en cualquier lenguaje. No es una moda, es estrategia:
    cada vez menos personas leen el código línea a línea (lo escriben y revisan IAs), así que el que sí se lee tiene que entenderse de un vistazo: con guardas, cada caso especial se resuelve arriba y sale, y el camino principal queda recto, sin ramas que seguir ni estado que recordar.
    Todo flujo alternativo y todo error se resuelve con cláusulas de guarda (salida temprana) al inicio del bloque.
severity: CRITICAL
rules:
    - id: zero_else_policy
      regex: '\belse\b'
      message: "Uso de 'else': resuélvelo con una cláusula de guarda (salida temprana); el código tiene que entenderse de un vistazo, porque cada vez menos personas lo leen línea a línea."
      level: ERROR
      type: STRUCTURAL
      applies_to: ["*.go", "*.ts", "*.js", "*.py"]
    - id: require_early_return
      description: "Functions must fail fast and exit early on invalid conditions rather than nesting the happy path."
      level: WARNING
      type: ARCHITECTURAL
